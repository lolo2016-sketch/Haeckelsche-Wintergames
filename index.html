<script>
// Ladefehler sichtbar machen (z. B. fehlende oder veraltete Datei nach dem Hochladen)
window.APP_VERSION = '20261023c';
(function () {
  var shown = {};
  window.showLoadError = function (what) {
    if (shown[what]) return; shown[what] = 1;
    var add = function () {
      var box = document.getElementById('loadErr');
      if (!box) {
        box = document.createElement('div'); box.id = 'loadErr';
        box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#7f1d1d;color:#fff;font:13px/1.4 system-ui,sans-serif;padding:10px 12px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.4);max-height:40vh;overflow:auto';
        box.innerHTML = '<b>⚠️ Ein Teil der Seite konnte nicht geladen werden</b> (Version ' + window.APP_VERSION + ')<br>Meist fehlt eine Datei auf GitHub oder sie ist noch alt. Bitte alle Dateien neu hochladen, 2 Minuten warten, Seite neu laden.<div id="loadErrList" style="margin-top:6px;font-family:ui-monospace,monospace;font-size:12px;opacity:.9"></div>';
        document.body.appendChild(box);
      }
      var li = document.createElement('div'); li.textContent = '• ' + what; document.getElementById('loadErrList').appendChild(li);
    };
    document.body ? add() : document.addEventListener('DOMContentLoaded', add);
  };
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) {
      if (t.tagName === 'SCRIPT' || t.tagName === 'LINK') showLoadError('Datei nicht geladen: ' + (t.src || t.href).split('/').pop());
      return;
    }
    if (e.message) showLoadError(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var m = (e.reason && (e.reason.message || e.reason)) + '';
    if (/import|module|export|fetch/i.test(m)) showLoadError(m);
  });
  // Wächter: lädt die Seite nach 12 s nicht, jede eigene Datei einzeln prüfen und das Ergebnis anzeigen
  setTimeout(async function () {
    if (window.APP_READY) return;
    var src = Array.prototype.map.call(document.querySelectorAll('script[type=module]'), function (s) { return s.textContent; }).join('\n');
    var re = /(?:from\s*|import\s*\(\s*)["'](\.\/[^"']+)["']/g, m, urls = [];
    while ((m = re.exec(src))) if (urls.indexOf(m[1]) < 0) urls.push(m[1]);
    var bad = 0;
    for (var i = 0; i < urls.length; i++) {
      try { await import(new URL(urls[i], location.href).href); }
      catch (e) { bad++; showLoadError(urls[i].replace('./', '') + ': ' + (e && e.message || e)); }
    }
    if (!bad) showLoadError('Seite hängt, aber alle Dateien sind da. Bitte Seite neu laden oder Internet prüfen.');
  }, 12000);
})();
</script>

  <div id="stage"></div>
  <div id="top" class="hud"></div>
  <div id="side" class="hud"></div>
  <div id="bonusBox" class="hud"></div>
  <div id="bottom" class="hud" style="display:none">
    <div class="chatlog glass" id="chatLog" style="display:none"></div>
    <form class="chatbar glass" id="chatForm" autocomplete="off">
      <input id="chatIn" maxlength="120" placeholder="Nachricht an alle …" enterkeyhint="send">
      <button type="submit">Senden</button>
      <button type="button" class="ghost" id="chatToggle">💬</button>
    </form>
    <nav class="tabbar" id="tabbar"></nav>

  <div id="panel" hidden><button class="close" id="panelClose" aria-label="Schließen">✕</button><div id="panelBody"></div></div>
  <div id="app"><div class="card"><p>Lade …</p></div></div>

  <script type="module">
    // ?v=… hinter den eigenen Dateien: zwingt Handys, nach einem Update alle Dateien neu zu laden
    // (sonst mischt der Browser-Zwischenspeicher alte und neue Dateien). Bei jedem Update hochzählen.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, collection, onSnapshot, addDoc, query, orderBy, limit, arrayUnion, increment
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { playSnake, playReplay } from "./minigame.js?v=20261023c";
    import { playDialog, SZENEN, mergeConfig } from "./dialog.js?v=20261023c";
    import { playBiathlon, playBiathlonReplay, formatBiathlon } from "./biathlon.js?v=20261023c";
    import { createHall } from "./hall.js?v=20261023c";
    import { PHASES, PHASE_NAMES, phaseIndex, settings, country, teamColor, isPerson, playedSnake, compareSnake, snakeRanking,
      playedBiathlon, teamBiathlon, bonusOf, teamBonus, guessedRight, planTeams,
      FINAL_TEAMS, PENALTY_S, finalMembers, finalCaptain, finalBonus, finalScoreMs, fmtClock, weaponName,
      finalStage, RIDDLES, WORD2, WORD2_TRIES, riddleRight, word2Shown, word2Tiles, normAnswer, WORD3, CANS } from "./draft.js?v=20261023c";
    window.APP_READY = true;   // alle Dateien geladen

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    // Demo: index.html?demo (einlaufen), ?demo=raten (Flagge raten + Auflösung), ?demo=finale (Tür + Rätsel 1)
    const DEMO = params.has('demo') ? (['raten', 'wahl', 'kapitaen'].includes(params.get('demo')) ? 'guess' : params.get('demo') === 'finale' ? 'final' : 'enter') : null;
    let token = DEMO ? 'demo-me' : params.get('t');
    const root = document.getElementById('app');
    const tabbar = document.getElementById('tabbar');

    let tab = 'hall';
    let S = null;            // aktueller Datenstand: { me, state, teams, people }
    let hall = null;         // 3D- oder 2D-Halle
    let hall3dMod = null;    // wird nur geladen, wenn der Browser 3D kann
    let saving = false;
    let showFlag = false, flagTimer = null;    // eigene Flagge nur auf Antippen zeigen (Sitznachbarn schauen mit!)
    // ---------- Chat ----------
    // Regel: Über dem Kopf steht immer die neueste Nachricht einer Person (bleibt stehen, bis sie etwas Neues schreibt).
    // Die letzten 5 Nachrichten pro Person sieht man durch Antippen der Figur, alles im Chatverlauf.
    const MAX_LEN = 120, MIN_GAP_MS = 3000;
    let messages = [];          // neueste zuerst, max. 100
    let chatOpen = false, unread = 0, lastSent = 0;
    // Einlauf genau einmal: beim allerersten Öffnen des eigenen Links (dann wird arrivedAt gespeichert).
    // Danach sitzt man immer direkt auf seinem Platz, auch auf anderen Geräten.
    let needsEntrance = false;

    // ---------- Live-Daten aus Firebase ----------
    function subscribe() {
      const parts = {}, teams = {}, finals = {};
      let state = { phase: 'setup' };
      const ready = { p: false, t: false, s: false };
      const changed = () => { if (ready.p && ready.t && ready.s) onData(build(parts, teams, state, finals)); };
      // Spielstand des Finales pro Team (A–D)
      onSnapshot(collection(db, 'finals'), snap => {
        snap.docChanges().forEach(c => { if (c.type === 'removed') delete finals[c.doc.id]; else finals[c.doc.id] = { id: c.doc.id, ...c.doc.data() }; });
        changed();
      }, () => {});
      onSnapshot(collection(db, 'participants'), snap => {
        snap.docChanges().forEach(c => { if (c.type === 'removed') delete parts[c.doc.id]; else parts[c.doc.id] = { token: c.doc.id, ...c.doc.data() }; });
        ready.p = true; changed();
      }, err => showError(err));
      onSnapshot(collection(db, 'teams'), snap => {
        snap.docChanges().forEach(c => { if (c.type === 'removed') delete teams[c.doc.id]; else teams[c.doc.id] = { id: c.doc.id, ...c.doc.data() }; });
        ready.t = true; changed();
      }, err => showError(err));
      onSnapshot(query(collection(db, 'chat'), orderBy('at', 'desc'), limit(100)), snap => {
        const before = messages.length ? messages[0].at : Date.now();
        messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const fresh = messages.filter(m => m.at > before && m.token !== token).length;
        onMessages(fresh);
      }, () => {});
      onSnapshot(doc(db, 'state', 'current'), snap => {
        state = snap.exists() ? snap.data() : { phase: 'setup' };
        ready.s = true; changed();
      }, err => showError(err));
    }
    // Alle außer Admins sind Teilnehmer (frühere Rollen Kapitän/Spieler spielen keine Rolle mehr)
    function build(parts, teams, state, finals = {}) {
      return { me: parts[token] ?? null, state: { ...state }, teams: { ...teams }, finals: { ...finals }, people: Object.values(parts).filter(isPerson) };
    }
    function showError(err) {
      root.innerHTML = `<div class="card"><p>Verbindung zur Datenbank fehlgeschlagen: ${escapeHtml(err.message)}</p></div>`;
    }

    let renderTimer = null;
    function onData(s) {
      if (!s.me) { root.innerHTML = '<div class="card"><p>Unbekannter Link. Bitte beim Organisator melden.</p></div>'; return; }
      const firstTime = !S;
      const phaseChanged = S && S.state.phase !== s.state.phase;
      S = s;
      if (firstTime) {
        // Ankunft speichern: bestimmt den Sitzplatz (die Erste sitzt mittig, dann abwechselnd links/rechts)
        if (DEMO === 'enter') needsEntrance = true;
        if (!DEMO && !S.me.arrivedAt && S.me.role !== 'admin') {
          needsEntrance = true;
          S.me.arrivedAt = Date.now();
          updateDoc(doc(db, 'participants', token), { arrivedAt: S.me.arrivedAt }).catch(() => {});
        }
        renderTabbar(); renderTab(); return;
      }
      clearTimeout(renderTimer);
      renderTimer = setTimeout(() => {
        if (saving) return;
        renderTabbar();
        renderTop(); updateHall();
        if (tab !== 'hall' || phaseChanged) renderTab();
        maybePhaseDialog();
      }, 120);
    }

    // ---------- Hilfen ----------
    const teamList = s => Object.values(s.teams).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
      .map((t, i) => ({ ...t, css: teamColor(t.order ?? i) }));
    const teamOf = (s, p) => p?.teamId ? teamList(s).find(t => t.id === p.teamId) ?? null : null;
    const personName = (s, tok) => s.people.find(p => p.token === tok)?.name ?? '?';
    const teamMates = (s, p) => p?.teamId ? s.people.filter(x => x.teamId === p.teamId && x.token !== p.token) : [];
    const PH = s => phaseIndex(s.state.phase);                 // Phase als Zahl (alte Namen werden übersetzt)
    const isPhase = (s, name) => PH(s) === phaseIndex(name);
    const revealed = s => PH(s) >= phaseIndex('pairs');        // Flaggen/Teams aufgelöst?
    const fmtS = ms => `${Math.floor(ms / 60000)}:${((ms % 60000) / 1000).toFixed(1).padStart(4, '0')}`;   // wie die Einzelzeiten, z. B. 1:29.9
    const dot = css => `<span style="display:inline-block;width:.75em;height:.75em;border-radius:50%;background:${css};vertical-align:-1px;margin-right:4px"></span>`;
    const biathlonLeft = s => Math.max(0, settings(s.state).biathlonAttempts - (s.me.biathlonTries || 0));

    // ---------- Tabs ----------
    function tabsFor() {
      return [{ id: 'hall', icon: '🏟️', label: 'Halle' }, { id: 'game', icon: '🎮', label: 'Minispiel' }, { id: 'board', icon: '🏆', label: 'Leaderboard' }];
    }
    function renderTabbar() {
      const needsPlay = (isPhase(S, 'snake') && !playedSnake(S.me)) || (isPhase(S, 'biathlon') && biathlonLeft(S) > 0)
        || (isPhase(S, 'guess') && !S.me.guess);
      tabbar.innerHTML = tabsFor().map(t => `<button data-tab="${t.id}" class="glass ${t.id === tab ? 'active' : ''}">
          <span>${t.icon}</span>${t.label}${(t.id === 'game' && needsPlay && !isPhase(S, 'guess')) || (t.id === 'hall' && needsPlay && isPhase(S, 'guess')) ? '<i class="dot"></i>' : ''}</button>`).join('');
      tabbar.querySelectorAll('button').forEach(b => b.onclick = () => {
        tab = tab === b.dataset.tab ? 'hall' : b.dataset.tab;   // nochmal tippen = zurück zur Halle
        renderTabbar(); renderTab();
      });
    }

    // Oben schwebend: Name, eigene Flagge (geheim, auf Antippen), Team, Hinweis-Banner, eigene letzte Nachricht
    function renderTop() {
      const t = teamOf(S, S.me);
      const c = country(S.me.flag);
      const demo = DEMO ? `<div class="chip glass demo">🧪 Demo · nichts wird gespeichert</div>` : '';
      // Hinweis-Banner gibt es nicht mehr – erklärt wird in den Dialog-Szenen (💬)
      document.getElementById('top').innerHTML = `${demo}<div style="display:flex;gap:6px;flex-wrap:wrap">
        <div class="chip glass">👋 ${escapeHtml(S.me.name)}${t ? ` · ${dot(t.css)}${escapeHtml(t.name)}` : ''}</div></div>
        <div class="my-msg" id="myMsg"></div>`;
      renderBonus();
      refreshBubbles();
    }

    // Oben rechts: eigener Vorsprung fürs Finale (Snake, Raten, richtige Dialog-Antworten)
    let lastBonus = null;
    function renderBonus() {
      const b = bonusOf(S.me, S.people, S.state, revealed(S));
      const box = document.getElementById('bonusBox'); if (!box) return;
      const parts = [b.snake && `Snake ${b.snake}`, b.guess && `Raten ${b.guess}`, b.dialog && `Dialoge ${b.dialog}`].filter(Boolean).join(' · ');
      box.innerHTML = `<div class="chip glass" title="Dein Vorsprung fürs Finale${parts ? ': ' + parts : ''}">⏱ +${b.total} s</div>`;
      if (lastBonus != null && b.total > lastBonus) box.firstElementChild.classList.add('pop');
      lastBonus = b.total;
    }

    // Die Halle bleibt immer im Hintergrund; Minispiel und Leaderboard öffnen sich als Fenster darüber
    function renderTab() {
      document.getElementById('app').innerHTML = '';
      document.getElementById('bottom').style.display = '';
      ensureHall();
      renderTop();
      const panel = document.getElementById('panel');
      const chat = [document.getElementById('chatForm'), document.getElementById('chatLog')];
      if (tab === 'hall') {
        panel.hidden = true;
        chat[0].style.display = ''; chat[1].style.display = chatOpen ? '' : 'none';
        return;
      }
      panel.hidden = false;
      chat.forEach(c => { c.style.display = 'none'; });
      if (tab === 'game') renderGameTab(); else renderBoardTab();
    }

    // ---------- Banner ----------
    function bannerHtml() { return glassBanner(bannerHtmlRaw()); }
    function bannerHtmlRaw() {
      const s = S, me = s.me, st = settings(s.state);
      const bonusTxt = () => { const b = teamOf(s, me) ? teamBonus(teamOf(s, me), s.people, s.state, true) : bonusOf(me, s.people, s.state, true); return b.total; };
      if (isPhase(s, 'setup')) {
        const n = s.people.filter(p => p.arrivedAt).length;
        return `<div class="banner">Willkommen bei den Wintergames! <strong>${n}</strong> sitzen schon in der Runde. Gleich geht's los. 🏁</div>`;
      }
      if (isPhase(s, 'snake')) {
        const rank = snakeRanking(s.people).findIndex(p => p.token === me.token);
        if (!playedSnake(me)) return `<div class="banner myturn">Runde 1: <strong>Winter-Snake</strong>! Spiel im Tab 🎮 so oft du willst, dein bester Versuch zählt. Platz 1–${st.snakeBonus.length} bekommen Bonussekunden fürs Finale.</div>`;
        return `<div class="banner">Runde 1: Winter-Snake · dein Bestwert <strong>${me.minigameScore} 🎅</strong> (Platz ${rank + 1}). Du kannst es weiter versuchen!</div>`;
      }
      if (isPhase(s, 'guess')) {
        const n = s.people.filter(p => p.guess).length;
        if (!me.guess) return `<div class="banner myturn">Wer hat <strong>dieselbe Flagge</strong> wie du? Tippe die Person in der Halle an. 🤫 Deine Flagge niemandem verraten!</div>`;
        return `<div class="banner">Dein Tipp: <strong>${escapeHtml(personName(s, me.guess))}</strong>. Bis zur Auflösung kannst du ihn noch ändern (andere Person antippen). ${n} von ${s.people.length} haben getippt.</div>`;
      }
      const t = teamOf(s, me), mates = teamMates(s, me);
      const right = guessedRight(me, s.people);
      const teamTxt = t ? `Dein Team: <strong>${escapeHtml(t.name)}</strong>${mates.length ? ` mit <strong>${escapeHtml(mates.map(m => m.name).join(' & '))}</strong>` : ''}.` : '';
      if (isPhase(s, 'pairs')) {
        return `<div class="banner">Auflösung! 🎉 ${teamTxt} ${me.guess ? (right ? `Du hast richtig geraten ✅ (+${st.guessBonus} s).` : 'Dein Tipp war leider falsch ❌.') : ''}
          Euer Vorsprung fürs Finale: <strong>${bonusTxt()} s</strong>.</div>`;
      }
      if (isPhase(s, 'biathlon')) {
        const left = biathlonLeft(s);
        return `<div class="banner ${left ? 'myturn' : ''}">Runde 2: <strong>Biathlon</strong>! ${left ? `Du hast noch <strong>${left}</strong> echte${left === 1 ? 'n Versuch' : ' Versuche'} (Tab 🎮).` : 'Deine Versuche sind verbraucht.'}
          Eure beiden Bestzeiten werden addiert. ${teamTxt}</div>`;
      }
      if (isPhase(s, 'final')) {
        const L = me.finalTeam, fin = s.finals?.[L], cap = L ? finalCaptain(L, s.people) : null;
        if (!L) return `<div class="banner">Das Finale ist freigegeben! Du bist noch keinem Finale-Team zugeordnet – sag dem Organisator Bescheid.</div>`;
        const mem = finalMembers(L, s.people).map(p => p.name).join(', ');
        if (fin?.solved3At) return `<div class="banner">🏆 Team ${L} hat das Finale geschafft! Wertung: <strong>${fmtClock(finalScoreMs(fin, finalBonus(L, s.people, s.state)))}</strong>.</div>`;
        if (fin?.startedAt) return `<div class="banner myturn">Team ${L} ist im Finale! Schalte den Agentenmodus 🕶️ ein und tippe die leuchtende Tür unten im Eis-Pokal an, um wieder hineinzugehen.</div>`;
        return `<div class="banner myturn">🏆 Das <strong>Finale</strong> ist freigegeben! Verabredet euch als Team ${L} (${escapeHtml(mem)}).
          ${cap?.token === me.token ? '<strong>Du bist Kapitän:</strong> Wenn alle bereit sind, schalte den Agentenmodus 🕶️ ein und tippe die leuchtende Tür unten im Eis-Pokal an. Dann läuft eure Uhr.' : `Euer Kapitän <strong>${escapeHtml(cap?.name ?? '?')}</strong> öffnet die Tür unten im Eis-Pokal (Agentenmodus 🕶️).`}</div>`;
      }
      const tb = t ? teamBiathlon(t, s.people) : null;
      return `<div class="banner">Biathlon ist beendet. ${teamTxt}${tb?.done ? ` Eure Zeit: <strong>${fmtS(tb.timeMs)}</strong>.` : ''} Vorsprung fürs Finale: <strong>${bonusTxt()} s</strong>.</div>`;
    }
    // Banner-Klassen: halbdurchsichtig über der Halle
    const glassBanner = html => html.replace('class="banner"', 'class="banner glass"').replace('class="banner myturn"', 'class="banner glass myturn"');

    // ---------- Halle ----------
    // Wer ist schon da? (angekommen, oder man selbst)
    function present() {
      return S.people.filter(p => p.arrivedAt || p.token === token);
    }
    function hallData3d() {
      const teams = teamList(S).map(t => ({ id: t.id, captainToken: t.captainToken, order: t.order ?? 0, color: parseInt(t.css.slice(1), 16) }));
      // Nach der Auflösung steht die Flagge vor dem Namen über dem Kopf
      const people = present().map(p => {
        const shown = unmasked(p), c = country(p.flag);
        return { ...p, agent: !shown, flagEmoji: (revealed(S) || shown) && c ? c.emoji : null };   // Flagge steht über dem Namen
      });
      const pickTokens = isPhase(S, 'guess') && S.me.guess ? [S.me.guess] : [];   // der eigene Tipp leuchtet (nur bei mir)
      return { people, teams, pickTokens, turnToken: null, benchSeats: S.state.benchSeats };
    }
    // Einfache 2D-Halle (sehr alte Handys)
    function hallData2d() {
      const cols = teamList(S).map((t, j) => ({ teamId: t.id, captainToken: null, color: t.css, j }));
      return { players: present(), captains: [], columns: cols, turnTeamId: null };
    }
    function updateHall() {
      if (!hall) return;
      const ab = document.getElementById('agentBtn');
      if (ab) { const on = (S.me.revealUntil || 0) > Date.now(); ab.classList.toggle('agent-on', on); ab.title = on ? 'Du bist gerade enttarnt' : 'Flagge: enttarnen / ausspionieren'; }
      if (hall.is3d) { hall.update(hallData3d()); hall.setAgentMode(true); hall.setDoorActive(isPhase(S, 'final')); }   // Agenten-Welt immer an
      else hall.update(hallData2d(), { pickable: false });
      syncFinal();
    }

    let hallStarting = false;
    async function ensureHall() {
      if (hall || hallStarting) return;
      hallStarting = true;
      const wrap = document.getElementById('stage');
      const side = document.getElementById('side');
      side.innerHTML = `<button class="round glass" id="agentBtn" style="display:none" title="Flagge: enttarnen / ausspionieren">🏳️</button>
        <button class="round glass" id="viewBtn" style="display:none" title="Ansicht wechseln"></button>
        <button class="round glass" id="dlgBtn" title="Erklärung nochmal ansehen">💬</button>
        ${DEMO ? '<button class="round glass" id="replayIntro" title="Einlauf nochmal">▶</button>' : ''}`;
      document.getElementById('dlgBtn').onclick = () => replayDialogs();
      const dlgParam = params.get('dialog');
      if (dlgParam) setTimeout(() => previewDialogs(dlgParam), 1500);
      const tapToken = t => {
        const p = S.people.find(x => x.token === t);
        if (!p) return;
        if (isPhase(S, 'guess') && p.token !== token) return askGuess(p);
        showPersonMessages(p);
      };

      // 3D, wenn möglich, sonst die einfache 2D-Halle
      let use3d = false;
      try {
        hall3dMod ??= await import('./hall3d.js?v=20261023c');
        use3d = hall3dMod.webglAvailable();
      } catch (e) { use3d = false; console.error(e); window.showLoadError?.('3D-Halle: ' + (e?.message || e)); }

      if (use3d) {
        hall = hall3dMod.createHall3D(wrap, { meToken: token, onPersonTap: tapToken, onDoorTap: () => onDoor() });
        hall.is3d = true;
        updateHall();
        refreshBubbles();
        const hint = document.createElement('div');
        hint.className = 'hall-hint'; hint.textContent = '👆 Wischen zum Umschauen';
        wrap.appendChild(hint);
        setTimeout(() => { hint.style.opacity = '0'; }, 5000);
        const vb = document.getElementById('viewBtn');
        const setBtn = () => {
          const v = hall.getView();
          vb.textContent = v === 'orbit' ? '🧍' : '🎥';
          vb.title = v === 'orbit' ? 'Ich-Sicht' : 'Rundumblick';
          hint.textContent = v === 'orbit' ? '👆 Wischen = drehen · 2 Finger = Zoom' : '👆 Wischen zum Umschauen';
        };
        vb.style.display = ''; setBtn();
        vb.onclick = () => {
          if (['follow', 'toEyes'].includes(hall.getView())) return;   // während des Einlaufs nicht umschalten
          hall.setView(hall.getView() === 'orbit' ? 'first' : 'orbit'); setBtn();
          hint.style.opacity = '1'; clearTimeout(hint._t); hint._t = setTimeout(() => { hint.style.opacity = '0'; }, 4000);
        };
        // Agentenmodus an/aus: alle sehen das Agentenbild, man selbst sieht die Welt rot
        const ab = document.getElementById('agentBtn');
        ab.style.display = '';
        ab.onclick = () => flagMenu();
        updateHall();
        if (needsEntrance) runEntrance(setBtn);
        const rb = document.getElementById('replayIntro');
        if (rb) rb.onclick = () => runEntrance(setBtn);
      } else {
        wrap.classList.add('flat');
        hall = createHall(wrap, { meToken: token, onPlayerTap: p => tapToken(p.token) });
        updateHall();
        if (needsEntrance) {
          needsEntrance = false; entranceRunning = true;
          (async () => { for (const id of scenesFor('einlauf')) await showDialog(id); hall.playIntro(); entranceRunning = false; maybePhaseDialog(); })();
        }
        const rb = document.getElementById('replayIntro');
        if (rb) rb.onclick = () => hall.playIntro();
      }
      hallStarting = false;
    }
    // ---------- Enttarnen und Ausspionieren ----------
    // Alle sind Agenten. Enttarnen: 5 Minuten sehen alle dein Gesicht und deine Flagge (beliebig oft).
    // Ausspionieren: einmal insgesamt siehst nur du 1 Minute lang Gesicht und Flagge einer anderen Person.
    const REVEAL_MS = 5 * 60000, SPY_MS = 60000;
    const unmasked = p => (p.revealUntil || 0) > Date.now() || (p.token === S.me.spyUsed && (S.me.spyAt || 0) + SPY_MS > Date.now());
    setInterval(() => { if (S && hall) updateHall(); }, 3000);     // Ablauf der Zeiten
    const mmss = ms => `${Math.floor(ms / 60000)}:${String(Math.ceil(ms % 60000 / 1000) % 60).padStart(2, '0')}`;
    function setMe(upd) {
      const me = { ...S.me, ...upd };
      S = { ...S, me, people: S.people.map(p => p.token === token ? me : p) };
      updateHall();
      if (!DEMO) updateDoc(doc(db, 'participants', token), upd).catch(err => alert('Speichern fehlgeschlagen: ' + err.message));
    }
    function flagMenu() {
      const c = country(S.me.flag), now = Date.now();
      const revealLeft = (S.me.revealUntil || 0) - now;
      const spyTarget = S.me.spyUsed ? S.people.find(p => p.token === S.me.spyUsed) : null;
      const spyLeft = spyTarget ? (S.me.spyAt || 0) + SPY_MS - now : 0;
      const others = present().filter(p => p.token !== token).sort((a, b) => String(a.name).localeCompare(String(b.name), 'de'));
      const bg = modal(`<h2 style="margin:0 0 6px">🏳️ Deine Flagge</h2>
        <p style="margin:0 0 12px;font-size:1.1rem">${c ? `${c.emoji} <strong>${escapeHtml(c.name)}</strong> <span style="color:#888">· 🤫 geheim</span>` : 'Du hast noch keine Flagge.'}</p>
        <h3 style="margin:10px 0 4px">🕶️ Enttarnen</h3>
        <p style="margin:0 0 8px;color:#555">Alle sehen 5 Minuten lang dein Gesicht${c ? ' und deine Flagge' : ''}.</p>
        ${revealLeft > 0 ? `<p><strong>Du bist enttarnt</strong> – noch ${mmss(revealLeft)}.</p><button class="secondary" data-a="hide">Wieder tarnen</button>`
          : `<button data-a="reveal">Mich 5 Minuten enttarnen</button>`}
        <h3 style="margin:16px 0 4px">🔍 Ausspionieren (einmal)</h3>
        ${spyTarget ? `<p style="margin:0;color:#555">Du hast <strong>${escapeHtml(spyTarget.name)}</strong> ausspioniert${spyLeft > 0 ? ` – noch ${mmss(spyLeft)} sichtbar.` : '. Das geht nur einmal.'}</p>`
          : `<p style="margin:0 0 8px;color:#555">Nur du siehst 1 Minute lang Gesicht und Flagge einer Person. Geht nur ein einziges Mal!</p>
             <select id="spySel" style="width:100%;font-size:16px;margin-bottom:8px"><option value="">– Person wählen –</option>${others.map(p => `<option value="${p.token}">${escapeHtml(p.name)}</option>`).join('')}</select>
             <button data-a="spy">Ausspionieren</button>`}
        <div style="margin-top:14px"><button class="secondary" data-a="close">Schließen</button></div>`);
      bg.querySelector('[data-a=close]').onclick = () => bg.remove();
      bg.querySelector('[data-a=reveal]')?.addEventListener('click', () => { bg.remove(); setMe({ revealUntil: Date.now() + REVEAL_MS }); toast('🕶️ Du bist jetzt 5 Minuten für alle enttarnt.'); });
      bg.querySelector('[data-a=hide]')?.addEventListener('click', () => { bg.remove(); setMe({ revealUntil: null }); toast('🕶️ Du bist wieder getarnt.'); });
      bg.querySelector('[data-a=spy]')?.addEventListener('click', () => {
        const tok = bg.querySelector('#spySel').value; if (!tok) return toast('Bitte erst eine Person wählen.');
        const name = S.people.find(p => p.token === tok)?.name ?? '?';
        if (!confirm(`${name} ausspionieren? Das geht nur ein einziges Mal.`)) return;
        bg.remove(); setMe({ spyUsed: tok, spyAt: Date.now() }); toast(`🔍 ${name} ist jetzt 1 Minute lang für dich enttarnt.`, 3000);
      });
    }
    async function runEntrance(setBtn) {
      needsEntrance = false;
      entranceRunning = true;
      for (const id of scenesFor('einlauf')) await showDialog(id);
      await hall.playEntrance();
      entranceRunning = false;
      setBtn?.();
      maybePhaseDialog();
    }

    // ---------- Dialoge (dialog.js): Texte/Bilder/Zeitpunkt kommen aus dem Admin (Firebase state/dialoge) ----------
    let dialogOpen = false, entranceRunning = false;
    let dlgCfg = mergeConfig(null);
    onSnapshot(doc(db, 'state', 'dialoge'), snap => { dlgCfg = mergeConfig(snap.exists() ? snap.data() : null); }, () => {});
    const seenLocal = new Set();
    const dialogSeen = id => seenLocal.has(id) || (S?.me?.dialogsSeen || []).includes(id);
    const scenesFor = wann => SZENEN.map(z => z.id).filter(id => dlgCfg.szenen[id]?.wann === wann);
    function dialogVars() {
      const st = settings(S.state), me = S.me, L = me.finalTeam, fin = L ? S.finals?.[L] : null;
      const mates = L ? finalMembers(L, S.people).filter(p => p.token !== me.token).map(p => p.name) : [];
      const und = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' und ' + a[a.length - 1] : (a[0] ?? '');
      return {
        snakeBonus: st.snakeBonus.map((b, i) => `Platz ${i + 1} bekommt ${b} s`).join(', '),
        guessBonus: st.guessBonus, biathlonVersuche: st.biathlonAttempts,
        partner: und(teamMates(S, me).map(p => p.name)) || 'dein Partner',
        finaleTeam: L || '?', mitspieler: und(mates), kapitaen: (L && finalCaptain(L, S.people)?.name) || 'euer Kapitän',
        finaleZeit: fin?.solved3At ? fmtClock(finalScoreMs(fin, finalBonus(L, S.people, S.state))) : ''
      };
    }
    // Szenen mit Platzhaltern zum Finale-Team/Partner warten, bis es die Angaben gibt
    function sceneReady(id) {
      const txt = JSON.stringify(dlgCfg.szenen[id]?.zeilen || []);
      if (/\{(finaleTeam|mitspieler|kapitaen)\}/.test(txt) && !S.me.finalTeam) return false;
      if (/\{partner\}/.test(txt) && !teamMates(S, S.me).length) return false;
      if (/\{finaleZeit\}/.test(txt) && !S.finals?.[S.me.finalTeam]?.solved3At) return false;
      return true;
    }
    async function showDialog(id, { force = false } = {}) {
      if (dialogOpen || !dlgCfg.szenen[id] || (!force && dialogSeen(id))) return;
      dialogOpen = true;
      try {
        await playDialog(id, { cfg: dlgCfg, name: S.me.name, agentUrl: S.me.agentUrl || 'agents/agent1.png', vars: dialogVars(), wertung: !force,
          onAnswer: (zeile, k, right) => {
            if (force || !right) return;
            const key = `${id}:${zeile}`; if ((S.me.dialogPoints || []).includes(key)) return;
            const me = { ...S.me, dialogPoints: [...(S.me.dialogPoints || []), key] };
            S = { ...S, me, people: S.people.map(p => p.token === token ? me : p) }; renderBonus();
            if (!DEMO) updateDoc(doc(db, 'participants', token), { dialogPoints: arrayUnion(key) }).catch(() => {});
          } });
      } finally { dialogOpen = false; }
      seenLocal.add(id);
      if (!DEMO && !force) updateDoc(doc(db, 'participants', token), { dialogsSeen: arrayUnion(id) }).catch(() => {});
    }
    // Zum passenden Zeitpunkt jede Szene einmal zeigen – aber nicht mitten im Spiel, im Finale oder beim Einlauf
    function currentScenes() {
      const list = scenesFor(PHASES[PH(S)]);
      if (S.me.finalTeam && S.finals?.[S.me.finalTeam]?.solved3At) list.push(...scenesFor('finaleGeschafft'));
      return list;
    }
    function maybePhaseDialog() {
      if (!S || dialogOpen || entranceRunning || needsEntrance || inFinal || saving) return;
      if (document.querySelector('.sg-overlay, .bg-ov, .modal-bg, #finDone')) return;
      const id = currentScenes().find(x => !dialogSeen(x) && sceneReady(x));
      if (id) showDialog(id);
    }
    setInterval(maybePhaseDialog, 2500);    // falls gerade ein Spiel offen war: danach nachholen
    // 💬: die Szene(n) der aktuellen Phase nochmal ansehen
    async function replayDialogs() {
      const list = currentScenes().filter(sceneReady);
      for (const id of (list.length ? list : scenesFor('einlauf'))) await showDialog(id, { force: true });
    }
    // Vorschau: index.html?...&dialog=snake (eine Szene) oder &dialog=alle (alle nacheinander)
    async function previewDialogs(which) {
      const ids = which === 'alle' ? SZENEN.map(z => z.id) : [which];
      for (const id of ids) await showDialog(id, { force: true });
    }

    // ---------- Chat-Funktionen ----------
    function onMessages(freshCount) {
      if (!chatOpen && freshCount) unread += freshCount;
      refreshBubbles();
      renderChatLog();
    }
    function refreshBubbles() {
      if (!hall?.setBubble || !S) return;
      const newest = {};
      for (const m of messages) if (!newest[m.token]) newest[m.token] = m;
      for (const p of S.people) {
        const m = newest[p.token];
        hall.setBubble(p.token, m ? m.text : null);
      }
      const my = document.getElementById('myMsg');
      if (my) {
        const m = newest[token];
        my.style.display = m ? 'block' : 'none';
        if (m) my.innerHTML = `💬 <b>Du:</b> ${escapeHtml(m.text)}`;
      }
    }
    setInterval(refreshBubbles, 2000);

    function fmtTime(at) { const d = new Date(at); return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }
    function renderChatLog() {
      const log = document.getElementById('chatLog');
      const tg = document.getElementById('chatToggle');
      if (tg) tg.innerHTML = `${chatOpen ? '✕' : '💬'}${!chatOpen && unread ? `<span class="badge">${unread}</span>` : ''}`;
      if (!log || !chatOpen) return;
      const list = messages.slice(0, 40).reverse();
      log.innerHTML = list.length ? list.map(m => `<div class="m${m.token === token ? ' mine' : ''}"><b>${escapeHtml(m.name)}</b>
          <span class="t">${fmtTime(m.at)}</span><br>${escapeHtml(m.text)}</div>`).join('')
        : '<div class="m" style="color:#94a3b8">Noch keine Nachrichten. Sag Hallo! 👋</div>';
      log.scrollTop = log.scrollHeight;
    }
    function wireChat() {
      document.getElementById('chatToggle').onclick = () => {
        chatOpen = !chatOpen; if (chatOpen) unread = 0;
        document.getElementById('chatLog').style.display = chatOpen && tab === 'hall' ? '' : 'none';
        renderChatLog();
      };
      document.getElementById('chatForm').onsubmit = async e => {
        e.preventDefault();
        const inp = document.getElementById('chatIn');
        const text = inp.value.trim().slice(0, MAX_LEN);
        if (!text) return;
        if (Date.now() - lastSent < MIN_GAP_MS) { inp.placeholder = 'Kurz warten …'; return; }
        lastSent = Date.now();
        inp.value = ''; inp.placeholder = 'Nachricht an alle …';
        const msg = { token, name: S.me.name, text, at: Date.now() };
        if (DEMO) { messages.unshift({ id: 'd' + msg.at, ...msg }); onMessages(0); return; }
        try { await addDoc(collection(db, 'chat'), msg); }
        catch (err) { inp.value = text; alert('Senden fehlgeschlagen: ' + err.message); }
      };
      renderChatLog();
    }
    // Antippen einer Figur (wenn gerade nicht gewählt wird): ihre letzten 5 Nachrichten
    // Person antippen: nur ihr Agentenbild und ihr Name
    const agentImg = p => `<img src="${escapeHtml(p.agentUrl || 'agents/agent1.png')}" alt="" onerror="this.remove()" style="height:min(44vh,320px);width:auto;max-width:100%;object-fit:contain;background:none;border-radius:12px">`;
    function showPersonMessages(p) {
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal" style="text-align:center">${agentImg(p)}
        <h2 style="margin:8px 0 10px">${escapeHtml(p.name)}</h2>
        <button data-a="ok">Schließen</button></div>`;
      document.body.appendChild(bg);
      bg.onclick = e => { if (e.target === bg || e.target.dataset.a === 'ok') bg.remove(); };
    }

    // ---------- Raten: wer hat dieselbe Flagge? ----------
    function askGuess(p) {
      if (!isPhase(S, 'guess') || saving) return;
      const cur = S.me.guess && S.me.guess !== p.token ? personName(S, S.me.guess) : null;
      const same = S.me.guess === p.token;
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal">
        ${agentImg(p)}
        <h2 style="margin:8px 0 6px">${escapeHtml(p.name)}</h2>
        <p style="margin:0 0 12px;color:#555">${same ? 'Das ist dein aktueller Tipp.' : `Hat ${escapeHtml(p.name)} dieselbe Flagge wie du?`}
          ${cur ? `<br><span style="font-size:.85rem">Bisheriger Tipp: ${escapeHtml(cur)}</span>` : ''}</p>
        <button class="secondary" data-a="no">${same ? 'Schließen' : 'Abbrechen'}</button>${same ? '' : '<button data-a="yes">Ja, mein Tipp!</button>'}
</div>`;
      document.body.appendChild(bg);
      bg.querySelector('[data-a=no]').onclick = () => bg.remove();
      bg.onclick = e => { if (e.target === bg) bg.remove(); };
      bg.querySelector('[data-a=yes]')?.addEventListener('click', async () => { bg.remove(); await saveGuess(p); });
    }
    async function saveGuess(p) {
      if (DEMO) return demoGuess(p);
      saving = true;
      try {
        const st = (await getDoc(doc(db, 'state', 'current'))).data();
        if (phaseIndex(st.phase) !== phaseIndex('guess')) { alert('Die Auflösung läuft schon, Tipps sind geschlossen.'); return; }
        await updateDoc(doc(db, 'participants', token), { guess: p.token, guessAt: Date.now() });
      } catch (err) {
        alert('Speichern fehlgeschlagen: ' + err.message);
      } finally { saving = false; }
    }

    // ---------- Minispiele: Snake (Runde 1) und Biathlon (Runde 2) ----------
    const GAMES = {
      snake: {
        name: 'Winter-Snake 🎅',
        played: playedSnake,
        label: p => `${p.minigameScore} 🎅`,
        canWatch: p => !!p.snakeReplay,
        watch: p => playReplay({ name: p.name, score: p.minigameScore, replay: p.snakeReplay, photoUrl: p.photoUrl }),
        // beliebig viele echte Versuche; gespeichert wird nur der beste (mit Aufzeichnung)
        play: (test, onDone) => {
          let tries = S.me.snakeTries || 0;
          playSnake({
            testMode: test, onClose: onDone, photoUrl: S.me.photoUrl, attempts: Infinity,
            best: test ? null : S.me.minigameScore ?? null, skipTutorial: true,   // erklärt wird in der Dialog-Szene; Tutorial gibt es im Menü
            onFinish: test ? () => {} : async ({ score, replay }) => {
              tries++;
              const upd = { snakeTries: tries };
              if (!S.me.minigamePlayed || score > (S.me.minigameScore ?? -1))
                Object.assign(upd, { minigameScore: score, minigamePlayed: true, minigameAt: Date.now(), snakeReplay: replay });
              await updateDoc(doc(db, 'participants', token), upd);
            }
          });
        }
      },
      biathlon: {
        name: 'Biathlon-Sprint ⛷️',
        played: playedBiathlon,
        label: p => formatBiathlon(p.biathlon),
        canWatch: p => !!p.biathlon?.replay,
        watch: p => playBiathlonReplay({ name: p.name, result: p.biathlon, photoUrl: p.photoUrl }),
        // begrenzte echte Versuche; gespeichert wird die Bestzeit (mit Aufzeichnung)
        play: (test, onDone) => {
          let tries = S.me.biathlonTries || 0;
          playBiathlon({
            testMode: test, photoUrl: S.me.photoUrl, onClose: onDone,
            attempts: test ? 3 : biathlonLeft(S), best: test ? null : S.me.biathlon ?? null, skipTutorial: !test && tries > 0,
            onFinish: test ? () => {} : async result => {
              tries++;
              const upd = { biathlonTries: tries };
              const better = !S.me.biathlon?.played || (result.finished && (!S.me.biathlon.finished || result.timeMs < S.me.biathlon.timeMs))
                || (!result.finished && !S.me.biathlon.finished && result.score > (S.me.biathlon.score || 0));
              if (better) upd.biathlon = result;
              await updateDoc(doc(db, 'participants', token), upd);
            }
          });
        }
      }
    };

    // ---------- Minispiel-Tab ----------
    function renderGameTab() {
      const s = S, me = s.me;
      let h = '';
      if (DEMO) {
        for (const [k, g] of Object.entries(GAMES))
          h += `<div class="card"><h2>${g.name}</h2><p>Zum Ausprobieren, nichts wird gespeichert.</p><button class="playGame" data-g="${k}">Ausprobieren</button></div>`;
      } else if (isPhase(s, 'setup')) {
        h += `<div class="card"><h2>Gleich geht's los</h2><p>Die Minispiele werden freigeschaltet, sobald die Runde startet.</p></div>`;
      } else if (isPhase(s, 'snake')) {
        h += `<div class="card"><h2>Runde 1: ${GAMES.snake.name}</h2>
          <p>Sammle so viele Gesichter wie möglich. Du hast <strong>beliebig viele Versuche</strong>, dein bester zählt.
          Platz 1–${settings(s.state).snakeBonus.length} bekommen Bonussekunden fürs Finale (${settings(s.state).snakeBonus.map(x => x + ' s').join(' / ')}).</p>
          ${playedSnake(me) ? `<p>Dein Bestwert: <strong>${me.minigameScore} 🎅</strong> · Versuche: ${me.snakeTries || 1}</p>` : ''}
          <button class="playGame" data-g="snake">${playedSnake(me) ? 'Nochmal spielen' : 'Snake spielen'}</button>
          ${GAMES.snake.canWatch(me) ? '<button class="secondary watchMe" data-g="snake">▶ Meinen besten Versuch ansehen</button>' : ''}</div>`;
      } else if (isPhase(s, 'biathlon')) {
        const left = biathlonLeft(s);
        h += `<div class="card"><h2>Runde 2: ${GAMES.biathlon.name}</h2>
          <p>Fahre über die Hindernisse ins Ziel. Du hast <strong>${settings(s.state).biathlonAttempts} echte Versuche</strong>, deine Bestzeit zählt.
          Im Team werden eure beiden Bestzeiten addiert.</p>
          ${playedBiathlon(me) ? `<p>Deine Bestzeit: <strong>${GAMES.biathlon.label(me)}</strong></p>` : ''}
          <p>Noch <strong>${left}</strong> von ${settings(s.state).biathlonAttempts} Versuchen.</p>
          ${left ? `<button class="playGame" data-g="biathlon">${playedBiathlon(me) ? 'Weiter versuchen' : 'Biathlon starten'}</button>` : ''}
          ${GAMES.biathlon.canWatch(me) ? '<button class="secondary watchMe" data-g="biathlon">▶ Meinen besten Lauf ansehen</button>' : ''}</div>`;
      } else {
        h += `<div class="card"><h2>Gerade kein Minispiel</h2><p>${isPhase(s, 'guess') ? 'Jetzt wird geraten: Tippe in der Halle die Person an, die deiner Meinung nach dieselbe Flagge hat wie du.' : 'Die Ergebnisse siehst du im 🏆 Leaderboard.'}</p></div>`;
      }
      document.getElementById('panelBody').innerHTML = h;
      document.querySelectorAll('.playGame').forEach(btn => btn.addEventListener('click', () =>
        GAMES[btn.dataset.g].play(!!DEMO, () => { if (tab === 'game') renderGameTab(); })));
      document.querySelectorAll('.watchMe').forEach(btn => btn.addEventListener('click', () => GAMES[btn.dataset.g].watch(me)));
    }

    // ---------- Leaderboard ----------
    const medals = ['🥇', '🥈', '🥉'];
    function snakeSection() {
      const s = S, st = settings(s.state);
      const list = snakeRanking(s.people);
      const VIDEOS = 3;   // nur die besten 3 mit Aufzeichnung
      let h = `<h2 style="margin-top:4px">🏆 Runde 1: ${GAMES.snake.name}</h2>`;
      if (!list.length) return h + '<div class="card"><p>Noch hat niemand gespielt.</p></div>';
      list.forEach((p, i) => {
        const bonus = st.snakeBonus[i];
        h += `<div class="card" style="display:flex;align-items:center;gap:12px;padding:${i < VIDEOS ? '12px' : '6px 12px'}">
          <div style="font-size:${i < VIDEOS ? '1.6rem' : '1rem'};width:36px;text-align:center">${medals[i] ?? (i + 1) + '.'}</div>
          <div style="flex:1"><strong>${escapeHtml(p.name)}</strong>${p.token === token ? ' (du)' : ''}
            <span style="color:#555;font-size:.9rem"> · ${p.minigameScore} 🎅${bonus ? ` · <b style="color:#16a34a">+${bonus} s Bonus</b>` : ''}</span></div>
          ${i < VIDEOS && GAMES.snake.canWatch(p) ? `<button class="watch" data-g="snake" data-token="${p.token}">▶ Ansehen</button>` : ''}
        </div>`;
      });
      const waiting = s.people.filter(p => !playedSnake(p));
      if (waiting.length && isPhase(s, 'snake')) h += `<p style="color:#555">Noch nicht gespielt: ${waiting.map(p => escapeHtml(p.name)).join(', ')}</p>`;
      return h;
    }
    function biathlonSection() {
      const s = S;
      const teams = teamList(s).map(t => ({ t, r: teamBiathlon(t, s.people) }))
        .sort((a, b) => (b.r.complete - a.r.complete) || (b.r.done - a.r.done) || (a.r.timeMs - b.r.timeMs));
      let h = `<h2 style="margin-top:14px">⛷️ Runde 2: ${GAMES.biathlon.name} (Teamzeit)</h2>`;
      if (!teams.length) return h + '<div class="card"><p>Die Teams stehen noch nicht fest.</p></div>';
      teams.forEach(({ t, r }, i) => {
        h += `<div class="card"><div style="display:flex;align-items:center;gap:10px">
            <div style="font-size:1.4rem;width:32px;text-align:center">${r.done ? (medals[i] ?? (i + 1) + '.') : '–'}</div>
            <div style="flex:1">${dot(t.css)}<strong>${escapeHtml(t.name)}</strong></div>
            <strong>${r.done ? (r.complete ? fmtS(r.timeMs) : fmtS(r.timeMs) + ' + …') : 'noch keine Zeit'}</strong></div>
          ${r.members.map(m => `<div style="display:flex;align-items:center;gap:8px;margin:4px 0 0 42px;font-size:.9rem">
            <span style="flex:1">${escapeHtml(m.name)}${m.token === token ? ' (du)' : ''}: ${playedBiathlon(m) ? escapeHtml(GAMES.biathlon.label(m)) : 'noch kein Lauf'}
              <span style="color:#94a3b8">(${m.biathlonTries || 0}/${settings(s.state).biathlonAttempts})</span></span>
            ${GAMES.biathlon.canWatch(m) ? `<button class="watch" data-g="biathlon" data-token="${m.token}" style="padding:4px 10px">▶</button>` : ''}</div>`).join('')}
        </div>`;
      });
      return h;
    }
    function bonusSection() {
      const s = S;
      const rows = teamList(s).map(t => ({ t, b: teamBonus(t, s.people, s.state, true) })).sort((a, b) => b.b.total - a.b.total);
      if (!rows.length) return '';
      return `<h2 style="margin-top:14px">⏱️ Vorsprung fürs Finale</h2><div class="card">${rows.map(({ t, b }) =>
        `<div style="display:flex;gap:8px;margin:4px 0"><span style="flex:1">${dot(t.css)}${escapeHtml(t.name)}</span>
          <span style="color:#555;font-size:.85rem">Raten ${b.guess} s · Snake ${b.snake} s</span><strong>${b.total} s</strong></div>`).join('')}</div>`;
    }
    function finalSection() {
      const s = S;
      const rows = FINAL_TEAMS.filter(L => finalMembers(L, s.people).length).map(L => {
        const fin = s.finals?.[L], bonus = finalBonus(L, s.people, s.state);
        return { L, fin, bonus, score: finalScoreMs(fin, bonus), mem: finalMembers(L, s.people) };
      }).sort((a, b) => (!!b.fin?.solved3At - !!a.fin?.solved3At) || ((a.fin?.solved3At ? a.score : 9e15) - (b.fin?.solved3At ? b.score : 9e15)));
      return `<h2 style="margin-top:4px">🏆 Finale</h2>${rows.map((r, i) => `<div class="card">
        <strong>Team ${r.L}</strong> <span style="color:#555;font-size:.9rem">(${r.mem.map(m => (m.finalCaptain ? '★ ' : '') + escapeHtml(m.name)).join(', ')})</span><br>
        <span style="font-size:.9rem">Vorsprung ${r.bonus} s · ${r.fin?.solved3At ? `🏁 geschafft: <strong>${fmtClock(r.score)}</strong>` : r.fin?.startedAt ? `⏳ Raum ${Math.min(3, Math.floor(finalStage(r.fin)))} von 3` : 'noch nicht gestartet'}
        ${r.fin?.penalty ? ` · Strafe +${r.fin.penalty} s` : ''}</span></div>`).join('') || '<div class="card"><p>Die Finale-Teams stehen noch nicht fest.</p></div>'}`;
    }
    function renderBoardTab() {
      const s = S;
      let parts = [snakeSection()];
      if (PH(s) >= phaseIndex('biathlon') || s.people.some(playedBiathlon)) parts = [biathlonSection(), ...parts];
      if (revealed(s)) parts.push(bonusSection());
      if (isPhase(s, 'final')) parts = [finalSection(), ...parts];
      document.getElementById('panelBody').innerHTML = parts.join('');
      document.querySelectorAll('.watch').forEach(btn => btn.addEventListener('click', () => {
        const p = S.people.find(x => x.token === btn.dataset.token);
        if (p) GAMES[btn.dataset.g].watch(p);
      }));
    }

    // ---------- Finale: drei Räume ----------
    // Raum 1: Napoleons Lager (Waffe wählen) · Raum 2: Rätselkammer (HORCRUX) · Raum 3: Schneeballwurf (VEREIST)
    // Der Kapitän öffnet jede Tür; alle im Team folgen automatisch. Zwischen den Räumen steht die Uhr.
    let scene3d = null, sceneNo = 0, sceneMods = {}, inFinal = false, leftFinal = false, finHudTimer = null, lastStarted = null, switching = false;
    let built2 = [];   // Raum 2: angetippte Kärtchen (Index in word2Tiles)
    let built3 = [];   // Raum 3: in dieser Reihenfolge angetippte Buchstaben (Dosen-Index)
    const myFin = () => S.finals?.[S.me.finalTeam] ?? null;
    const isCaptain = () => finalCaptain(S.me.finalTeam, S.people)?.token === S.me.token;
    const sceneFor = st => st <= 1.5 ? 1 : st <= 2.5 ? 2 : 3;
    function toast(text, ms = 2600) {
      const t = document.createElement('div');
      t.style.cssText = 'position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:950;background:rgba(15,23,42,.9);color:#fff;padding:14px 18px;border-radius:14px;max-width:86vw;text-align:center;font-weight:600';
      t.textContent = text; document.body.appendChild(t); setTimeout(() => t.remove(), ms);
    }
    function modal(html) {
      const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="modal">${html}</div>`;
      document.body.appendChild(bg); bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); }); return bg;
    }
    // Spielstand schreiben (Demo: nur lokal)
    async function finUpdate(upd, local) {
      const L = S.me.finalTeam;
      if (DEMO) { S = { ...S, finals: { ...S.finals, [L]: { ...myFin(), ...local(myFin()) } } }; syncFinal(); return; }
      await updateDoc(doc(db, 'finals', L), upd);
    }

    async function onDoor() {
      if (!isPhase(S, 'final')) return toast('🔒 Die Tür zum Finale ist noch verschlossen.');
      const L = S.me.finalTeam;
      if (!L) return toast('Du bist noch keinem Finale-Team zugeordnet.');
      if (myFin()?.startedAt) { leftFinal = false; return enterFinal(); }
      const cap = finalCaptain(L, S.people);
      if (cap?.token !== S.me.token) return toast(`Nur euer Kapitän ${cap?.name ?? ''} kann die Tür öffnen.`);
      const bg = modal(`<h2 style="margin:0 0 6px">🚪 Finale starten?</h2>
        <p style="margin:0 0 12px;color:#555">Sind alle von Team ${L} bereit? Sobald du die Tür öffnest, läuft eure Uhr – für alle im Team.</p>
        <button class="secondary" data-a="no">Noch nicht</button><button data-a="yes">Tür öffnen!</button>`);
      bg.querySelector('[data-a=no]').onclick = () => bg.remove();
      bg.querySelector('[data-a=yes]').onclick = async () => {
        bg.remove();
        const fin = { startedAt: Date.now(), penalty: 0, wrong: [], solved1At: null };
        if (DEMO) { S = { ...S, finals: { ...S.finals, [L]: { id: L, ...fin } } }; return enterFinal(); }
        try {
          const cur = await getDoc(doc(db, 'finals', L));
          if (!cur.exists() || !cur.data().startedAt) await setDoc(doc(db, 'finals', L), fin);
          enterFinal();
        } catch (err) { alert('Fehler: ' + err.message); }
      };
    }
    // Tür zum nächsten Raum (nur Kapitän): setzt start2At bzw. start3At, die Uhr läuft weiter
    function nextDoor(n) {
      const fin = myFin(); if (!fin) return;
      const key = n === 2 ? 'start2At' : 'start3At';
      if (fin[key]) return;
      if (!isCaptain()) return toast(`Nur euer Kapitän ${finalCaptain(S.me.finalTeam, S.people)?.name ?? ''} kann die Tür öffnen.`);
      const bg = modal(`<h2 style="margin:0 0 6px">🚪 Weiter in Raum ${n}?</h2><p style="margin:0 0 12px;color:#555">Die Uhr steht gerade. Sobald du die Tür öffnest, läuft sie weiter – alle aus deinem Team kommen mit.</p>
        <button class="secondary" data-a="no">Noch nicht</button><button data-a="yes">Tür öffnen!</button>`);
      bg.querySelector('[data-a=no]').onclick = () => bg.remove();
      bg.querySelector('[data-a=yes]').onclick = async () => {
        bg.remove();
        try { await finUpdate({ [key]: Date.now() }, () => ({ [key]: Date.now() })); } catch (err) { alert('Fehler: ' + err.message); }
      };
    }

    // Bei jedem neuen Datenstand: automatisch hinein bzw. in den nächsten Raum, Anzeige aktualisieren
    function syncFinal() {
      const fin = myFin();
      if (fin?.startedAt && fin.startedAt !== lastStarted) {
        const first = lastStarted === null && Date.now() - fin.startedAt > 15000;   // Seite neu geladen, Finale läuft schon länger
        lastStarted = fin.startedAt;
        if (!first && !inFinal && !leftFinal) { toast('🚪 Euer Kapitän hat die Tür geöffnet – auf ins Finale!'); setTimeout(enterFinal, 900); }
      }
      if (inFinal && fin && !switching) {
        const want = sceneFor(finalStage(fin));
        if (want !== sceneNo) { toast(want === 2 ? '🚪 Weiter in die Rätselkammer!' : '🚪 Weiter zum letzten Raum!'); loadScene(want); return; }
        updateScene(fin);
      }
      renderFinHud();
    }
    function updateScene(fin) {
      if (!scene3d) return;
      const st = finalStage(fin);
      if (sceneNo === 1) { scene3d.markWrong(fin.wrong || []); if (fin.solved1At && fin.solvedWeapon) scene3d.markSolved(fin.solvedWeapon); scene3d.setDoor2(st === 1.5); }
      if (sceneNo === 2) { scene3d.setSolved(fin.riddles || [], RIDDLES.map(r => r.letter)); scene3d.setDoor(st === 2.5); }
      if (sceneNo === 3) scene3d.setHits(fin.cans || []);
      if (st === 4 && !document.getElementById('finDone')) showFinished();
    }
    async function enterFinal() {
      if (inFinal) return;
      inFinal = true; leftFinal = false;
      hall?.pause?.();
      ['top', 'side', 'bottom'].forEach(id => { document.getElementById(id).style.display = 'none'; });
      document.getElementById('panel').hidden = true;
      const stage = document.createElement('div'); stage.id = 'finalStage';
      stage.style.cssText = 'position:fixed;inset:0;z-index:15;background:#000';
      stage.innerHTML = `<div id="finScene" style="position:absolute;inset:0"></div>
        <div id="finHud" style="position:fixed;z-index:25;top:calc(8px + var(--st));left:8px;right:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none"></div>
        <div id="finBar" style="position:fixed;z-index:25;left:8px;right:8px;bottom:calc(64px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:6px"></div>
        <button id="finBack" class="round glass" style="position:fixed;z-index:25;right:8px;bottom:calc(14px + var(--sb));width:auto;padding:0 14px;border-radius:999px;font-size:.9rem">🏟️ Zur Halle</button>
        <div style="position:fixed;z-index:25;left:8px;bottom:calc(18px + var(--sb));background:rgba(15,23,42,.6);color:#fff;padding:6px 12px;border-radius:999px;font-size:.8rem;pointer-events:none" id="finHint"></div>`;
      document.body.appendChild(stage);
      document.getElementById('finBack').onclick = leaveFinal;
      clearInterval(finHudTimer); finHudTimer = setInterval(renderFinHud, 250);
      await loadScene(sceneFor(finalStage(myFin())));
    }
    async function loadScene(n) {
      switching = true;
      scene3d?.dispose(); scene3d = null; sceneNo = n; built2 = []; built3 = [];
      const box = document.getElementById('finScene'); if (!box) { switching = false; return; }
      const hint = document.getElementById('finHint');
      try {
        if (n === 1) {
          sceneMods.c ??= await import('./camp.js?v=20261023c');
          scene3d = sceneMods.c.createCamp(box, { onWeapon: chooseWeapon, onDoor2: () => nextDoor(2) });
          hint.textContent = '👆 Pfeile antippen = gehen · wischen = umschauen';
        } else if (n === 2) {
          sceneMods.r2 ??= await import('./room2.js?v=20261023c');
          scene3d = sceneMods.r2.createRiddleRoom(box, { onPlaque: openRiddle, onDoor: () => nextDoor(3) });
          hint.textContent = '👆 wischen = umschauen · Tafel antippen = Rätsel';
        } else {
          sceneMods.r3 ??= await import('./room3.js?v=20261023c');
          const mates = finalMembers(S.me.finalTeam, S.people).filter(p => p.token !== S.me.token).map(p => ({ token: p.token, name: p.name, photoUrl: p.photoUrl }));
          scene3d = sceneMods.r3.createSnowRange(box, { cans: CANS, hits: myFin()?.cans || [], mates, onHit: hitCan, canThrow: () => !myFin()?.solved3At, reload: 2 });
          hint.textContent = '👆 antippen = Schneeball werfen · wischen = zielen';
        }
      } catch (err) { switching = false; window.showLoadError?.('Raum ' + n + ': ' + err.message); alert('Der Raum konnte nicht geladen werden: ' + err.message); return leaveFinal(); }
      setTimeout(() => { if (hint) hint.style.opacity = '0.0'; }, 8000); hint.style.opacity = '1';
      switching = false;
      syncFinal();
    }
    function leaveFinal() {
      inFinal = false; leftFinal = true;
      clearInterval(finHudTimer);
      scene3d?.dispose(); scene3d = null; sceneNo = 0;
      document.getElementById('finalStage')?.remove();
      document.getElementById('finDone')?.remove();
      ['top', 'side', 'bottom'].forEach(id => { document.getElementById(id).style.display = ''; });
      hall?.resume?.();
      renderTab();
    }

    // Kopfzeile (Uhr, Aufgabe) und Leiste unten (Wort, Buchstaben)
    function renderFinHud() {
      const hud = document.getElementById('finHud'), bar = document.getElementById('finBar');
      if (!hud) return;
      const L = S.me.finalTeam, fin = myFin();
      if (!fin) { hud.innerHTML = ''; return; }
      const st = finalStage(fin), bonus = finalBonus(L, S.people, S.state), sc = finalScoreMs(fin, bonus);
      const cap = finalCaptain(L, S.people), capTxt = isCaptain() ? 'Du bist Kapitän' : `Kapitän: ${escapeHtml(cap?.name ?? '?')}`;
      const paused = st === 1.5 || st === 2.5 || st === 4;
      const time = st === 4 ? `🏁 ${fmtClock(sc)}` : sc < 0 ? `⏱ Vorsprung: Uhr startet in ${Math.ceil(-sc / 1000)} s` : `⏱ ${fmtClock(sc)}${paused ? ' ⏸' : ''}`;
      const task = {
        1: `Raum 1 · <strong>Hilf unserem Papa!</strong> Findet ihn im Lager und wählt die richtige Waffe aus der Waffenkammer. ${isCaptain() ? '<br><strong>Du bist Kapitän:</strong> nur du kannst eine Waffe wählen (falsch = +' + PENALTY_S + ' s).' : `<br>Nur ${escapeHtml(cap?.name ?? 'euer Kapitän')} kann eine Waffe wählen.`}`,
        1.5: `✅ Raum 1 geschafft – die Uhr steht. Rechts neben Napoleon ist eine Tür erschienen. ${isCaptain() ? '<strong>Öffne sie</strong>, wenn alle bereit sind.' : `${escapeHtml(cap?.name ?? 'Euer Kapitän')} öffnet sie.`}`,
        2: `Raum 2 · <strong>Die Rätselkammer.</strong> Jedes gelöste Rätsel gibt einen Buchstaben (gemischt!). Tippt sie unten in die richtige Reihenfolge und ratet das Wort (${WORD2_TRIES} Versuche fürs Team).`,
        2.5: `✅ Raum 2 geschafft – die Uhr steht. Die Tür gegenüber leuchtet. ${isCaptain() ? '<strong>Öffne sie</strong>, wenn alle bereit sind.' : `${escapeHtml(cap?.name ?? 'Euer Kapitän')} öffnet sie.`}`,
        3: `Raum 3 · <strong>Schneeballwurf!</strong> Alle werfen gleichzeitig – jeder alle 2 Sekunden einen Schneeball. Manche Dosen verbergen Buchstaben – tippt sie unten in der richtigen Reihenfolge an.`,
        4: `🏆 <strong>Geschafft!</strong>`
      }[st] ?? '';
      hud.innerHTML = `<div class="chip glass" style="font-size:1.05rem">${time}${fin.penalty ? ` <span style="color:#fca5a5">(+${fin.penalty} s Strafe)</span>` : ''}</div>
        <div class="banner glass" style="max-width:520px">Team ${L} · ${capTxt}<br>${task}</div>`;
      // Leiste unten
      if (!bar) return;
      let h = '';
      // Kärtchen-Stil: benutzte Buchstaben bleiben stehen, sind aber durchgestrichen
      const tile = (cls, i, ch, used) => `<button class="${cls}" data-i="${i}" ${used ? 'disabled' : ''} style="margin:0;padding:6px 12px;font:bold 1.2rem Georgia,serif;${used ? 'text-decoration:line-through;text-decoration-thickness:3px;opacity:.45' : ''}">${ch}</button>`;
      const slot = (ch, color) => `<span style="display:inline-block;width:28px;height:36px;border-radius:6px;background:${ch ? color : 'rgba(255,255,255,.14)'};color:#fff;font:bold 1.3rem Georgia,serif;line-height:36px">${ch || ''}</span>`;
      if (sceneNo === 2) {
        const tiles = word2Tiles(fin.riddles);
        built2 = built2.filter(k => k < tiles.length);
        const left = WORD2_TRIES - (fin.wordTries || 0);
        h = `<div class="glass" style="border-radius:14px;padding:8px 10px;pointer-events:auto;text-align:center">
          <div style="display:flex;gap:5px;justify-content:center;margin-bottom:6px">${WORD2.split('').map((_, k) => slot(built2[k] != null ? tiles[built2[k]] : '', '#b8860b')).join('')}</div>
          <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center">${tiles.length ? tiles.map((ch, k) => tile('l2', k, ch, built2.includes(k))).join('')
            : '<span style="color:#cbd5e1;font-size:.85rem">Noch keine Buchstaben – löst die Rätsel!</span>'}
            ${built2.length ? '<button id="l2clear" class="secondary" style="margin:0;padding:6px 10px">↺</button>' : ''}
            ${st === 2 && left > 0 ? `<button id="guessWord" style="margin:0 0 0 4px;padding:6px 12px">Raten (${left})</button>` : ''}</div></div>`;
      } else if (sceneNo === 3 && st === 3) {
        const hits = (fin.cans || []).filter(i => CANS[i]);
        h = `<div class="glass" style="border-radius:14px;padding:8px 10px;pointer-events:auto;text-align:center">
          <div style="display:flex;gap:5px;justify-content:center;margin-bottom:6px">${WORD3.split('').map((_, k) => {
            const i = built3[k]; return slot(i != null ? CANS[i] : '', '#2563eb');
          }).join('')}</div>
          <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${hits.length ? hits.map(i => tile('l3', i, CANS[i], built3.includes(i))).join('')
            : '<span style="color:#cbd5e1;font-size:.85rem">Noch keine Buchstaben – werft!</span>'}
            ${built3.length ? '<button id="l3clear" class="secondary" style="margin:0;padding:6px 10px">↺</button>' : ''}</div></div>`;
      }
      if (bar.dataset.h !== h) {
        bar.dataset.h = h; bar.innerHTML = h;
        document.getElementById('guessWord')?.addEventListener('click', guessWord2);
        bar.querySelectorAll('.l3').forEach(b => b.addEventListener('click', () => tapLetter3(Number(b.dataset.i))));
        bar.querySelectorAll('.l2').forEach(b => b.addEventListener('click', () => { const k = Number(b.dataset.i); if (!built2.includes(k) && built2.length < WORD2.length) { built2.push(k); renderFinHud(); } }));
        document.getElementById('l2clear')?.addEventListener('click', () => { built2 = []; renderFinHud(); });
        document.getElementById('l3clear')?.addEventListener('click', () => { built3 = []; renderFinHud(); });
      }
    }

    // ----- Raum 1: Waffe wählen (nur Kapitän) -----
    function chooseWeapon(id) {
      const L = S.me.finalTeam, fin = myFin(), cap = finalCaptain(L, S.people);
      if (!fin) return;
      if (fin.solved1At) return toast('Raum 1 ist schon gelöst! 🎉');
      if (cap?.token !== S.me.token) return toast(`${weaponName(id)} – nur euer Kapitän ${cap?.name ?? ''} kann eine Waffe wählen.`);
      if ((fin.wrong || []).includes(id)) return toast(`${weaponName(id)} war schon falsch.`);
      const answer = DEMO ? 'schlaeger' : S.state.riddle1Answer;
      if (!answer) return toast('Die richtige Waffe ist noch nicht festgelegt (admin.html).');
      const bg = modal(`<h2 style="margin:0 0 6px">${escapeHtml(weaponName(id))} wählen?</h2>
        <p style="margin:0 0 12px;color:#555">Ist es die falsche Waffe, bekommt ihr <strong>+${PENALTY_S} Strafsekunden</strong>.</p>
        <button class="secondary" data-a="no">Abbrechen</button><button data-a="yes">Diese Waffe!</button>`);
      bg.querySelector('[data-a=no]').onclick = () => bg.remove();
      bg.querySelector('[data-a=yes]').onclick = async () => {
        bg.remove();
        const right = id === answer;
        try {
          if (!DEMO && (await getDoc(doc(db, 'finals', L))).data().solved1At) return;
          await finUpdate(right ? { solved1At: Date.now(), solvedWeapon: id } : { penalty: increment(PENALTY_S), wrong: arrayUnion(id) },
            f => right ? { solved1At: Date.now(), solvedWeapon: id } : { penalty: (f.penalty || 0) + PENALTY_S, wrong: [...(f.wrong || []), id] });
        } catch (err) { return alert('Speichern fehlgeschlagen: ' + err.message); }
        if (right) {
          const ov = modal(`<h2 style="margin:0 0 6px">🎉 Richtig!</h2><p>${escapeHtml(weaponName(id))} war die richtige Waffe – Napoleon ist gerettet!</p>
            <p style="color:#555">Die Uhr steht. Rechts neben Napoleon ist eine Tür erschienen.</p><button data-a="ok">Weiter</button>`);
          ov.querySelector('[data-a=ok]').onclick = () => ov.remove();
        } else toast(`❌ ${weaponName(id)} war falsch: +${PENALTY_S} Strafsekunden`);
      };
    }

    // ----- Raum 2: Rätsel und Wort -----
    function openRiddle(i) {
      const fin = myFin(); if (!fin) return;
      const done = (fin.riddles || []).includes(i);
      const r = RIDDLES[i];
      const bg = modal(`<h2 style="margin:0 0 8px">Rätsel ${i + 1}</h2>
        <p style="margin:0 0 12px;font-size:1.05rem;line-height:1.4">${escapeHtml(r.q)}</p>
        ${done ? `<p>✅ Gelöst – Buchstabe <strong style="font-size:1.4rem">${r.letter}</strong></p><button data-a="no">Schließen</button>`
          : `<input id="rAns" placeholder="Antwort" autocomplete="off" style="width:100%;font-size:16px;margin-bottom:8px">
             <button class="secondary" data-a="no">Schließen</button><button data-a="yes">Prüfen</button>`}`);
      bg.querySelector('[data-a=no]').onclick = () => bg.remove();
      const inp = bg.querySelector('#rAns');
      const check = async () => {
        if (!riddleRight(i, inp.value)) { inp.value = ''; inp.placeholder = '❌ Leider nicht – nochmal!'; inp.focus(); return; }
        bg.remove();
        const now = myFin(), solved = [...new Set([...(now.riddles || []), i])];
        const all = RIDDLES.every((_, k) => solved.includes(k)) && (now.wordTries || 0) >= WORD2_TRIES;
        try {
          await finUpdate({ riddles: arrayUnion(i), ...(all ? { solved2At: Date.now() } : {}) }, () => ({ riddles: solved, ...(all ? { solved2At: Date.now() } : {}) }));
        } catch (err) { return alert('Speichern fehlgeschlagen: ' + err.message); }
        toast(all ? `✅ Alle Rätsel gelöst: ${WORD2}!` : `✅ Richtig! Neuer Buchstabe: ${r.letter}`);
      };
      if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }); bg.querySelector('[data-a=yes]').onclick = check; }
    }
    function guessWord2() {
      const fin = myFin(); if (!fin || fin.solved2At) return;
      const left = WORD2_TRIES - (fin.wordTries || 0);
      if (left <= 0) return toast('Keine Rateversuche mehr – löst die Rätsel!');
      const bg = modal(`<h2 style="margin:0 0 6px">Lösungswort raten</h2><p style="margin:0 0 10px;color:#555">Noch ${left} Versuch${left === 1 ? '' : 'e'} für euer Team. Fehlende Buchstaben könnt ihr selbst eintippen.</p>
        <input id="wAns" autocomplete="off" style="width:100%;font-size:16px;margin-bottom:8px;text-transform:uppercase">
        <button class="secondary" data-a="no">Abbrechen</button><button data-a="yes">Raten!</button>`);
      const inp = bg.querySelector('#wAns'); inp.focus();
      const tiles = word2Tiles(fin.riddles); inp.value = built2.map(k => tiles[k]).join('');
      bg.querySelector('[data-a=no]').onclick = () => bg.remove();
      const go = async () => {
        const right = normAnswer(inp.value).replace(/ /g, '') === WORD2.toLowerCase();
        // letzter Versuch daneben, aber alle Rätsel schon gelöst: Tür öffnet sich trotzdem (sonst käme man nicht weiter)
        const stuck = !right && left === 1 && RIDDLES.every((_, k) => (myFin().riddles || []).includes(k));
        bg.remove();
        if (stuck) {
          try { await finUpdate({ wordTries: increment(1), solved2At: Date.now() }, f => ({ wordTries: (f.wordTries || 0) + 1, solved2At: Date.now() })); } catch (err) { return alert('Speichern fehlgeschlagen: ' + err.message); }
          return toast(`❌ Falsch – aber alle Rätsel sind gelöst. Das Wort war ${WORD2}.`);
        }
        try {
          await finUpdate(right ? { solved2At: Date.now() } : { wordTries: increment(1) }, f => right ? { solved2At: Date.now() } : { wordTries: (f.wordTries || 0) + 1 });
        } catch (err) { return alert('Speichern fehlgeschlagen: ' + err.message); }
        if (!right) { built2 = []; renderFinHud(); }
        toast(right ? `✅ Richtig: ${WORD2}!` : left - 1 > 0 ? `❌ Falsch. Noch ${left - 1} Versuch${left - 1 === 1 ? '' : 'e'}.` : '❌ Falsch. Keine Versuche mehr – löst alle Rätsel, dann öffnet sich die Tür.');
      };
      bg.querySelector('[data-a=yes]').onclick = go; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    }

    // ----- Raum 3: Dosen und Wort -----
    // Demo: die anderen aus dem Team treffen ab und zu auch eine Dose
    setInterval(() => { if (DEMO && inFinal && sceneNo === 3) demoMates3(); }, 1000);
    let demoNext = 0;
    function demoMates3() {
      const fin = myFin(); if (!fin || fin.solved3At || finalMembers(S.me.finalTeam, S.people).length < 2) return;
      if (Date.now() < demoNext) return;
      demoNext = Date.now() + 3000 + Math.random() * 3000;
      const free = CANS.map((_, i) => i).filter(i => !(fin.cans || []).includes(i));
      if (free.length && Math.random() < 0.4) { const hit = free[Math.floor(Math.random() * free.length)]; finUpdate({}, f => ({ cans: [...new Set([...(f.cans || []), hit])] })); }
    }
    async function hitCan(i) {
      const fin = myFin(); if (!fin || (fin.cans || []).includes(i)) return;
      try { await finUpdate({ cans: arrayUnion(i) }, f => ({ cans: [...new Set([...(f.cans || []), i])] })); } catch (err) {}
      if (CANS[i]) toast(`🎯 Treffer! Buchstabe ${CANS[i]}`, 1400);
    }
    async function tapLetter3(i) {
      if (built3.includes(i)) return;
      built3.push(i); renderFinHud();
      if (built3.length < WORD3.length) return;
      const word = built3.map(k => CANS[k]).join('');
      if (word !== WORD3) { toast('❌ Das ergibt kein Wort – nochmal!'); built3 = []; setTimeout(renderFinHud, 300); return; }
      try { await finUpdate({ solved3At: Date.now() }, () => ({ solved3At: Date.now() })); } catch (err) { alert('Speichern fehlgeschlagen: ' + err.message); }
    }
    function showFinished() {
      const L = S.me.finalTeam, fin = myFin();
      const sc = finalScoreMs(fin, finalBonus(L, S.people, S.state));
      const ov = document.createElement('div'); ov.id = 'finDone'; ov.className = 'modal-bg';
      ov.innerHTML = `<div class="modal"><h2 style="margin:0 0 6px">🏆 Team ${L} hat es geschafft!</h2>
        <p style="margin:0 0 6px">Napoleon gerettet · <strong>${WORD2}</strong> · <strong>${WORD3}</strong></p>
        <p style="font-size:1.6rem;margin:6px 0"><strong>${fmtClock(sc)}</strong></p>
        <p style="color:#555;font-size:.9rem">gespielte Zeit minus Vorsprung plus Strafsekunden</p><button data-a="ok">Zur Halle</button></div>`;
      document.body.appendChild(ov);
      ov.querySelector('[data-a=ok]').onclick = () => { ov.remove(); leaveFinal(); };
    }

    // ---------- Demo-Modus ----------
    // index.html?demo        : alle angelegten Personen mit Gesicht sitzen schon, "Du" läuft mit face1 ein
    // index.html?demo=raten  : Flagge raten; 3 Sekunden nach deinem Tipp wird aufgelöst
    // Es wird nur gelesen, nichts gespeichert.
    async function demoStart() {
      let ps = [], benchSeats;
      try {
        (await getDocs(collection(db, 'participants'))).forEach(d => ps.push({ token: d.id, ...d.data() }));
        benchSeats = (await getDoc(doc(db, 'state', 'current'))).data()?.benchSeats;
      } catch (e) { ps = []; }
      const t0 = Date.now() - 600000;
      const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'de');
      let people = ps.filter(p => isPerson(p) && p.photoUrl)
        .sort((a, b) => (a.arrivedAt ?? 9e15) - (b.arrivedAt ?? 9e15) || byName(a, b))
        .map((p, i) => ({ ...p, teamId: null, pickedAt: null, guess: null, agent: false, arrivedAt: t0 + i * 1000 }));
      if (DEMO === 'guess' && people.length < 3) people = demoSample(t0);
      const me = { token: 'demo-me', name: 'Du', role: 'player', teamId: null, hair: 'kurz', photoUrl: 'faces/face1.png',
        arrivedAt: DEMO === 'enter' ? Date.now() : t0 + 99000 };
      people.push(me);
      token = me.token;
      if (DEMO === 'enter') return onData({ me, state: { phase: 'setup', benchSeats }, teams: {}, people });
      if (DEMO === 'final') {   // du bist Kapitän von Team A; richtige Demo-Waffe: Baseballschläger
        me.finalTeam = 'A'; me.finalCaptain = true;
        people.forEach((p, i) => { if (p !== me) p.finalTeam = FINAL_TEAMS[i % 4]; });
        return onData({ me, state: { phase: 'final', benchSeats }, teams: {}, finals: {}, people });
      }

      // Raten: erfundene Flaggen (je zwei gleich) und Snake-Ergebnisse
      const flags = ['it', 'fr', 'es', 'se', 'br', 'jp', 'us', 'gb', 'nl', 'gr', 'mx', 'ca', 'pt', 'no', 'ie', 'au'];
      const order = people.slice().sort(() => Math.random() - 0.5);
      order.forEach((p, i) => { p.flag = flags[Math.floor(i / 2) % flags.length]; });
      people.forEach((p, i) => { p.minigamePlayed = true; p.minigameScore = Math.max(1, 30 - i * 2 - (i % 3)); p.minigameAt = t0 + i; });
      onData({ me, state: { phase: 'guess', benchSeats }, teams: {}, people });
    }
    function demoSample(t0) {
      const names = ['Anna', 'Ben', 'Clara', 'David', 'Emil', 'Fiona', 'Greta', 'Hannes', 'Ida', 'Jonas', 'Klara', 'Leon', 'Mia', 'Noah', 'Olga'];
      const longHair = new Set(['Anna', 'Clara', 'Fiona', 'Greta', 'Ida', 'Klara', 'Mia', 'Olga']);
      return names.map((n, i) => ({ token: 'demo-p-' + i, name: n, role: 'player', teamId: null, hair: longHair.has(n) ? 'lang' : 'kurz',
        photoUrl: i % 4 === 1 ? 'faces/face' + (1 + (i % 2)) + '.png' : null, arrivedAt: t0 + i * 1000 }));
    }
    function demoChatter() {
      const lines = ['Hallo zusammen! 👋', 'Wer hat die Musik mitgebracht? 🎶', 'Ich weiß, wer zu mir gehört 😏',
        'Kalt hier draußen 🥶', 'Hat jemand den Springer gesehen?? 😮', 'Wann geht es los?', 'Wir gewinnen eh 💪',
        'Schöner Schneemann ⛄', 'Ich verrate nichts 🤫', 'Biathlon kann ich auch!'];
      let k = 0;
      setInterval(() => {
        if (!S) return;
        const pool = S.people.filter(p => p.token !== token && p.arrivedAt);
        const p = pool[Math.floor(Math.random() * pool.length)];
        if (!p) return;
        messages.unshift({ id: 'd' + Date.now(), token: p.token, name: p.name, text: lines[k++ % lines.length], at: Date.now() });
        onMessages(1);
      }, 3500);
    }
    let demoRevealTimer = null;
    function demoGuess(p) {
      // alle anderen tippen zufällig, dann wird nach 3 Sekunden aufgelöst
      let people = S.people.map(x => x.token === token ? { ...x, guess: p.token }
        : { ...x, guess: x.guess ?? S.people.filter(y => y.token !== x.token)[Math.floor(Math.random() * (S.people.length - 1))].token });
      onData({ ...S, me: people.find(x => x.token === token), people });
      clearTimeout(demoRevealTimer);
      demoRevealTimer = setTimeout(() => {
        const teams = {}, now = Date.now();
        planTeams(S.people).forEach(t => {
          const id = 'demo-t' + t.order;
          teams[id] = { id, name: t.name, flag: t.flag, captainToken: null, order: t.order };
          const set = new Set(t.members.map(m => m.token));
          people = people.map(x => set.has(x.token) ? { ...x, teamId: id, pickedAt: now + t.members.findIndex(m => m.token === x.token) } : x);
        });
        onData({ ...S, me: people.find(x => x.token === token), people, teams, state: { ...S.state, phase: 'pairs' } });
      }, 3000);
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    document.getElementById('panelClose').onclick = () => { tab = 'hall'; renderTabbar(); renderTab(); };
    wireChat();
    // Android: beim ersten Antippen echten Vollbildmodus anfordern (iPhone erlaubt das nur für Videos)
    document.addEventListener('pointerdown', () => {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen && matchMedia('(pointer: coarse)').matches) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    }, { once: true });
    if (DEMO) { demoStart(); demoChatter(); }
    else if (!token) root.innerHTML = '<div class="card"><p>Kein gültiger Link. Bitte den persönlichen Link bzw. QR-Code benutzen.</p></div>';
    else subscribe();
  </script>
</body>
</html>
