<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haeckelsche Wintergames</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom: 96px; }
  .hello { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px; }
  .hello h1 { margin:0; font-size:1.25rem; }
  .hello span { color:#555; font-size:.9rem; }
  .banner { background:#1e293b; color:#f8fafc; border-radius:12px; padding:12px 14px; margin:0 0 12px; line-height:1.4; }
  .banner strong { color:#fde047; }
  .banner.myturn { background:#facc15; color:#422006; font-weight:600; }
  .banner.myturn strong { color:#422006; }
  .banner.demo { background:#7c3aed; }
  #hallWrap { width:100%; height:min(68vh, 640px); border-radius:14px; background:#eef4fb; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  #hallWrap.flat { height:auto; background:none; box-shadow:none; }
  .hall-hint { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); background:rgba(15,23,42,.7); color:#fff;
    padding:6px 12px; border-radius:999px; font-size:.85rem; pointer-events:none; white-space:nowrap; transition:opacity .6s; }
  .hall-tools { display:flex; justify-content:flex-end; align-items:center; margin-top:8px; gap:4px; flex-wrap:wrap; }
  .tabbar { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:6px;
    background:rgba(255,255,255,.96); border-top:1px solid #e5e7eb; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); z-index:500; }
  .tabbar button { flex:1; max-width:180px; margin:0; background:transparent; color:#475569; padding:8px 4px; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.8rem; font-weight:600; }
  .tabbar button span { font-size:1.4rem; line-height:1; }
  .tabbar button.active { background:#eef2ff; color:#1d4ed8; }
  .tabbar button:hover { background:#f1f5f9; }
  .tabbar .dot { width:9px; height:9px; border-radius:50%; background:#ef4444; position:absolute; top:6px; right:calc(50% - 20px); }
  .chatbar { display:flex; gap:6px; margin-top:8px; }
  .chatbar input { flex:1; margin:0; min-width:0; }
  .chatbar button { margin:0; white-space:nowrap; }
  .chatlog { background:#fff; border-radius:12px; margin-top:8px; padding:8px 12px; max-height:240px; overflow-y:auto;
    box-shadow:0 1px 3px rgba(0,0,0,.08); font-size:.92rem; }
  .chatlog .m { padding:4px 0; border-bottom:1px solid #f1f5f9; word-wrap:break-word; }
  .chatlog .m:last-child { border-bottom:none; }
  .chatlog .m b { color:#1d4ed8; }
  .chatlog .m.mine b { color:#16a34a; }
  .chatlog .t { color:#94a3b8; font-size:.75rem; margin-left:4px; }
  .badge { background:#ef4444; color:#fff; border-radius:999px; padding:1px 7px; font-size:.75rem; margin-left:4px; }
  .msgs5 { text-align:left; margin:8px 0 12px; }
  .msgs5 div { background:#f1f5f9; border-radius:12px; padding:6px 10px; margin:4px 0; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:900; padding:16px; }
  .modal { background:#fff; border-radius:14px; padding:18px; max-width:320px; width:100%; text-align:center; }
  .modal img { height:110px; display:block; margin:0 auto 8px; }
</style>
</head>
<body>
  <div id="app">Lade…</div>
  <nav class="tabbar" id="tabbar" style="display:none"></nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, doc, getDoc, updateDoc, collection, onSnapshot, addDoc, query, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { playSnake, playReplay } from "./minigame.js";
    import { createHall, TEAM_COLORS as TEAM_COLORS_CSS } from "./hall.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const DEMO = params.has('demo') ? (params.get('demo') === 'kapitaen' ? 'captain' : 'player') : null;
    const token = DEMO ? 'demo-me' : params.get('t');
    const root = document.getElementById('app');
    const tabbar = document.getElementById('tabbar');
    const ENTRANCE_KEY = 'haeckelsche-entrance-' + token;

    let tab = 'hall';
    let S = null;            // aktueller Datenstand
    let hall = null;         // 3D- oder 2D-Halle
    let hall3dMod = null;    // wird nur geladen, wenn der Browser 3D kann
    let picking = false;
    // ---------- Chat ----------
    // Regel: Über dem Kopf steht immer die neueste Nachricht einer Person (bleibt stehen, bis sie etwas Neues schreibt).
    // Die letzten 5 Nachrichten pro Person sieht man durch Antippen der Figur, alles im Chatverlauf.
    const MAX_LEN = 120, MIN_GAP_MS = 3000;
    let messages = [];          // neueste zuerst, max. 100
    let chatOpen = false, unread = 0, lastSent = 0;
    let entranceDone = false;

    // ---------- Live-Daten aus Firebase ----------
    function subscribe() {
      const parts = {}, teams = {};
      let state = { phase: 'setup' };
      const ready = { p: false, t: false, s: false };
      const changed = () => { if (ready.p && ready.t && ready.s) onData(build(parts, teams, state)); };
      onSnapshot(collection(db, 'participants'), snap => {
        snap.docChanges().forEach(c => { if (c.type === 'removed') delete parts[c.doc.id]; else parts[c.doc.id] = { token: c.doc.id, ...c.doc.data() }; });
        ready.p = true; changed();
      }, err => showError(err));
      onSnapshot(collection(db, 'teams'), snap => {
        snap.docChanges().forEach(c => { if (c.type === 'removed') delete teams[c.doc.id]; else teams[c.doc.id] = { id: c.doc.id, ...c.doc.data() }; });
        ready.t = true; changed();
      }, err => showError(err));
      onSnapshot(query(collection(db, 'chat'), orderBy('at', 'desc'), limit(100)), snap => {
        const before = messages.length ? messages[0].at : Date.now();
        messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const fresh = messages.filter(m => m.at > before && m.token !== token).length;
        onMessages(fresh);
      }, () => {});
      onSnapshot(doc(db, 'state', 'current'), snap => {
        state = snap.exists() ? snap.data() : { phase: 'setup' };
        ready.s = true; changed();
      }, err => showError(err));
    }
    function build(parts, teams, state) {
      const all = Object.values(parts);
      return {
        me: parts[token] ?? null, state: { ...state }, teams: { ...teams },
        players: all.filter(p => p.role === 'player'), captains: all.filter(p => p.role === 'captain')
      };
    }
    function showError(err) {
      root.innerHTML = `<div class="card"><p>Verbindung zur Datenbank fehlgeschlagen: ${escapeHtml(err.message)}</p></div>`;
    }

    let renderTimer = null;
    function onData(s) {
      if (!s.me) { root.innerHTML = '<div class="card"><p>Unbekannter Link. Bitte beim Organisator melden.</p></div>'; return; }
      const firstTime = !S;
      const phaseChanged = S && S.state.phase !== s.state.phase;
      S = s;
      if (firstTime) {
        // Ankunft speichern: bestimmt den Sitzplatz (der Erste sitzt ganz links)
        if (!DEMO && !S.me.arrivedAt && S.me.role !== 'admin') {
          S.me.arrivedAt = Date.now();
          updateDoc(doc(db, 'participants', token), { arrivedAt: S.me.arrivedAt }).catch(() => {});
        }
        renderTabbar(); renderTab(); return;
      }
      clearTimeout(renderTimer);
      renderTimer = setTimeout(() => {
        if (picking) return;
        renderTabbar();
        if (phaseChanged || tab !== 'hall' || !hall) renderTab();
        else { renderBanner(); updateHall(); }
      }, 120);
    }

    // ---------- Hilfen ----------
    function columns(s) {
      let ids = s.state.pickOrder?.filter(id => s.teams[id]) ?? [];
      const rest = Object.values(s.teams).filter(t => !ids.includes(t.id))
        .sort((a, b) => capName(s, a).localeCompare(capName(s, b), 'de')).map(t => t.id);
      ids = [...ids, ...rest];
      return ids.map((id, j) => ({ teamId: id, captainToken: s.teams[id].captainToken, j }));
    }
    const capName = (s, t) => s.captains.find(c => c.token === t.captainToken)?.name ?? '';
    const myTeamId = s => Object.keys(s.teams).find(id => s.teams[id].captainToken === s.me.token) || null;
    const turnTeamId = s => s.state.phase === 'draft' && s.state.pickOrder ? s.state.pickOrder[s.state.turnIndex] : null;
    const isMyTurn = s => s.state.phase === 'draft' && (DEMO === 'captain' || (s.me.role === 'captain' && turnTeamId(s) === myTeamId(s) && !!myTeamId(s)));

    // ---------- Tabs ----------
    function tabsFor(s) {
      const t = [{ id: 'hall', icon: '🏟️', label: 'Halle' }];
      if (s.me.role === 'captain') t.push({ id: 'game', icon: '🎮', label: 'Minispiel' });
      t.push({ id: 'board', icon: '🏆', label: 'Leaderboard' });
      return t;
    }
    function renderTabbar() {
      tabbar.style.display = 'flex';
      const needsPlay = S.me.role === 'captain' && S.state.phase === 'minigame' && !S.me.minigamePlayed;
      tabbar.innerHTML = tabsFor(S).map(t => `<button data-tab="${t.id}" class="${t.id === tab ? 'active' : ''}">
          <span>${t.icon}</span>${t.label}${t.id === 'game' && needsPlay ? '<i class="dot"></i>' : ''}</button>`).join('');
      tabbar.querySelectorAll('button').forEach(b => b.onclick = () => {
        if (tab === b.dataset.tab) return;
        tab = b.dataset.tab; renderTabbar(); renderTab(); window.scrollTo(0, 0);
      });
    }

    function header() {
      const role = S.me.role === 'captain' ? 'Kapitän/in' : 'Spieler/in';
      const demo = DEMO ? `<div class="banner demo">🧪 Demo-Modus, nichts wird gespeichert. ${DEMO === 'captain'
        ? 'Du wählst reihum für alle Kapitäne.' : 'Alle paar Sekunden kommt jemand Neues herein.'}</div>` : '';
      return `${demo}<div class="hello"><h1>Hallo ${escapeHtml(S.me.name)}</h1><span>${role}</span></div>`;
    }

    function renderTab() {
      if (hall) { hall.dispose?.(); hall = null; }
      if (tab === 'hall') return renderHallTab();
      if (tab === 'game') return renderGameTab();
      return renderBoardTab();
    }

    // ---------- Halle ----------
    function bannerHtml() {
      const s = S, ph = s.state.phase, me = s.me;
      if (ph === 'setup') {
        const n = s.players.filter(p => p.arrivedAt).length;
        return `<div class="banner">Willkommen in der Halle! <strong>${n}</strong> Spieler sitzen schon auf der Bank. Gleich geht's los. 🏁</div>`;
      }
      if (ph === 'minigame') {
        if (me.role === 'captain' && !me.minigamePlayed)
          return `<div class="banner myturn">Kapitäne spielen um die Wahlreihenfolge. <strong>Starte dein Minispiel</strong> im Tab 🎮 unten.</div>`;
        const done = s.captains.filter(c => c.minigamePlayed).length;
        return `<div class="banner">Die Kapitäne spielen um die Wahlreihenfolge: <strong>${done} von ${s.captains.length}</strong> fertig. Schau im 🏆 Leaderboard zu!</div>`;
      }
      if (ph === 'draft') {
        const t = s.teams[turnTeamId(s)];
        if (isMyTurn(s)) return `<div class="banner myturn">${DEMO ? `Für ${escapeHtml(capName(s, t ?? {}))}: ` : 'Du bist dran! '}Tippe auf einen leuchtenden Spieler.</div>`;
        const mine = me.role === 'player' && me.teamId ? ` Du bist bei <strong>${escapeHtml(s.teams[me.teamId]?.name)}</strong>. 🎉` : '';
        return `<div class="banner">Am Zug: <strong>${escapeHtml(capName(s, t ?? {}))}</strong> (${escapeHtml(t?.name ?? '?')}).${mine}</div>`;
      }
      const myT = me.role === 'player' ? s.teams[me.teamId] : s.teams[myTeamId(s)];
      return `<div class="banner">Die Teams stehen fest! 🎉${myT ? ` Dein Team: <strong>${escapeHtml(myT.name)}</strong>` : ''}</div>`;
    }
    function renderBanner() { const b = document.getElementById('banner'); if (b) b.innerHTML = bannerHtml(); }

    // Wer ist schon in der Halle? (angekommen, oder man selbst)
    function present() {
      return [...S.players, ...S.captains].filter(p => p.arrivedAt || p.token === token);
    }
    function hallData3d() {
      const cols = columns(S).map(c => ({ ...c, color: [0xe11d48, 0x2563eb, 0x16a34a, 0xf59e0b, 0x9333ea, 0x0891b2, 0xea580c, 0xdb2777][c.j % 8] }));
      return { people: present(), columns: cols, turnTeamId: turnTeamId(S), pickable: isMyTurn(S), benchSeats: S.state.benchSeats };
    }
    function hallData2d() {
      const p = present();
      const cols = columns(S).map(c => ({ ...c, color: TEAM_COLORS_CSS[c.j % TEAM_COLORS_CSS.length] }));
      return { players: p.filter(x => x.role === 'player'), captains: p.filter(x => x.role === 'captain'), columns: cols, turnTeamId: turnTeamId(S) };
    }
    function updateHall() {
      if (!hall) return;
      if (hall.is3d) hall.update(hallData3d());
      else hall.update(hallData2d(), { pickable: isMyTurn(S) });
    }

    async function renderHallTab() {
      root.innerHTML = `${header()}<div id="banner">${bannerHtml()}</div><div id="hallWrap"></div>
        <div class="hall-tools">
          <button class="secondary" id="viewBtn" style="display:none"></button>
          <button class="secondary" id="replayIntro">▶ Einlauf</button>
        </div>${chatHtml()}`;
      wireChat();
      const wrap = document.getElementById('hallWrap');
      const tapToken = t => {
        const p = S.players.find(x => x.token === t);
        if (p && !p.teamId && isMyTurn(S)) return askPick(p);
        const any = p ?? S.captains.find(x => x.token === t);
        if (any) showPersonMessages(any);
      };

      // 3D, wenn möglich, sonst die einfache 2D-Halle
      let use3d = false;
      try {
        hall3dMod ??= await import('./hall3d.js');
        use3d = hall3dMod.webglAvailable();
      } catch (e) { use3d = false; }
      if (tab !== 'hall' || document.getElementById('hallWrap') !== wrap) return;

      if (use3d) {
        hall = hall3dMod.createHall3D(wrap, { meToken: token, onPersonTap: tapToken });
        hall.is3d = true;
        updateHall();
        refreshBubbles();
        const hint = document.createElement('div');
        hint.className = 'hall-hint'; hint.textContent = '👆 Wischen zum Umschauen';
        wrap.appendChild(hint);
        setTimeout(() => { hint.style.opacity = '0'; }, 5000);
        const vb = document.getElementById('viewBtn');
        const setBtn = () => { vb.textContent = hall.getView() === 'overview' ? '🧍 Meine Sicht' : '👁 Übersicht'; };
        vb.style.display = ''; setBtn();
        vb.onclick = () => { hall.setView(hall.getView() === 'overview' ? 'first' : 'overview'); setBtn(); };
        const seen = DEMO ? entranceDone : (() => { try { return localStorage.getItem(ENTRANCE_KEY) === '1'; } catch (e) { return false; } })();
        if (!seen) runEntrance(setBtn);
        document.getElementById('replayIntro').onclick = () => runEntrance(setBtn);
      } else {
        wrap.classList.add('flat');
        hall = createHall(wrap, { meToken: token, onPlayerTap: p => tapToken(p.token) });
        updateHall();
        const seen = DEMO ? entranceDone : (() => { try { return localStorage.getItem(ENTRANCE_KEY) === '1'; } catch (e) { return false; } })();
        if (!seen) { hall.playIntro(); markEntrance(); }
        document.getElementById('replayIntro').onclick = () => hall.playIntro();
      }
    }
    function markEntrance() {
      entranceDone = true;
      if (!DEMO) try { localStorage.setItem(ENTRANCE_KEY, '1'); } catch (e) {}
    }
    async function runEntrance(setBtn) {
      markEntrance();
      await hall.playEntrance();
      setBtn?.();
    }

    // ---------- Chat-Funktionen ----------
    function onMessages(freshCount) {
      if (!chatOpen && freshCount) unread += freshCount;
      refreshBubbles();
      renderChatLog();
    }
    function refreshBubbles() {
      if (!hall?.setBubble || !S) return;
      const newest = {};
      for (const m of messages) if (!newest[m.token]) newest[m.token] = m;
      for (const p of [...S.players, ...S.captains]) {
        const m = newest[p.token];
        hall.setBubble(p.token, m ? m.text : null);
      }
    }
    setInterval(refreshBubbles, 2000);

    function chatHtml() {
      return `<form class="chatbar" id="chatForm" autocomplete="off">
          <input id="chatIn" maxlength="${MAX_LEN}" placeholder="Nachricht an alle …" enterkeyhint="send">
          <button type="submit">Senden</button>
          <button type="button" class="secondary" id="chatToggle">💬 ${chatOpen ? 'Zu' : 'Chat'}${!chatOpen && unread ? `<span class="badge">${unread}</span>` : ''}</button>
        </form><div class="chatlog" id="chatLog" style="display:${chatOpen ? 'block' : 'none'}"></div>`;
    }
    function fmtTime(at) { const d = new Date(at); return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }
    function renderChatLog() {
      const log = document.getElementById('chatLog');
      const tg = document.getElementById('chatToggle');
      if (tg) tg.innerHTML = `💬 ${chatOpen ? 'Zu' : 'Chat'}${!chatOpen && unread ? `<span class="badge">${unread}</span>` : ''}`;
      if (!log || !chatOpen) return;
      const list = messages.slice(0, 40).reverse();
      log.innerHTML = list.length ? list.map(m => `<div class="m${m.token === token ? ' mine' : ''}"><b>${escapeHtml(m.name)}</b>
          <span class="t">${fmtTime(m.at)}</span><br>${escapeHtml(m.text)}</div>`).join('')
        : '<div class="m" style="color:#94a3b8">Noch keine Nachrichten. Sag Hallo! 👋</div>';
      log.scrollTop = log.scrollHeight;
    }
    function wireChat() {
      document.getElementById('chatToggle').onclick = () => {
        chatOpen = !chatOpen; if (chatOpen) unread = 0;
        document.getElementById('chatLog').style.display = chatOpen ? 'block' : 'none';
        renderChatLog();
      };
      document.getElementById('chatForm').onsubmit = async e => {
        e.preventDefault();
        const inp = document.getElementById('chatIn');
        const text = inp.value.trim().slice(0, MAX_LEN);
        if (!text) return;
        if (Date.now() - lastSent < MIN_GAP_MS) { inp.placeholder = 'Kurz warten …'; return; }
        lastSent = Date.now();
        inp.value = ''; inp.placeholder = 'Nachricht an alle …';
        const msg = { token, name: S.me.name, text, at: Date.now() };
        if (DEMO) { messages.unshift({ id: 'd' + msg.at, ...msg }); onMessages(0); return; }
        try { await addDoc(collection(db, 'chat'), msg); }
        catch (err) { inp.value = text; alert('Senden fehlgeschlagen: ' + err.message); }
      };
      renderChatLog();
    }
    // Antippen einer Figur (wenn gerade nicht gewählt wird): ihre letzten 5 Nachrichten
    function showPersonMessages(p) {
      const mine = messages.filter(m => m.token === p.token).slice(0, 5);
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal">
        ${p.photoUrl ? `<img src="${escapeHtml(p.photoUrl)}" alt="" onerror="this.remove()">` : ''}
        <h2 style="margin:0 0 4px">${escapeHtml(p.name)}</h2>
        <div style="color:#64748b;font-size:.9rem">${p.role === 'captain' ? 'Kapitän/in' : p.teamId ? 'Team ' + escapeHtml(S.teams[p.teamId]?.name ?? '') : 'Auf der Bank'}</div>
        <div class="msgs5">${mine.length ? mine.map(m => `<div>${escapeHtml(m.text)} <span style="color:#94a3b8;font-size:.75rem">${fmtTime(m.at)}</span></div>`).join('')
          : '<div style="background:none;color:#94a3b8;text-align:center">Hat noch nichts geschrieben.</div>'}</div>
        <button data-a="ok">Schließen</button></div>`;
      document.body.appendChild(bg);
      bg.onclick = e => { if (e.target === bg || e.target.dataset.a === 'ok') bg.remove(); };
    }

    // ---------- Wählen ----------
    function askPick(player) {
      if (!isMyTurn(S) || picking) return;
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal">
        ${player.photoUrl ? `<img src="${escapeHtml(player.photoUrl)}" alt="" onerror="this.remove()">` : ''}
        <h2 style="margin:0 0 6px">${escapeHtml(player.name)} wählen?</h2>
        <p style="margin:0 0 12px;color:#555">Das lässt sich nicht rückgängig machen.</p>
        <button class="secondary" data-a="no">Abbrechen</button><button data-a="yes">Ja, ins Team!</button></div>`;
      document.body.appendChild(bg);
      bg.querySelector('[data-a=no]').onclick = () => bg.remove();
      bg.onclick = e => { if (e.target === bg) bg.remove(); };
      bg.querySelector('[data-a=yes]').onclick = async () => { bg.remove(); await pick(player); };
    }

    async function pick(player) {
      if (DEMO) return demoPick(player);
      picking = true;
      try {
        // frischen Stand prüfen: bin ich dran und ist der Spieler noch frei?
        const st = (await getDoc(doc(db, 'state', 'current'))).data();
        const pl = (await getDoc(doc(db, 'participants', player.token))).data();
        const teamId = myTeamId(S);
        if (st.phase !== 'draft' || st.pickOrder[st.turnIndex] !== teamId || pl.teamId) {
          alert('Das hat sich gerade geändert, bitte nochmal schauen.');
          return;
        }
        await updateDoc(doc(db, 'participants', player.token), { teamId });
        const remaining = S.players.filter(p => !p.teamId && p.token !== player.token).length;
        if (remaining > 0) await updateDoc(doc(db, 'state', 'current'), { turnIndex: (st.turnIndex + 1) % st.pickOrder.length });
        else await updateDoc(doc(db, 'state', 'current'), { phase: 'done' });
      } finally {
        picking = false;
      }
      // Die Live-Updates zeichnen die Halle neu; der Spieler läuft dabei zu seinem Team.
    }

    // ---------- Minispiel (nur Kapitäne) ----------
    function renderGameTab() {
      const s = S, ph = s.state.phase;
      let h = header();
      if (ph === 'setup' && !DEMO) {
        h += `<div class="card"><h2>Minispiel: Snake 🐍</h2><p>Das Minispiel wird freigeschaltet, sobald es losgeht.</p></div>`;
      } else if (DEMO || (ph === 'minigame' && !s.me.minigamePlayed)) {
        h += `<div class="card"><h2>Minispiel: Snake 🐍</h2>
          <p>Sammle so viele Gesichter wie möglich – wer die meisten hat, darf zuerst wählen.
          Erst kommt ein kurzes Tutorial mit Übungsrunde, danach hast du <strong>einen</strong> echten Versuch.</p>
          <button id="playSnake">Minispiel starten</button></div>`;
      } else if (s.me.minigamePlayed) {
        h += `<div class="card"><h2>Dein Ergebnis: ${s.me.minigameScore} 🍎</h2>
          <p>${ph === 'minigame' ? 'Warte, bis alle Kapitäne gespielt haben.' : 'Das Minispiel ist vorbei.'}</p>
          ${s.me.snakeReplay ? '<button class="secondary" id="watchMe">▶ Meinen Versuch ansehen</button>' : ''}</div>`;
      } else {
        h += `<div class="card"><p>Das Minispiel ist vorbei.</p></div>`;
      }
      root.innerHTML = h;
      document.getElementById('playSnake')?.addEventListener('click', () => {
        if (DEMO) return playSnake({ testMode: true, onFinish() {}, onClose() {} });
        playSnake({
          onFinish: async ({ score, replay }) => {
            await updateDoc(doc(db, 'participants', token), { minigameScore: score, minigamePlayed: true, snakeReplay: replay });
          },
          onClose() {}
        });
      });
      document.getElementById('watchMe')?.addEventListener('click', () =>
        playReplay({ name: s.me.name, score: s.me.minigameScore, replay: s.me.snakeReplay }));
    }

    // ---------- Leaderboard ----------
    function renderBoardTab() {
      const s = S;
      const done = s.captains.filter(c => c.minigamePlayed).sort((a, b) => (b.minigameScore ?? 0) - (a.minigameScore ?? 0));
      const waiting = s.captains.filter(c => !c.minigamePlayed);
      const medals = ['🥇', '🥈', '🥉'];
      let h = header() + '<h2 style="margin-top:4px">🏆 Leaderboard Snake</h2>';
      if (!done.length) h += '<div class="card"><p>Noch hat kein Kapitän gespielt.</p></div>';
      done.forEach((c, i) => {
        const team = Object.values(s.teams).find(t => t.captainToken === c.token);
        h += `<div class="card" style="display:flex;align-items:center;gap:12px">
          <div style="font-size:1.6rem;width:36px;text-align:center">${medals[i] ?? (i + 1) + '.'}</div>
          <div style="flex:1"><strong>${escapeHtml(c.name)}</strong><br>
            <span style="color:#555;font-size:.9rem">${escapeHtml(team?.name ?? '')} · ${c.minigameScore} 🍎</span></div>
          ${c.snakeReplay ? `<button class="watch" data-token="${c.token}">▶ Ansehen</button>` : ''}
        </div>`;
      });
      if (waiting.length) h += `<p style="color:#555">Noch nicht gespielt: ${waiting.map(c => escapeHtml(c.name)).join(', ')}</p>`;
      root.innerHTML = h;
      document.querySelectorAll('.watch').forEach(btn => btn.addEventListener('click', () => {
        const c = s.captains.find(x => x.token === btn.dataset.token);
        if (c) playReplay({ name: c.name, score: c.minigameScore, replay: c.snakeReplay });
      }));
    }

    // ---------- Demo-Modus: index.html?demo (Spieler) oder ?demo=kapitaen ----------
    function demoStart() {
      const names = ['Anna', 'Ben', 'Clara', 'David', 'Emil', 'Fiona', 'Greta', 'Hannes', 'Ida', 'Jonas', 'Klara', 'Leon', 'Mia', 'Noah'];
      const longHair = new Set(['Anna', 'Clara', 'Fiona', 'Greta', 'Ida', 'Klara', 'Mia']);
      const t0 = Date.now() - 600000;
      const mk = (n, i, extra = {}) => ({ token: 'demo-p-' + i, name: n, role: 'player', teamId: null, hair: longHair.has(n) ? 'lang' : 'kurz',
        photoUrl: i % 4 === 1 ? 'faces/face' + (1 + (i % 2)) + '.png' : null, arrivedAt: t0 + i * 1000, ...extra });
      const players = names.slice(0, 9).map((n, i) => mk(n, i));
      const later = names.slice(9).map((n, i) => mk(n, i + 9, { arrivedAt: null }));
      const capNames = ['Lorenz', 'Max', 'Sophie', 'Felix'];
      const captains = capNames.map((n, i) => ({ token: 'demo-cap-' + i, name: n, role: 'captain', hair: n === 'Sophie' ? 'lang' : 'kurz',
        minigamePlayed: true, minigameScore: [17, 12, 9, 5][i], photoUrl: i < 2 ? 'faces/face' + (i + 1) + '.png' : null, arrivedAt: t0 }));
      const teams = {};
      captains.forEach((c, i) => { teams['demo-t' + i] = { id: 'demo-t' + i, name: ['Eisbären', 'Schneeeulen', 'Pinguine', 'Polarfüchse'][i], captainToken: c.token }; });
      let me;
      if (DEMO === 'captain') {
        captains[0] = { ...captains[0], token: 'demo-me' };
        teams['demo-t0'].captainToken = 'demo-me';
        me = captains[0];
        players.push(...later.map(p => ({ ...p, arrivedAt: Date.now() })));
      } else {
        me = { token: 'demo-me', name: 'Du', role: 'player', teamId: null, hair: 'kurz', photoUrl: 'faces/face1.png', arrivedAt: Date.now() };
        players.push(me);
      }
      const state = DEMO === 'captain' ? { phase: 'draft', pickOrder: Object.keys(teams), turnIndex: 0 } : { phase: 'setup' };
      const s = { me, state, teams, players, captains };
      onData(s);
      // Spieler-Demo: nach und nach kommen weitere Leute herein
      if (DEMO === 'player') {
        let k = 0;
        const iv = setInterval(() => {
          if (k >= later.length) return clearInterval(iv);
          S.players.push({ ...later[k++], arrivedAt: Date.now() });
          onData({ ...S, players: [...S.players] });
        }, 9000);
      }
    }
    function demoChatter() {
      const lines = ['Hallo zusammen! 👋', 'Wer hat die Musik mitgebracht? 🎶', 'Ich will ins Team von Lorenz!',
        'Kalt hier draußen 🥶', 'Hat jemand den Springer gesehen?? 😮', 'Wann geht es los?', 'Wir gewinnen eh 💪',
        'Schöner Schneemann ⛄', 'Bitte wählt mich zuerst 🙏', 'Biathlon kann ich auch!'];
      let k = 0;
      setInterval(() => {
        if (!S) return;
        const pool = [...S.players, ...S.captains].filter(p => p.token !== token && p.arrivedAt);
        const p = pool[Math.floor(Math.random() * pool.length)];
        if (!p) return;
        messages.unshift({ id: 'd' + Date.now(), token: p.token, name: p.name, text: lines[k++ % lines.length], at: Date.now() });
        onMessages(1);
      }, 3500);
    }
    function demoPick(player) {
      const teamId = turnTeamId(S);
      const players = S.players.map(p => p.token === player.token ? { ...p, teamId } : p);
      const state = { ...S.state };
      if (!players.some(p => !p.teamId)) state.phase = 'done';
      else state.turnIndex = (state.turnIndex + 1) % state.pickOrder.length;
      onData({ ...S, players, state });
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    if (DEMO) { demoStart(); demoChatter(); }
    else if (!token) root.innerHTML = '<div class="card"><p>Kein gültiger Link. Bitte den persönlichen Link bzw. QR-Code benutzen.</p></div>';
    else subscribe();
  </script>
</body>
</html>
