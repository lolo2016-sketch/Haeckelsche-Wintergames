<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Haeckelsche Wintergames</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Vollbild: die Halle ist der Hintergrund, alles andere schwebt halbdurchsichtig darüber */
  html, body { margin:0; padding:0; max-width:none; width:100%; height:100%; overflow:hidden; background:#0b1220; overscroll-behavior:none; }
  :root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
  #stage { position:fixed; inset:0; width:100vw; height:100dvh; background:#dbe8f6; }
  #stage.flat { overflow:auto; padding:calc(110px + var(--st)) 10px calc(170px + var(--sb)); }
  .glass { background:rgba(15,23,42,.58); color:#f8fafc; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); box-shadow:0 4px 18px rgba(0,0,0,.18); }
  .hud { position:fixed; z-index:20; pointer-events:none; }
  .hud > * { pointer-events:auto; }
  #top { top:calc(8px + var(--st)); left:8px; right:8px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .chip { border-radius:999px; padding:5px 12px; font-size:.82rem; font-weight:600; }
  .chip.demo { background:rgba(124,58,237,.82); }
  .banner { border-radius:14px; padding:8px 12px; font-size:.9rem; line-height:1.35; max-width:560px; }
  .banner strong { color:#fde047; }
  .banner.myturn { background:rgba(250,204,21,.92); color:#422006; font-weight:600; }
  .banner.myturn strong { color:#422006; }
  .my-msg { border-radius:12px; padding:6px 10px; font-size:.85rem; display:none; max-width:min(560px, calc(100vw - 16px));
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:rgba(255,255,255,.9); color:#0f172a; }
  .my-msg b { color:#16a34a; }
  #side { right:8px; top:calc(50% - 50px); display:flex; flex-direction:column; gap:8px; }
  .round { width:48px; height:48px; border-radius:50%; font-size:1.3rem; display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin:0; padding:0; }
  #bottom { left:8px; right:8px; bottom:calc(8px + var(--sb)); display:flex; flex-direction:column; gap:6px; }
  .chatlog { border-radius:14px; padding:6px 12px; max-height:34vh; overflow-y:auto; font-size:.9rem; }
  .chatlog .m { padding:4px 0; border-bottom:1px solid rgba(255,255,255,.12); word-wrap:break-word; }
  .chatlog .m:last-child { border-bottom:none; }
  .chatlog .m b { color:#93c5fd; }
  .chatlog .m.mine b { color:#86efac; }
  .chatlog .t { color:#94a3b8; font-size:.72rem; margin-left:4px; }
  .chatbar { display:flex; gap:6px; align-items:center; border-radius:999px; padding:4px 4px 4px 14px; }
  .chatbar input { flex:1; min-width:0; margin:0; border:none; background:transparent; color:#fff; font-size:16px; padding:8px 0; outline:none; }
  .chatbar input::placeholder { color:#cbd5e1; }
  .chatbar button { margin:0; border-radius:999px; padding:8px 14px; white-space:nowrap; }
  .chatbar .ghost { background:rgba(255,255,255,.14); }
  .badge { background:#ef4444; color:#fff; border-radius:999px; padding:1px 7px; font-size:.72rem; margin-left:4px; }
  .tabbar { display:flex; gap:6px; justify-content:center; }
  .tabbar button { flex:1; max-width:170px; margin:0; border-radius:16px; padding:7px 4px; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:1px; font-size:.76rem; font-weight:600; color:#e2e8f0; }
  .tabbar button span { font-size:1.3rem; line-height:1; }
  .tabbar button.active { background:rgba(37,99,235,.85); color:#fff; }
  .tabbar .dot { width:9px; height:9px; border-radius:50%; background:#ef4444; position:absolute; top:5px; right:calc(50% - 20px); }
  #panel { position:fixed; z-index:30; left:8px; right:8px; top:calc(8px + var(--st)); bottom:calc(76px + var(--sb));
    max-width:640px; margin:0 auto; overflow-y:auto; border-radius:20px; padding:14px 14px 18px;
    background:rgba(248,250,252,.86); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 40px rgba(0,0,0,.3); color:#0f172a; }
  #panel[hidden] { display:none; }
  #panel .close { position:sticky; top:0; float:right; margin:0; width:36px; height:36px; border-radius:50%; padding:0;
    background:rgba(15,23,42,.08); color:#0f172a; font-size:1.1rem; z-index:2; }
  #panel .card { background:rgba(255,255,255,.85); }
  .hall-hint { position:absolute; left:50%; bottom:calc(140px + var(--sb)); transform:translateX(-50%); background:rgba(15,23,42,.7); color:#fff;
    padding:6px 12px; border-radius:999px; font-size:.85rem; pointer-events:none; white-space:nowrap; transition:opacity .6s; z-index:5; }
  #app:empty { display:none; }
  #app { position:fixed; z-index:40; left:12px; right:12px; top:30%; max-width:420px; margin:0 auto; }
  .msgs5 { text-align:left; margin:8px 0 12px; }
  .msgs5 div { background:#f1f5f9; border-radius:12px; padding:6px 10px; margin:4px 0; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:900; padding:16px; }
  .modal { background:#fff; border-radius:14px; padding:18px; max-width:320px; width:100%; text-align:center; color:#0f172a; }
  .modal img { height:110px; display:block; margin:0 auto 8px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="top" class="hud"></div>
  <div id="side" class="hud"></div>
  <div id="bottom" class="hud" style="display:none">
    <div class="chatlog glass" id="chatLog" style="display:none"></div>
    <form class="chatbar glass" id="chatForm" autocomplete="off">
      <input id="chatIn" maxlength="120" placeholder="Nachricht an alle …" enterkeyhint="send">
      <button type="submit">Senden</button>
      <button type="button" class="ghost" id="chatToggle">💬</button>
    </form>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
  <div id="panel" hidden><button class="close" id="panelClose" aria-label="Schließen">✕</button><div id="panelBody"></div></div>
  <div id="app"><div class="card"><p>Lade …</p></div></div>

  <script type="module">
    // ?v=… hinter den eigenen Dateien: zwingt Handys, nach einem Update alle Dateien neu zu laden
    // (sonst mischt der Browser-Zwischenspeicher alte und neue Dateien). Bei jedem Update hochzählen.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, doc, getDoc, getDocs, updateDoc, collection, onSnapshot, addDoc, query, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { playSnake, playReplay } from "./minigame.js?v=20261018";
    import { playBiathlon, playBiathlonReplay, formatBiathlon } from "./biathlon.js?v=20261018";
    import { createHall } from "./hall.js?v=20261018";
    import { compareRank, playedGame, finishPairs, planPairs, teamColor, isPerson, DEFAULT_FOUNDERS } from "./draft.js?v=20261018";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    // Demo: index.html?demo (einlaufen) oder index.html?demo=wahl (Teamwahl ausprobieren; ?demo=kapitaen geht weiterhin)
    const DEMO = params.has('demo') ? (['wahl', 'kapitaen'].includes(params.get('demo')) ? 'pick' : 'enter') : null;
    let token = DEMO ? 'demo-me' : params.get('t');
    const root = document.getElementById('app');
    const tabbar = document.getElementById('tabbar');

    let tab = 'hall';
    let S = null;            // aktueller Datenstand: { me, state, teams, people }
    let hall = null;         // 3D- oder 2D-Halle
    let hall3dMod = null;    // wird nur geladen, wenn der Browser 3D kann
    let picking = false;
    // ---------- Chat ----------
    // Regel: Über dem Kopf steht immer die neueste Nachricht einer Person (bleibt stehen, bis sie etwas Neues schreibt).
    // Die letzten 5 Nachrichten pro Person sieht man durch Antippen der Figur, alles im Chatverlauf.
    const MAX_LEN = 120, MIN_GAP_MS = 3000;
    let messages = [];          // neueste zuerst, max. 100
    let chatOpen = false, unread = 0, lastSent = 0;
    // Einlauf genau einmal: beim allerersten Öffnen des eigenen Links (dann wird arrivedAt gespeichert).
    // Danach sitzt man immer direkt auf seinem Platz, auch auf anderen Geräten.
    let needsEntrance = false;

    // ---------- Live-Daten aus Firebase ----------
    function subscribe() {
      const parts = {}, teams = {};
      let state = { phase: 'setup' };
      const ready = { p: false, t: false, s: false };
      const changed = () => { if (ready.p && ready.t && ready.s) onData(build(parts, teams, state)); };
      onSnapshot(collection(db, 'participants'), snap => {
        snap.docChanges().forEach(c => { if (c.type === 'removed') delete parts[c.doc.id]; else parts[c.doc.id] = { token: c.doc.id, ...c.doc.data() }; });
        ready.p = true; changed();
      }, err => showError(err));
      onSnapshot(collection(db, 'teams'), snap => {
        snap.docChanges().forEach(c => { if (c.type === 'removed') delete teams[c.doc.id]; else teams[c.doc.id] = { id: c.doc.id, ...c.doc.data() }; });
        ready.t = true; changed();
      }, err => showError(err));
      onSnapshot(query(collection(db, 'chat'), orderBy('at', 'desc'), limit(100)), snap => {
        const before = messages.length ? messages[0].at : Date.now();
        messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const fresh = messages.filter(m => m.at > before && m.token !== token).length;
        onMessages(fresh);
      }, () => {});
      onSnapshot(doc(db, 'state', 'current'), snap => {
        state = snap.exists() ? snap.data() : { phase: 'setup' };
        ready.s = true; changed();
      }, err => showError(err));
    }
    // Alle außer Admins sind Teilnehmer (frühere Rollen Kapitän/Spieler spielen keine Rolle mehr)
    function build(parts, teams, state) {
      return { me: parts[token] ?? null, state: { ...state }, teams: { ...teams }, people: Object.values(parts).filter(isPerson) };
    }
    function showError(err) {
      root.innerHTML = `<div class="card"><p>Verbindung zur Datenbank fehlgeschlagen: ${escapeHtml(err.message)}</p></div>`;
    }

    let renderTimer = null;
    function onData(s) {
      if (!s.me) { root.innerHTML = '<div class="card"><p>Unbekannter Link. Bitte beim Organisator melden.</p></div>'; return; }
      const firstTime = !S;
      const phaseChanged = S && S.state.phase !== s.state.phase;
      S = s;
      if (firstTime) {
        // Ankunft speichern: bestimmt den Sitzplatz (die Erste sitzt mittig, dann abwechselnd links/rechts)
        if (DEMO === 'enter') needsEntrance = true;
        if (!DEMO && !S.me.arrivedAt && S.me.role !== 'admin') {
          needsEntrance = true;
          S.me.arrivedAt = Date.now();
          updateDoc(doc(db, 'participants', token), { arrivedAt: S.me.arrivedAt }).catch(() => {});
        }
        renderTabbar(); renderTab(); return;
      }
      clearTimeout(renderTimer);
      renderTimer = setTimeout(() => {
        if (picking) return;
        renderTabbar();
        renderTop(); updateHall();
        if (tab !== 'hall' || phaseChanged) renderTab();
      }, 120);
    }

    // ---------- Hilfen ----------
    const teamList = s => Object.values(s.teams).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
      .map((t, i) => ({ ...t, css: teamColor(t.order ?? i) }));
    const teamOf = (s, p) => p?.teamId ? teamList(s).find(t => t.id === p.teamId) ?? null : null;
    const foundedTeamId = s => Object.keys(s.teams).find(id => s.teams[id].captainToken === s.me.token) || null;
    const turnTeamId = s => s.state.phase === 'draft' && s.state.pickOrder ? s.state.pickOrder[s.state.turnIndex] : null;
    const turnFounder = s => s.teams[turnTeamId(s)]?.captainToken ?? null;
    const isMyTurn = s => s.state.phase === 'draft' && !!turnTeamId(s) && (DEMO === 'pick' || turnFounder(s) === s.me.token);
    const personName = (s, tok) => s.people.find(p => p.token === tok)?.name ?? '?';
    const teamMates = (s, p) => p?.teamId ? s.people.filter(x => x.teamId === p.teamId && x.token !== p.token) : [];
    // Wie viele dürfen wählen (Anzeige während des Minispiels)
    const foundersPlanned = s => Math.max(1, Math.min(Number(s.state.founders) || DEFAULT_FOUNDERS, Math.floor(s.people.length / 2) || 1));
    const dot = css => `<span style="display:inline-block;width:.75em;height:.75em;border-radius:50%;background:${css};vertical-align:-1px;margin-right:4px"></span>`;

    // ---------- Tabs ----------
    function tabsFor() {
      return [{ id: 'hall', icon: '🏟️', label: 'Halle' }, { id: 'game', icon: '🎮', label: 'Minispiel' }, { id: 'board', icon: '🏆', label: 'Leaderboard' }];
    }
    function renderTabbar() {
      const needsPlay = S.state.phase === 'minigame' && !playedActive(S.me);
      tabbar.innerHTML = tabsFor().map(t => `<button data-tab="${t.id}" class="glass ${t.id === tab ? 'active' : ''}">
          <span>${t.icon}</span>${t.label}${t.id === 'game' && needsPlay ? '<i class="dot"></i>' : ''}</button>`).join('');
      tabbar.querySelectorAll('button').forEach(b => b.onclick = () => {
        tab = tab === b.dataset.tab ? 'hall' : b.dataset.tab;   // nochmal tippen = zurück zur Halle
        renderTabbar(); renderTab();
      });
    }

    // Oben schwebend: Name/Team, Hinweis-Banner, eigene letzte Nachricht
    function renderTop() {
      const t = teamOf(S, S.me);
      const demo = DEMO ? `<div class="chip glass demo">🧪 Demo · nichts wird gespeichert</div>` : '';
      const star = foundedTeamId(S) ? '★ ' : '';
      document.getElementById('top').innerHTML = `${demo}<div class="chip glass">👋 ${star}${escapeHtml(S.me.name)}${t ? ` · ${dot(t.css)}${escapeHtml(t.name)}` : ''}</div>
        <div id="banner">${bannerHtml()}</div><div class="my-msg" id="myMsg"></div>`;
      refreshBubbles();
    }

    // Die Halle bleibt immer im Hintergrund; Minispiel und Leaderboard öffnen sich als Fenster darüber
    function renderTab() {
      document.getElementById('app').innerHTML = '';
      document.getElementById('bottom').style.display = '';
      ensureHall();
      renderTop();
      const panel = document.getElementById('panel');
      const chat = [document.getElementById('chatForm'), document.getElementById('chatLog')];
      if (tab === 'hall') {
        panel.hidden = true;
        chat[0].style.display = ''; chat[1].style.display = chatOpen ? '' : 'none';
        return;
      }
      panel.hidden = false;
      chat.forEach(c => { c.style.display = 'none'; });
      if (tab === 'game') renderGameTab(); else renderBoardTab();
    }

    // ---------- Banner ----------
    function bannerHtml() { return glassBanner(bannerHtmlRaw()); }
    function bannerHtmlRaw() {
      const s = S, ph = s.state.phase, me = s.me, G = GAMES[activeGame()];
      if (ph === 'setup') {
        const n = s.people.filter(p => p.arrivedAt).length;
        return `<div class="banner">Willkommen bei den Wintergames! <strong>${n}</strong> sitzen schon in der Runde. Gleich geht's los. 🏁</div>`;
      }
      if (ph === 'minigame') {
        const F = foundersPlanned(s);
        if (!playedActive(me))
          return `<div class="banner myturn">Alle spielen mit! <strong>Starte dein Minispiel</strong> im Tab 🎮 unten. Die besten ${F} dürfen sich danach einen Teamkollegen aussuchen.</div>`;
        const done = s.people.filter(playedActive).length;
        return `<div class="banner">${G.name}: <strong>${done} von ${s.people.length}</strong> haben gespielt. Die besten ${F} wählen danach. Schau im 🏆 Leaderboard zu!</div>`;
      }
      if (ph === 'draft') {
        const t = s.teams[turnTeamId(s)];
        const fName = personName(s, t?.captainToken);
        if (isMyTurn(s)) return `<div class="banner myturn">${DEMO ? `Für ${escapeHtml(fName)}: ` : 'Du bist dran! '}Tippe auf eine leuchtende Person, die in ${DEMO ? 'das' : 'dein'} Team soll.</div>`;
        const mates = teamMates(s, me);
        const mine = me.teamId && !foundedTeamId(s) ? ` Du bist im Team von <strong>${escapeHtml(personName(s, s.teams[me.teamId]?.captainToken))}</strong>. 🎉`
          : foundedTeamId(s) && mates.length ? ` Du hast <strong>${escapeHtml(mates.map(m => m.name).join(', '))}</strong> gewählt. 🎉` : '';
        return `<div class="banner">Teamwahl · am Zug: <strong>${escapeHtml(fName)}</strong> (Platz ${s.state.turnIndex + 1} von ${s.state.pickOrder.length}).${mine}
          ${!me.teamId ? ' Wer nicht gewählt wird, bekommt danach zufällig einen Partner.' : ''}</div>`;
      }
      const mates = teamMates(s, me);
      return `<div class="banner">Die Teams stehen fest! 🎉${mates.length ? ` Du spielst mit <strong>${escapeHtml(mates.map(m => m.name).join(' & '))}</strong>.` : ''}</div>`;
    }
    // Banner-Klassen: halbdurchsichtig über der Halle
    const glassBanner = html => html.replace('class="banner"', 'class="banner glass"').replace('class="banner myturn"', 'class="banner glass myturn"');

    // ---------- Halle ----------
    // Wer ist schon da? (angekommen, oder man selbst)
    function present() {
      return S.people.filter(p => p.arrivedAt || p.token === token);
    }
    function hallData3d() {
      const teams = teamList(S).map(t => ({ id: t.id, captainToken: t.captainToken, order: t.order ?? 0, color: parseInt(t.css.slice(1), 16) }));
      return { people: present(), teams, turnToken: turnFounder(S), pickable: isMyTurn(S), benchSeats: S.state.benchSeats };
    }
    // Einfache 2D-Halle (sehr alte Handys): Gründer stehen vorne, ihre Teams dahinter
    function hallData2d() {
      const p = present();
      const founders = new Set(Object.values(S.teams).map(t => t.captainToken).filter(Boolean));
      const cols = teamList(S).map((t, j) => ({ teamId: t.id, captainToken: t.captainToken, color: t.css, j }));
      return { players: p.filter(x => !founders.has(x.token)), captains: p.filter(x => founders.has(x.token)), columns: cols, turnTeamId: turnTeamId(S) };
    }
    function updateHall() {
      if (!hall) return;
      if (hall.is3d) hall.update(hallData3d());
      else hall.update(hallData2d(), { pickable: isMyTurn(S) });
    }

    let hallStarting = false;
    async function ensureHall() {
      if (hall || hallStarting) return;
      hallStarting = true;
      const wrap = document.getElementById('stage');
      const side = document.getElementById('side');
      side.innerHTML = `<button class="round glass" id="viewBtn" style="display:none" title="Ansicht wechseln"></button>
        ${DEMO ? '<button class="round glass" id="replayIntro" title="Einlauf nochmal">▶</button>' : ''}`;
      const tapToken = t => {
        const p = S.people.find(x => x.token === t);
        if (!p) return;
        if (!p.teamId && p.token !== token && isMyTurn(S)) return askPick(p);
        showPersonMessages(p);
      };

      // 3D, wenn möglich, sonst die einfache 2D-Halle
      let use3d = false;
      try {
        hall3dMod ??= await import('./hall3d.js?v=20261018');
        use3d = hall3dMod.webglAvailable();
      } catch (e) { use3d = false; }

      if (use3d) {
        hall = hall3dMod.createHall3D(wrap, { meToken: token, onPersonTap: tapToken });
        hall.is3d = true;
        updateHall();
        refreshBubbles();
        const hint = document.createElement('div');
        hint.className = 'hall-hint'; hint.textContent = '👆 Wischen zum Umschauen';
        wrap.appendChild(hint);
        setTimeout(() => { hint.style.opacity = '0'; }, 5000);
        const vb = document.getElementById('viewBtn');
        const setBtn = () => {
          const v = hall.getView();
          vb.textContent = v === 'orbit' ? '🧍' : '🎥';
          vb.title = v === 'orbit' ? 'Ich-Sicht' : 'Rundumblick';
          hint.textContent = v === 'orbit' ? '👆 Wischen = drehen · 2 Finger = Zoom' : '👆 Wischen zum Umschauen';
        };
        vb.style.display = ''; setBtn();
        vb.onclick = () => {
          if (['follow', 'toEyes'].includes(hall.getView())) return;   // während des Einlaufs nicht umschalten
          hall.setView(hall.getView() === 'orbit' ? 'first' : 'orbit'); setBtn();
          hint.style.opacity = '1'; clearTimeout(hint._t); hint._t = setTimeout(() => { hint.style.opacity = '0'; }, 4000);
        };
        if (needsEntrance) runEntrance(setBtn);
        const rb = document.getElementById('replayIntro');
        if (rb) rb.onclick = () => runEntrance(setBtn);
      } else {
        wrap.classList.add('flat');
        hall = createHall(wrap, { meToken: token, onPlayerTap: p => tapToken(p.token) });
        updateHall();
        if (needsEntrance) { hall.playIntro(); needsEntrance = false; }
        const rb = document.getElementById('replayIntro');
        if (rb) rb.onclick = () => hall.playIntro();
      }
      hallStarting = false;
    }
    async function runEntrance(setBtn) {
      needsEntrance = false;
      await hall.playEntrance();
      setBtn?.();
    }

    // ---------- Chat-Funktionen ----------
    function onMessages(freshCount) {
      if (!chatOpen && freshCount) unread += freshCount;
      refreshBubbles();
      renderChatLog();
    }
    function refreshBubbles() {
      if (!hall?.setBubble || !S) return;
      const newest = {};
      for (const m of messages) if (!newest[m.token]) newest[m.token] = m;
      for (const p of S.people) {
        const m = newest[p.token];
        hall.setBubble(p.token, m ? m.text : null);
      }
      const my = document.getElementById('myMsg');
      if (my) {
        const m = newest[token];
        my.style.display = m ? 'block' : 'none';
        if (m) my.innerHTML = `💬 <b>Du:</b> ${escapeHtml(m.text)}`;
      }
    }
    setInterval(refreshBubbles, 2000);

    function fmtTime(at) { const d = new Date(at); return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }
    function renderChatLog() {
      const log = document.getElementById('chatLog');
      const tg = document.getElementById('chatToggle');
      if (tg) tg.innerHTML = `${chatOpen ? '✕' : '💬'}${!chatOpen && unread ? `<span class="badge">${unread}</span>` : ''}`;
      if (!log || !chatOpen) return;
      const list = messages.slice(0, 40).reverse();
      log.innerHTML = list.length ? list.map(m => `<div class="m${m.token === token ? ' mine' : ''}"><b>${escapeHtml(m.name)}</b>
          <span class="t">${fmtTime(m.at)}</span><br>${escapeHtml(m.text)}</div>`).join('')
        : '<div class="m" style="color:#94a3b8">Noch keine Nachrichten. Sag Hallo! 👋</div>';
      log.scrollTop = log.scrollHeight;
    }
    function wireChat() {
      document.getElementById('chatToggle').onclick = () => {
        chatOpen = !chatOpen; if (chatOpen) unread = 0;
        document.getElementById('chatLog').style.display = chatOpen && tab === 'hall' ? '' : 'none';
        renderChatLog();
      };
      document.getElementById('chatForm').onsubmit = async e => {
        e.preventDefault();
        const inp = document.getElementById('chatIn');
        const text = inp.value.trim().slice(0, MAX_LEN);
        if (!text) return;
        if (Date.now() - lastSent < MIN_GAP_MS) { inp.placeholder = 'Kurz warten …'; return; }
        lastSent = Date.now();
        inp.value = ''; inp.placeholder = 'Nachricht an alle …';
        const msg = { token, name: S.me.name, text, at: Date.now() };
        if (DEMO) { messages.unshift({ id: 'd' + msg.at, ...msg }); onMessages(0); return; }
        try { await addDoc(collection(db, 'chat'), msg); }
        catch (err) { inp.value = text; alert('Senden fehlgeschlagen: ' + err.message); }
      };
      renderChatLog();
    }
    // Antippen einer Figur (wenn gerade nicht gewählt wird): ihre letzten 5 Nachrichten
    function showPersonMessages(p) {
      const mine = messages.filter(m => m.token === p.token).slice(0, 5);
      const t = teamOf(S, p);
      const isFounder = Object.values(S.teams).some(x => x.captainToken === p.token);
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal">
        ${p.photoUrl ? `<img src="${escapeHtml(p.photoUrl)}" alt="" onerror="this.remove()">` : ''}
        <h2 style="margin:0 0 4px">${isFounder ? '★ ' : ''}${escapeHtml(p.name)}</h2>
        <div style="color:#64748b;font-size:.9rem">${t ? dot(t.css) + escapeHtml(t.name) : 'Noch ohne Team'}</div>
        <div class="msgs5">${mine.length ? mine.map(m => `<div>${escapeHtml(m.text)} <span style="color:#94a3b8;font-size:.75rem">${fmtTime(m.at)}</span></div>`).join('')
          : '<div style="background:none;color:#94a3b8;text-align:center">Hat noch nichts geschrieben.</div>'}</div>
        <button data-a="ok">Schließen</button></div>`;
      document.body.appendChild(bg);
      bg.onclick = e => { if (e.target === bg || e.target.dataset.a === 'ok') bg.remove(); };
    }

    // ---------- Wählen ----------
    function askPick(player) {
      if (!isMyTurn(S) || picking) return;
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal">
        ${player.photoUrl ? `<img src="${escapeHtml(player.photoUrl)}" alt="" onerror="this.remove()">` : ''}
        <h2 style="margin:0 0 6px">${escapeHtml(player.name)} wählen?</h2>
        <p style="margin:0 0 12px;color:#555">Das lässt sich nicht rückgängig machen.</p>
        <button class="secondary" data-a="no">Abbrechen</button><button data-a="yes">Ja, ins Team!</button></div>`;
      document.body.appendChild(bg);
      bg.querySelector('[data-a=no]').onclick = () => bg.remove();
      bg.onclick = e => { if (e.target === bg) bg.remove(); };
      bg.querySelector('[data-a=yes]').onclick = async () => { bg.remove(); await pick(player); };
    }

    async function pick(player) {
      if (DEMO) return demoPick(player);
      picking = true;
      try {
        // frischen Stand prüfen: bin ich dran und ist die Person noch frei?
        const st = (await getDoc(doc(db, 'state', 'current'))).data();
        const pl = (await getDoc(doc(db, 'participants', player.token))).data();
        const teamId = foundedTeamId(S);
        if (st.phase !== 'draft' || st.pickOrder[st.turnIndex] !== teamId || pl.teamId) {
          alert('Das hat sich gerade geändert, bitte nochmal schauen.');
          return;
        }
        await updateDoc(doc(db, 'participants', player.token), { teamId, pickedAt: Date.now() });
        if (st.turnIndex + 1 < st.pickOrder.length) {
          await updateDoc(doc(db, 'state', 'current'), { turnIndex: st.turnIndex + 1 });
        } else {
          // Letzte Wahl: alle anderen werden zufällig zu Zweierteams gepaart
          const people = [], teams = {};
          (await getDocs(collection(db, 'participants'))).forEach(d => { const p = { token: d.id, ...d.data() }; if (isPerson(p)) people.push(p); });
          (await getDocs(collection(db, 'teams'))).forEach(d => { teams[d.id] = { id: d.id, ...d.data() }; });
          await finishPairs(db, people, teams, st);
        }
      } catch (err) {
        alert('Speichern fehlgeschlagen: ' + err.message);
      } finally {
        picking = false;
      }
      // Die Live-Updates zeichnen die Halle neu; die gewählte Person setzt sich neben ihr Team.
    }

    // ---------- Minispiele: Snake und Biathlon-Sprint ----------
    // Welches Spiel über die Teamwahl entscheidet, legt der Admin fest (state.activeGame).
    const GAMES = {
      snake: {
        name: 'Winter-Snake 🎅',
        info: 'Sammle so viele Gesichter wie möglich – die Besten dürfen sich danach einen Teamkollegen aussuchen.',
        played: p => playedGame('snake', p),
        label: p => `${p.minigameScore} 🎅`,
        canWatch: p => !!p.snakeReplay,
        watch: p => playReplay({ name: p.name, score: p.minigameScore, replay: p.snakeReplay, photoUrl: p.photoUrl }),
        play: (test, onDone) => playSnake({
          testMode: test, onClose: onDone, photoUrl: S.me.photoUrl,
          onFinish: test ? () => {} : async ({ score, replay }) =>
            updateDoc(doc(db, 'participants', token), { minigameScore: score, minigamePlayed: true, minigameAt: Date.now(), snakeReplay: replay })
        })
      },
      biathlon: {
        name: 'Biathlon-Sprint ⛷️',
        info: 'Fahre über die Hindernisse ins Ziel – die schnellsten Zeiten dürfen sich einen Teamkollegen aussuchen.',
        played: p => playedGame('biathlon', p),
        label: p => formatBiathlon(p.biathlon),
        canWatch: p => !!p.biathlon?.replay,
        watch: p => playBiathlonReplay({ name: p.name, result: p.biathlon, photoUrl: p.photoUrl }),
        play: (test, onDone) => playBiathlon({
          testMode: test, photoUrl: S.me.photoUrl, onClose: onDone,
          onFinish: test ? () => {} : async result => updateDoc(doc(db, 'participants', token), { biathlon: result })
        })
      }
    };
    const activeGame = () => GAMES[S?.state.activeGame] ? S.state.activeGame : 'snake';
    const playedActive = p => GAMES[activeGame()].played(p);

    // ---------- Minispiel-Tab (für alle) ----------
    function renderGameTab() {
      const s = S, ph = s.state.phase, gk = activeGame(), G = GAMES[gk];
      let h = '';
      if (DEMO) {
        // Demo: beide Spiele zum Ausprobieren (nichts wird gespeichert)
        for (const [k, g] of Object.entries(GAMES)) {
          h += `<div class="card"><h2>${g.name}</h2><p>${g.info}</p><button class="playGame" data-g="${k}">Ausprobieren</button></div>`;
        }
      } else if (ph === 'setup') {
        h += `<div class="card"><h2>Minispiel: ${G.name}</h2><p>Das Minispiel wird freigeschaltet, sobald es losgeht.</p></div>`;
      } else if (ph === 'minigame' && !G.played(s.me)) {
        h += `<div class="card"><h2>Minispiel: ${G.name}</h2><p>${G.info}</p>
          <p>Erst kommt ein kurzes Tutorial mit Übungsrunde, danach hast du <strong>einen</strong> echten Versuch.</p>
          <button class="playGame" data-g="${gk}">Minispiel starten</button></div>`;
      } else if (G.played(s.me)) {
        h += `<div class="card"><h2>Dein Ergebnis (${G.name}): ${G.label(s.me)}</h2>
          <p>${ph === 'minigame' ? 'Warte, bis alle gespielt haben.' : 'Das Minispiel ist vorbei.'}</p>
          ${G.canWatch(s.me) ? '<button class="secondary" id="watchMe">▶ Meinen Versuch ansehen</button>' : ''}</div>`;
      } else {
        h += `<div class="card"><p>Das Minispiel ist vorbei.</p></div>`;
      }
      document.getElementById('panelBody').innerHTML = h;
      document.querySelectorAll('.playGame').forEach(btn => btn.addEventListener('click', () =>
        GAMES[btn.dataset.g].play(!!DEMO, () => {})));
      document.getElementById('watchMe')?.addEventListener('click', () => G.watch(s.me));
    }

    // ---------- Leaderboard: aktives Spiel oben, das andere darunter ----------
    function boardSection(gk) {
      const s = S, G = GAMES[gk], active = gk === activeGame();
      const done = s.people.filter(G.played).sort(compareRank(gk));
      const waiting = s.people.filter(p => !G.played(p));
      if (!active && !done.length) return '';
      const F = foundersPlanned(s);
      const medals = ['🥇', '🥈', '🥉'];
      let h = `<h2 style="margin-top:4px">🏆 ${G.name}${active ? ` <span style="font-size:.75rem;color:#16a34a">die besten ${F} wählen</span>` : ''}</h2>`;
      if (!done.length) h += '<div class="card"><p>Noch hat niemand gespielt.</p></div>';
      done.forEach((p, i) => {
        const t = teamOf(s, p);
        const chooses = active && i < F && s.state.phase === 'minigame';
        h += `<div class="card" style="display:flex;align-items:center;gap:12px${chooses ? ';border:2px solid #facc15' : ''}">
          <div style="font-size:1.6rem;width:36px;text-align:center">${medals[i] ?? (i + 1) + '.'}</div>
          <div style="flex:1"><strong>${escapeHtml(p.name)}</strong>${p.token === token ? ' (du)' : ''}<br>
            <span style="color:#555;font-size:.9rem">${escapeHtml(G.label(p))}${t ? ` · ${dot(t.css)}${escapeHtml(t.name)}` : chooses ? ' · ★ darf wählen' : ''}</span></div>
          ${G.canWatch(p) ? `<button class="watch" data-g="${gk}" data-token="${p.token}">▶ Ansehen</button>` : ''}
        </div>`;
      });
      if (waiting.length && active) h += `<p style="color:#555">Noch nicht gespielt: ${waiting.map(p => escapeHtml(p.name)).join(', ')}</p>`;
      return h;
    }
    function renderBoardTab() {
      const order = [activeGame(), ...Object.keys(GAMES).filter(k => k !== activeGame())];
      document.getElementById('panelBody').innerHTML = order.map(boardSection).join('');
      document.querySelectorAll('.watch').forEach(btn => btn.addEventListener('click', () => {
        const p = S.people.find(x => x.token === btn.dataset.token);
        if (p) GAMES[btn.dataset.g].watch(p);
      }));
    }

    // ---------- Demo-Modus ----------
    // index.html?demo       : alle angelegten Personen mit Gesicht sitzen schon, "Du" läuft mit face1 ein
    // index.html?demo=wahl  : Teamwahl ausprobieren, du wählst nacheinander für alle Gründer
    // Es wird nur gelesen, nichts gespeichert.
    async function demoStart() {
      let ps = [], benchSeats;
      try {
        (await getDocs(collection(db, 'participants'))).forEach(d => ps.push({ token: d.id, ...d.data() }));
        benchSeats = (await getDoc(doc(db, 'state', 'current'))).data()?.benchSeats;
      } catch (e) { ps = []; }
      const t0 = Date.now() - 600000;
      const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'de');
      let people = ps.filter(p => isPerson(p) && p.photoUrl)
        .sort((a, b) => (a.arrivedAt ?? 9e15) - (b.arrivedAt ?? 9e15) || byName(a, b))
        .map((p, i) => ({ ...p, teamId: null, pickedAt: null, arrivedAt: t0 + i * 1000 }));
      if (DEMO === 'pick' && people.length < 3) people = demoSample(t0);
      const me = { token: 'demo-me', name: 'Du', role: 'player', teamId: null, hair: 'kurz', photoUrl: 'faces/face1.png',
        arrivedAt: DEMO === 'enter' ? Date.now() : t0 + 99000 };
      people.push(me);
      token = me.token;
      if (DEMO === 'enter') return onData({ me, state: { phase: 'setup', benchSeats }, teams: {}, people });

      // Teamwahl: erfundene Snake-Ergebnisse, die besten gründen Teams
      people.forEach((p, i) => { p.minigamePlayed = true; p.minigameScore = Math.max(1, 30 - i * 2 - (i % 3)); p.minigameAt = t0 + i; });
      const order = people.slice().sort(compareRank('snake'));
      const F = Math.max(1, Math.min(DEFAULT_FOUNDERS, Math.floor(people.length / 2)));
      const teams = {};
      const pickOrder = order.slice(0, F).map((f, i) => {
        const id = 'demo-t' + i;
        teams[id] = { id, name: 'Team ' + f.name, captainToken: f.token, order: i };
        f.teamId = id; f.pickedAt = t0 + i;
        return id;
      });
      onData({ me, state: { phase: 'draft', pickOrder, turnIndex: 0, benchSeats }, teams, people });
    }
    function demoSample(t0) {
      const names = ['Anna', 'Ben', 'Clara', 'David', 'Emil', 'Fiona', 'Greta', 'Hannes', 'Ida', 'Jonas', 'Klara', 'Leon', 'Mia', 'Noah'];
      const longHair = new Set(['Anna', 'Clara', 'Fiona', 'Greta', 'Ida', 'Klara', 'Mia']);
      return names.map((n, i) => ({ token: 'demo-p-' + i, name: n, role: 'player', teamId: null, hair: longHair.has(n) ? 'lang' : 'kurz',
        photoUrl: i % 4 === 1 ? 'faces/face' + (1 + (i % 2)) + '.png' : null, arrivedAt: t0 + i * 1000 }));
    }
    function demoChatter() {
      const lines = ['Hallo zusammen! 👋', 'Wer hat die Musik mitgebracht? 🎶', 'Ich will in dein Team!',
        'Kalt hier draußen 🥶', 'Hat jemand den Springer gesehen?? 😮', 'Wann geht es los?', 'Wir gewinnen eh 💪',
        'Schöner Schneemann ⛄', 'Bitte wählt mich 🙏', 'Biathlon kann ich auch!'];
      let k = 0;
      setInterval(() => {
        if (!S) return;
        const pool = S.people.filter(p => p.token !== token && p.arrivedAt);
        const p = pool[Math.floor(Math.random() * pool.length)];
        if (!p) return;
        messages.unshift({ id: 'd' + Date.now(), token: p.token, name: p.name, text: lines[k++ % lines.length], at: Date.now() });
        onMessages(1);
      }, 3500);
    }
    function demoPick(player) {
      const teamId = turnTeamId(S);
      let people = S.people.map(p => p.token === player.token ? { ...p, teamId, pickedAt: Date.now() } : p);
      const state = { ...S.state }, teams = { ...S.teams };
      if (state.turnIndex + 1 < state.pickOrder.length) state.turnIndex++;
      else {
        const { newTeams, extra } = planPairs(people.filter(p => !p.teamId), Object.keys(teams).length);
        const now = Date.now();
        newTeams.forEach((t, k) => {
          const id = 'demo-r' + k;
          teams[id] = { id, name: t.name, captainToken: null, order: t.order, random: true };
          const set = new Set(t.members.map(m => m.token));
          people = people.map(p => set.has(p.token) ? { ...p, teamId: id, pickedAt: now + k * 10 + t.members.findIndex(m => m.token === p.token) } : p);
        });
        if (extra) people = people.map(p => p.token === extra.token ? { ...p, teamId: state.pickOrder[0], pickedAt: now + 9999 } : p);
        state.phase = 'done';
      }
      onData({ ...S, me: people.find(p => p.token === token), people, state, teams });
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    document.getElementById('panelClose').onclick = () => { tab = 'hall'; renderTabbar(); renderTab(); };
    wireChat();
    // Android: beim ersten Antippen echten Vollbildmodus anfordern (iPhone erlaubt das nur für Videos)
    document.addEventListener('pointerdown', () => {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen && matchMedia('(pointer: coarse)').matches) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    }, { once: true });
    if (DEMO) { demoStart(); demoChatter(); }
    else if (!token) root.innerHTML = '<div class="card"><p>Kein gültiger Link. Bitte den persönlichen Link bzw. QR-Code benutzen.</p></div>';
    else subscribe();
  </script>
</body>
</html>
