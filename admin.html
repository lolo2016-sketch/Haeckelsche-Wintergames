<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Team-Draft</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Admin-Steuerung</h1>
  <div id="app">Lade…</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
      collection, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { playSnake, playReplay } from "./minigame.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const root = document.getElementById('app');

    // Basis-URLs automatisch ermitteln
    const baseUrl = location.href.replace(/admin\.html.*$/, 'index.html');
    const adminUrl = location.href.replace(/admin\.html.*$/, 'admin.html');
    const introUrl = location.href.replace(/admin\.html.*$/, 'intro.html');

    let lastTest = null; // letzter Testversuch (nur im Browser, wird nicht gespeichert)
    let lastAdded = null; // zuletzt angelegte Person -> QR-Code oben anzeigen

    // ----- Dateien aus dem GitHub-Repo (für die Auswahllisten Bild/Video) -----
    const GH_OWNER = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : 'lolo2016-sketch';
    const GH_REPO = location.hostname.endsWith('.github.io') ? (location.pathname.split('/')[1] || 'Haeckelsche-Wintergames') : 'Haeckelsche-Wintergames';
    let repoFiles = { photos: [], videos: [], loaded: false, error: null };
    async function loadRepoFiles() {
      const list = async dir => {
        const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${dir}`);
        if (r.status === 404) return [];
        if (!r.ok) throw new Error('GitHub antwortet mit ' + r.status);
        return (await r.json()).filter(f => f.type === 'file').map(f => f.path);
      };
      try {
        const [photos, faces, videos] = await Promise.all([list('photos'), list('faces'), list('videos')]);
        repoFiles = {
          photos: [...photos, ...faces].filter(f => /\.(png|jpe?g|webp|gif)$/i.test(f)),
          videos: videos.filter(f => /\.(mp4|webm|mov|m4v)$/i.test(f)), loaded: true, error: null
        };
      } catch (e) { repoFiles = { photos: [], videos: [], loaded: true, error: e.message }; }
    }
    function fileOptions() {
      return `<datalist id="photoFiles">${repoFiles.photos.map(f => `<option value="${f}">`).join('')}</datalist>
        <datalist id="videoFiles">${repoFiles.videos.map(f => `<option value="${f}">`).join('')}</datalist>`;
    }
    function filesHint() {
      if (!repoFiles.loaded) return 'Lade Dateiliste aus dem Repo …';
      if (repoFiles.error) return '⚠️ Dateiliste nicht abrufbar (' + repoFiles.error + '), Pfad bitte von Hand eintippen.';
      return `Im Repo gefunden: ${repoFiles.photos.length} Bilder (photos/, faces/), ${repoFiles.videos.length} Videos (videos/). <a href="#" id="reloadFiles">↻ neu laden</a>`;
    }
    // Eingabefelder Bild / Video / Frisur (beim Anlegen und bei bestehenden Personen)
    function mediaInputs(prefix, x = {}) {
      return `<input class="${prefix}photo" list="photoFiles" placeholder="Bild für die Figur, z. B. photos/max.png" value="${x.photoUrl ?? ''}" style="width:240px">
        <input class="${prefix}video" list="videoFiles" placeholder="Intro-Video, z. B. videos/max.mp4" value="${x.videoUrl ?? ''}" style="width:240px">
        <select class="${prefix}hair" title="Frisur der 3D-Figur (für die Rückansicht)">
          <option value="kurz" ${x.hair !== 'lang' ? 'selected' : ''}>Haare kurz</option>
          <option value="lang" ${x.hair === 'lang' ? 'selected' : ''}>Haare lang</option>
        </select>`;
    }

    // Felder für Foto und Video einer Person (Pfade im Repo, z. B. photos/max.png, videos/max.mp4)
    function mediaFields(x) {
      return `<div style="margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        ${x.photoUrl ? `<img src="${x.photoUrl}" alt="" style="height:54px" onerror="this.replaceWith('⚠️ Foto nicht gefunden')">` : ''}
        <input class="photoIn" list="photoFiles" data-token="${x.token}" placeholder="photos/name.png" value="${x.photoUrl ?? ''}" style="width:170px">
        <input class="videoIn" list="videoFiles" data-token="${x.token}" placeholder="videos/name.mp4" value="${x.videoUrl ?? ''}" style="width:170px">
        <select class="hairIn" data-token="${x.token}" title="Frisur der 3D-Figur">
          <option value="kurz" ${x.hair !== 'lang' ? 'selected' : ''}>Haare kurz</option>
          <option value="lang" ${x.hair === 'lang' ? 'selected' : ''}>Haare lang</option>
        </select>
        ${x.arrivedAt ? '<span title="hat den Link schon geöffnet">✅ in der Halle</span>' : '<span style="color:#888">noch nicht da</span>'}
        <button class="secondary saveMedia" data-token="${x.token}">Speichern</button>
      </div>`;
    }

    function genToken() {
      return Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
    }

    async function loadAll() {
      const stateSnap = await getDoc(doc(db, 'state', 'current'));
      const state = stateSnap.exists() ? stateSnap.data() : { phase: 'setup' };

      const teamsSnap = await getDocs(collection(db, 'teams'));
      const teams = {};
      teamsSnap.forEach(d => teams[d.id] = { id: d.id, ...d.data() });

      const partsSnap = await getDocs(collection(db, 'participants'));
      const participants = [];
      partsSnap.forEach(d => participants.push({ token: d.id, ...d.data() }));

      render(state, teams, participants);
      // Dateiliste einmal im Hintergrund holen und nur Listen/Hinweise auffrischen (Eingaben bleiben erhalten)
      if (!repoFiles.loaded && !repoFiles.loading) {
        repoFiles.loading = true;
        loadRepoFiles().then(refreshFileUi);
      }
    }
    function refreshFileUi() {
      const tmp = document.createElement('div'); tmp.innerHTML = fileOptions();
      for (const dl of tmp.querySelectorAll('datalist')) document.getElementById(dl.id)?.replaceWith(dl);
      document.querySelectorAll('.filesHint').forEach(h => { h.innerHTML = filesHint(); });
      document.getElementById('reloadFiles')?.addEventListener('click', async e => {
        e.preventDefault(); repoFiles.loaded = false; refreshFileUi(); await loadRepoFiles(); refreshFileUi();
      });
    }

    function qrImg(url, size = 140) {
      return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(url)}" width="${size}" height="${size}">`;
    }

    function render(state, teams, participants) {
      const captains = participants.filter(p => p.role === 'captain');
      const players = participants.filter(p => p.role === 'player');
      const admins = participants.filter(p => p.role === 'admin');

      let html = `<div class="card"><h2>Phase: ${state.phase}</h2>
        <button id="toMinigame" ${state.phase !== 'setup' ? 'disabled' : ''}>Minispiel-Phase starten</button>
        <button id="toDraft" ${state.phase !== 'minigame' ? 'disabled' : ''}>Draft starten (Reihenfolge nach Score)</button>
        <button class="danger" id="resetAll">Alles zurücksetzen</button>
        <div style="margin-top:10px">
          <label>Plätze auf der Bank: <input id="benchSeats" type="number" min="4" max="40" value="${state.benchSeats ?? 15}" style="width:70px"></label>
          <button class="secondary" id="saveSeats">Speichern</button>
          <span style="color:#666;font-size:.85rem">Am besten = Anzahl Spieler (ohne Kapitäne). Vor dem Event festlegen.</span>
        </div>
        <div style="margin-top:10px">
          <span>🏟️ In der Halle: ${participants.filter(p => p.role !== 'admin' && p.arrivedAt).length} von ${participants.filter(p => p.role !== 'admin').length}</span>
          <button class="secondary" id="resetArrivals">Halle leeren (alle wieder „noch nicht da“)</button>
          <span style="color:#666;font-size:.85rem">Nach dem Testen und vor dem Event drücken.</span>
        </div>
        <div style="margin-top:10px">
          <span>💬 Chat: <span id="chatCount">…</span> Nachrichten</span>
          <button class="danger" id="clearChat">Chat leeren</button>
        </div>
      </div>`;

      html += `<div class="card">
        <h2>🎮 Minispiele testen</h2>
        <p style="font-size:0.9rem;color:#555">Zum Ausprobieren. Es wird nichts gespeichert und die Phase bleibt unverändert.</p>
        <button id="testSnake">Snake ausprobieren</button>
        <a href="${baseUrl}?demo" target="_blank"><button class="secondary" type="button">🏟️ Demo: als Spieler einlaufen</button></a>
        <a href="${baseUrl}?demo=kapitaen" target="_blank"><button class="secondary" type="button">🏟️ Demo: als Kapitän wählen</button></a>
        <button class="secondary" id="testReplay" ${lastTest ? '' : 'disabled'}>Letzten Test als Wiedergabe ansehen</button>
      </div>`;

      html += fileOptions();

      // zuletzt angelegte Person: QR-Code und Link gleich oben
      const fresh = lastAdded && participants.find(p => p.token === lastAdded);
      if (fresh) {
        const link = `${introUrl}?t=${fresh.token}`;
        html += `<div class="card" id="freshCard" style="border:3px solid #16a34a">
          <h2>✅ Angelegt: ${fresh.name} (${fresh.role === 'captain' ? 'Kapitän' : 'Spieler'})</h2>
          <p style="margin:4px 0">Bild: ${fresh.photoUrl || '–'} · Intro-Video: ${fresh.videoUrl || '– (geht direkt in die Halle)'}</p>
          ${qrImg(link, 220)}
          <a href="${link}" target="_blank">${link}</a><br>
          <button class="secondary" id="copyFresh">Link kopieren</button>
          <a href="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(link)}" target="_blank" download="qr-${fresh.name}.png"><button class="secondary" type="button">QR-Code groß öffnen</button></a>
        </div>`;
      }

      html += `<div class="card">
        <h2>Kapitän hinzufügen</h2>
        <input id="captainName" placeholder="Name des Kapitäns">
        <input id="teamName" placeholder="Teamname">
        <div>${mediaInputs('newCap-')}</div>
        <p class="filesHint" style="font-size:.85rem;color:#666;margin:4px 0">${filesHint()}</p>
        <button id="addCaptain">Hinzufügen</button>
      </div>`;

      html += `<div class="card">
        <h2>Spieler hinzufügen</h2>
        <input id="playerName" placeholder="Name des Spielers">
        <div>${mediaInputs('newPl-')}</div>
        <p class="filesHint" style="font-size:.85rem;color:#666;margin:4px 0">${filesHint()}</p>
        <button id="addPlayer">Hinzufügen</button>
      </div>`;

      html += `<div class="card">
        <h2>Weiteren Admin mit Video-Intro hinzufügen</h2>
        <p style="font-size:0.9rem;color:#555">
          Video-Datei vorher in den Ordner <code>videos/</code> im Repo hochladen, dann hier
          nur den relativen Pfad eintragen, z. B. <code>videos/admin2-intro.mp4</code>.
        </p>
        <input id="adminName" placeholder="Name">
        <input id="adminVideo" placeholder="videos/admin2-intro.mp4" style="width:260px">
        <button id="addAdmin">Hinzufügen</button>
      </div>`;

      html += `<h2>Admins mit Video-Intro (${admins.length})</h2>`;
      admins.forEach(a => {
        const introLink = `${introUrl}?t=${a.token}`;
        html += `<div class="card token-list">
          <strong>${a.name}</strong> (Admin)
          <br>Video: ${a.videoUrl}
          <br>QR-Link (spielt Video, dann Admin-Seite): <a href="${introLink}" target="_blank">${introLink}</a>
          ${qrImg(introLink)}
          <button class="danger remove" data-token="${a.token}">Entfernen</button>
        </div>`;
      });

      html += `<h2>Kapitäne (${captains.length})</h2>`;
      captains.forEach(c => {
        const link = `${introUrl}?t=${c.token}`;
        html += `<div class="card token-list">
          <strong>${c.name}</strong> — Team: ${teams[Object.keys(teams).find(id => teams[id].captainToken === c.token)]?.name ?? '?'}
          ${c.minigamePlayed ? `<br>Snake-Score: ${c.minigameScore} 🍎 <button class="secondary resetTry" data-token="${c.token}">Versuch zurücksetzen</button>` : '<br>Hat noch nicht gespielt'}
          <br><a href="${link}" target="_blank">${link}</a>
          ${mediaFields(c)}
          ${qrImg(link)}
          <button class="danger remove" data-token="${c.token}">Entfernen</button>
        </div>`;
      });

      html += `<h2>Spieler (${players.length})</h2>`;
      players.forEach(p => {
        const link = `${introUrl}?t=${p.token}`;
        html += `<div class="card token-list">
          <strong>${p.name}</strong> ${p.teamId ? `— im Team: ${teams[p.teamId]?.name ?? '?'}` : '— auf der Bank'}
          <br><a href="${link}" target="_blank">${link}</a>
          ${mediaFields(p)}
          ${qrImg(link)}
          <button class="danger remove" data-token="${p.token}">Entfernen</button>
        </div>`;
      });

      root.innerHTML = html;

      function newMedia(prefix) {
        const v = c => document.querySelector('.' + prefix + c)?.value.trim() || null;
        return { photoUrl: v('photo'), videoUrl: v('video'), hair: v('hair') || 'kurz' };
      }
      document.getElementById('copyFresh')?.addEventListener('click', e => {
        const link = `${introUrl}?t=${lastAdded}`;
        navigator.clipboard?.writeText(link).then(() => { e.target.textContent = 'Kopiert ✓'; }).catch(() => prompt('Link:', link));
      });
      if (repoFiles.loaded) refreshFileUi();
      document.getElementById('resetArrivals')?.addEventListener('click', async () => {
        if (!confirm('Alle Spieler und Kapitäne wieder auf "noch nicht da" setzen? Die Halle ist danach leer und jeder läuft beim nächsten Öffnen neu ein.')) return;
        for (const p of participants.filter(x => x.role !== 'admin' && x.arrivedAt)) await updateDoc(doc(db, 'participants', p.token), { arrivedAt: null });
        loadAll();
      });

      document.querySelectorAll('.saveMedia').forEach(btn => {
        btn.addEventListener('click', async () => {
          const t = btn.dataset.token;
          const photoUrl = document.querySelector(`.photoIn[data-token="${t}"]`).value.trim() || null;
          const videoUrl = document.querySelector(`.videoIn[data-token="${t}"]`).value.trim() || null;
          const hair = document.querySelector(`.hairIn[data-token="${t}"]`).value;
          await updateDoc(doc(db, 'participants', t), { photoUrl, videoUrl, hair });
          loadAll();
        });
      });

      document.getElementById('testSnake').addEventListener('click', () => {
        playSnake({
          testMode: true,
          onFinish: r => { lastTest = r; },
          onClose: () => render(state, teams, participants)
        });
      });
      document.getElementById('testReplay').addEventListener('click', () => {
        if (lastTest) playReplay({ name: 'Testversuch', score: lastTest.score, replay: lastTest.replay });
      });

      document.getElementById('addCaptain').addEventListener('click', async () => {
        const name = document.getElementById('captainName').value.trim();
        const teamName = document.getElementById('teamName').value.trim();
        if (!name || !teamName) return;
        const token = genToken();
        const teamId = 'team_' + genToken();
        await setDoc(doc(db, 'teams', teamId), { name: teamName, captainToken: token });
        await setDoc(doc(db, 'participants', token), { name, role: 'captain', teamId: null, minigameScore: null, ...newMedia('newCap-') });
        lastAdded = token;
        await loadAll();
        document.getElementById('freshCard')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      document.getElementById('addPlayer').addEventListener('click', async () => {
        const name = document.getElementById('playerName').value.trim();
        if (!name) return;
        const token = genToken();
        await setDoc(doc(db, 'participants', token), { name, role: 'player', teamId: null, ...newMedia('newPl-') });
        lastAdded = token;
        await loadAll();
        document.getElementById('freshCard')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      document.getElementById('addAdmin').addEventListener('click', async () => {
        const name = document.getElementById('adminName').value.trim();
        const videoUrl = document.getElementById('adminVideo').value.trim();
        if (!name || !videoUrl) return;
        const token = genToken();
        await setDoc(doc(db, 'participants', token), {
          name, role: 'admin', videoUrl, redirectTo: 'admin.html'
        });
        loadAll();
      });

      document.querySelectorAll('.resetTry').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Versuch dieses Kapitäns löschen? Er/sie darf dann nochmal spielen.')) return;
          await updateDoc(doc(db, 'participants', btn.dataset.token),
            { minigamePlayed: false, minigameScore: null, snakeReplay: null });
          loadAll();
        });
      });

      document.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', async () => {
          await deleteDoc(doc(db, 'participants', btn.dataset.token));
          loadAll();
        });
      });

      document.getElementById('toMinigame').addEventListener('click', async () => {
        await setDoc(doc(db, 'state', 'current'), { phase: 'minigame', benchSeats: state.benchSeats ?? 15 });
        loadAll();
      });

      document.getElementById('toDraft').addEventListener('click', async () => {
        const ranked = captains
          .slice()
          .sort((a, b) => (b.minigameScore ?? -Infinity) - (a.minigameScore ?? -Infinity));
        const pickOrder = ranked.map(c => Object.keys(teams).find(id => teams[id].captainToken === c.token));
        await setDoc(doc(db, 'state', 'current'), { phase: 'draft', pickOrder, turnIndex: 0, benchSeats: state.benchSeats ?? 15 });
        loadAll();
      });

      document.getElementById('saveSeats').addEventListener('click', async () => {
        const n = Math.max(4, Math.min(40, Number(document.getElementById('benchSeats').value) || 15));
        await setDoc(doc(db, 'state', 'current'), { ...state, benchSeats: n });
        loadAll();
      });
      getDocs(collection(db, 'chat')).then(snap => {
        const el = document.getElementById('chatCount'); if (el) el.textContent = snap.size;
      }).catch(() => {});
      document.getElementById('clearChat').addEventListener('click', async () => {
        if (!confirm('Alle Chat-Nachrichten löschen?')) return;
        const snap = await getDocs(collection(db, 'chat'));
        for (const d of snap.docs) await deleteDoc(d.ref);
        loadAll();
      });

      document.getElementById('resetAll').addEventListener('click', async () => {
        if (!confirm('Wirklich ALLE Teilnehmer, Teams und den Status löschen?')) return;
        for (const p of participants) await deleteDoc(doc(db, 'participants', p.token));
        for (const t of Object.values(teams)) await deleteDoc(doc(db, 'teams', t.id));
        await setDoc(doc(db, 'state', 'current'), { phase: 'setup', benchSeats: state.benchSeats ?? 15 });
        for (const d of (await getDocs(collection(db, 'chat'))).docs) await deleteDoc(d.ref);
        loadAll();
      });
    }

    // ===== Zugangsschutz =====
    // Prüfsumme von "haeckelsche:" + Passwort (klein geschrieben). Das Passwort selbst steht nirgends im Code.
    const PW_HASH = 'da5ec80671995a0d15f75891fcef4c8c90c3665d0c48269a108659917660d18d';
    const OK_KEY = 'haeckelsche-admin-ok';

    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function remember() { try { localStorage.setItem(OK_KEY, PW_HASH); } catch (e) {} }
    function remembered() { try { return localStorage.getItem(OK_KEY) === PW_HASH; } catch (e) { return false; } }

    async function gate() {
      if (remembered()) return loadAll();

      // Über den QR-Code eines Admins (intro.html → admin.html?t=…): kein Passwort nötig
      const t = new URLSearchParams(location.search).get('t');
      if (t) {
        const snap = await getDoc(doc(db, 'participants', t));
        if (snap.exists() && snap.data().role === 'admin') {
          remember();
          history.replaceState(null, '', location.pathname); // Token aus der Adresszeile entfernen
          return loadAll();
        }
      }

      root.innerHTML = `<div class="card" style="max-width:360px">
        <h2>🔒 Admin-Bereich</h2>
        <p>Bitte Passwort eingeben.</p>
        <form id="pwForm">
          <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" style="width:100%">
          <button type="submit" style="margin-top:8px">Öffnen</button>
          <p id="pwErr" style="color:#b91c1c;display:none">Falsches Passwort.</p>
        </form></div>`;
      document.getElementById('pw').focus();
      document.getElementById('pwForm').addEventListener('submit', async e => {
        e.preventDefault();
        const val = document.getElementById('pw').value.trim().toLowerCase();
        if (await sha256('haeckelsche:' + val) === PW_HASH) { remember(); loadAll(); }
        else document.getElementById('pwErr').style.display = 'block';
      });
    }

    gate();
  </script>
</body>
</html>
