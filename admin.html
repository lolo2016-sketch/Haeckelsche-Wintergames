<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Haeckelsche Wintergames</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Admin-Steuerung</h1>
  <div id="app">Lade…</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
      collection, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";
    import { playSnake, playReplay } from "./minigame.js?v=20261019e";
    import { playBiathlon, playBiathlonReplay, formatBiathlon } from "./biathlon.js?v=20261019e";
    import { PHASES, PHASE_NAMES, phaseIndex, settings, DEFAULTS, COUNTRIES, country, isPerson, teamColor, snakeRanking,
      guessedRight, teamBonus, teamBiathlon, revealTeams, FINAL_TEAMS, finalMembers, finalBonus, finalScoreMs, fmtClock, WEAPONS, weaponName } from "./draft.js?v=20261019e";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const root = document.getElementById('app');

    // Basis-URLs automatisch ermitteln
    const baseUrl = location.href.replace(/admin\.html.*$/, 'index.html');
    const adminUrl = location.href.replace(/admin\.html.*$/, 'admin.html');
    const introUrl = location.href.replace(/admin\.html.*$/, 'intro.html');

    let lastTest = null; // letzter Snake-Testversuch (nur im Browser, wird nicht gespeichert)
    let lastBiathlon = null; // letzter Biathlon-Testlauf
    const GAME_NAMES = { snake: 'Winter-Snake 🎅', biathlon: 'Biathlon-Sprint ⛷️' };
    let lastAdded = null; // zuletzt angelegte Person -> QR-Code oben anzeigen

    // ----- Dateien aus dem GitHub-Repo (für die Auswahllisten Bild/Video) -----
    const GH_OWNER = location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : 'lolo2016-sketch';
    const GH_REPO = location.hostname.endsWith('.github.io') ? (location.pathname.split('/')[1] || 'Haeckelsche-Wintergames') : 'Haeckelsche-Wintergames';
    let repoFiles = { photos: [], videos: [], loaded: false, error: null };
    async function loadRepoFiles() {
      const list = async dir => {
        const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${dir}`);
        if (r.status === 404) return [];
        if (!r.ok) throw new Error('GitHub antwortet mit ' + r.status);
        return (await r.json()).filter(f => f.type === 'file').map(f => f.path);
      };
      try {
        const [photos, faces, videos, agents] = await Promise.all([list('photos'), list('faces'), list('videos'), list('agents')]);
        repoFiles = {
          agents: agents.filter(f => /\.(png|webp)$/i.test(f)),
          photos: [...photos, ...faces].filter(f => /\.(png|jpe?g|webp|gif)$/i.test(f)),
          videos: videos.filter(f => /\.(mp4|webm|mov|m4v)$/i.test(f)), loaded: true, error: null
        };
      } catch (e) { repoFiles = { photos: [], videos: [], loaded: true, error: e.message }; }
    }
    function fileOptions() {
      return `<datalist id="photoFiles">${repoFiles.photos.map(f => `<option value="${f}">`).join('')}</datalist>
        <datalist id="videoFiles">${repoFiles.videos.map(f => `<option value="${f}">`).join('')}</datalist>
        <datalist id="agentFiles">${(repoFiles.agents || []).map(f => `<option value="${f}">`).join('')}</datalist>`;
    }
    function filesHint() {
      if (!repoFiles.loaded) return 'Lade Dateiliste aus dem Repo …';
      if (repoFiles.error) return '⚠️ Dateiliste nicht abrufbar (' + repoFiles.error + '), Pfad bitte von Hand eintippen.';
      return `Im Repo gefunden: ${repoFiles.photos.length} Bilder (photos/, faces/), ${repoFiles.videos.length} Videos (videos/). <a href="#" id="reloadFiles">↻ neu laden</a>`;
    }
    // Eingabefelder Bild / Video / Frisur (beim Anlegen und bei bestehenden Personen)
    function mediaInputs(prefix, x = {}) {
      return `<input class="${prefix}photo" list="photoFiles" placeholder="Bild für die Figur, z. B. photos/max.png" value="${x.photoUrl ?? ''}" style="width:240px">
        <input class="${prefix}video" list="videoFiles" placeholder="Intro-Video, z. B. videos/max.mp4" value="${x.videoUrl ?? ''}" style="width:240px">
        <select class="${prefix}hair" title="Frisur der 3D-Figur (für die Rückansicht)">
          <option value="kurz" ${x.hair !== 'lang' ? 'selected' : ''}>Haare kurz</option>
          <option value="lang" ${x.hair === 'lang' ? 'selected' : ''}>Haare lang</option>
        </select>`;
    }

    // Felder für Foto und Video einer Person (Pfade im Repo, z. B. photos/max.png, videos/max.mp4)
    // Der Name lässt sich jederzeit ändern; der QR-Code bleibt gleich
    function mediaFields(x) {
      const esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
      return `<div style="margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input class="nameIn" data-token="${x.token}" placeholder="Name" value="${esc(x.name)}" style="width:150px" title="Name">
        ${x.photoUrl ? `<img src="${x.photoUrl}" alt="" style="height:54px" onerror="this.replaceWith('⚠️ Foto nicht gefunden')">` : ''}
        <input class="photoIn" list="photoFiles" data-token="${x.token}" placeholder="photos/name.png" value="${x.photoUrl ?? ''}" style="width:170px">
        <input class="videoIn" list="videoFiles" data-token="${x.token}" placeholder="videos/name.mp4" value="${x.videoUrl ?? ''}" style="width:170px">
        <input class="agentIn" list="agentFiles" data-token="${x.token}" placeholder="Agentenbild (Standard agents/agent1.png)" value="${x.agentUrl ?? ''}" style="width:200px" title="Bild im Agentenmodus">
        ${x.agent ? '<span title="ist gerade im Agentenmodus">🕶️</span>' : ''}
        <select class="hairIn" data-token="${x.token}" title="Frisur der 3D-Figur">
          <option value="kurz" ${x.hair !== 'lang' ? 'selected' : ''}>Haare kurz</option>
          <option value="lang" ${x.hair === 'lang' ? 'selected' : ''}>Haare lang</option>
        </select>
        ${x.arrivedAt ? '<span title="hat den Link schon geöffnet">✅ in der Halle</span>' : '<span style="color:#888">noch nicht da</span>'}
        <button class="secondary saveMedia" data-token="${x.token}">Speichern</button>
      </div>`;
    }

    function genToken() {
      return Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
    }

    let finals = {};   // Spielstand des Finales pro Team
    async function loadAll() {
      const stateSnap = await getDoc(doc(db, 'state', 'current'));
      const state = stateSnap.exists() ? stateSnap.data() : { phase: 'setup' };

      const teamsSnap = await getDocs(collection(db, 'teams'));
      const teams = {};
      teamsSnap.forEach(d => teams[d.id] = { id: d.id, ...d.data() });

      const partsSnap = await getDocs(collection(db, 'participants'));
      const participants = [];
      partsSnap.forEach(d => participants.push({ token: d.id, ...d.data() }));

      finals = {};
      try { (await getDocs(collection(db, 'finals'))).forEach(d => { finals[d.id] = { id: d.id, ...d.data() }; }); } catch (e) {}
      render(state, teams, participants);
      // Dateiliste einmal im Hintergrund holen und nur Listen/Hinweise auffrischen (Eingaben bleiben erhalten)
      if (!repoFiles.loaded && !repoFiles.loading) {
        repoFiles.loading = true;
        loadRepoFiles().then(refreshFileUi);
      }
    }
    function refreshFileUi() {
      const tmp = document.createElement('div'); tmp.innerHTML = fileOptions();
      for (const dl of tmp.querySelectorAll('datalist')) document.getElementById(dl.id)?.replaceWith(dl);
      document.querySelectorAll('.filesHint').forEach(h => { h.innerHTML = filesHint(); });
      document.getElementById('reloadFiles')?.addEventListener('click', async e => {
        e.preventDefault(); repoFiles.loaded = false; refreshFileUi(); await loadRepoFiles(); refreshFileUi();
      });
    }

    function qrImg(url, size = 140) {
      return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(url)}" width="${size}" height="${size}">`;
    }

    function render(state, teams, participants) {
      // Alle außer Admins sind Teilnehmer (frühere Rollen Kapitän/Spieler werden nicht mehr unterschieden)
      const people = participants.filter(isPerson);
      const admins = participants.filter(p => p.role === 'admin');
      const st = settings(state);
      const PI = phaseIndex(state.phase);
      const byName = (a, b) => String(a.name).localeCompare(String(b.name), 'de');
      const nameOf = tok => people.find(p => p.token === tok)?.name ?? '?';
      const step = (i, id, label, extra = '') => `<button id="${id}" ${PI === i ? '' : 'disabled class="secondary"'} ${extra}>${label}</button>`;

      let html = `<div class="card"><h2>Phase: ${PHASE_NAMES[PHASES[PI]] ?? state.phase}</h2>
        <p style="margin:2px 0 8px;color:#555;font-size:.9rem">Immer der nächste Schritt ist anklickbar.</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${step(0, 'toSnake', '1 ▶ Runde 1: Snake starten')}
          ${step(1, 'toGuess', '2 Snake beenden → Raten starten')}
          ${step(2, 'toReveal', '3 Auflösen: Teams nach Flagge')}
          ${step(3, 'toBiathlon', '4 ▶ Runde 2: Biathlon starten')}
          ${step(4, 'toDone', '5 Biathlon beenden')}
          ${step(5, 'toFinal', '6 🏆 Finale freigeben (Tür öffnen)')}
        </div>
        <div style="margin-top:8px;font-size:.85rem;color:#555">Korrektur: Phase direkt setzen
          <select id="phaseSel">${PHASES.map((ph, i) => `<option value="${ph}" ${i === PI ? 'selected' : ''}>${PHASE_NAMES[ph]}</option>`).join('')}</select>
          <button class="secondary" id="setPhase">Setzen</button></div>
        <div style="margin-top:10px">
          <label>Bonus pro richtig geratener Person: <input id="guessBonus" type="number" min="0" max="60" value="${st.guessBonus}" style="width:60px"> s</label>
          <label style="margin-left:10px">Snake-Bonus Platz 1, 2, 3 …: <input id="snakeBonus" value="${st.snakeBonus.join(', ')}" style="width:90px"> s</label>
          <label style="margin-left:10px">Biathlon-Versuche pro Person: <input id="biathlonAttempts" type="number" min="1" max="10" value="${st.biathlonAttempts}" style="width:50px"></label>
          <button class="secondary" id="saveSettings">Speichern</button>
        </div>
        <div style="margin-top:10px">
          <label>Plätze auf der runden Bank: <input id="benchSeats" type="number" min="7" max="40" value="${state.benchSeats ?? 20}" style="width:70px"></label>
          <button class="secondary" id="saveSeats">Speichern</button>
          <span style="color:#666;font-size:.85rem">Am besten = Anzahl Personen. Kommen mehr, wird die Bank automatisch größer.</span>
        </div>
        <div style="margin-top:10px">
          <span>🏟️ In der Halle: ${people.filter(p => p.arrivedAt).length} von ${people.length}</span>
          <button class="secondary" id="resetArrivals">Halle leeren (alle wieder „noch nicht da“)</button>
          <span style="color:#666;font-size:.85rem">Leert die Halle und macht alle QR-Codes wieder „frisch“ (Einlauf + Intro-Video wie beim ersten Mal).</span>
        </div>
        <div style="margin-top:10px">
          <button class="danger" id="freshStart">🔄 Für das Event frisch machen</button>
          <span style="color:#666;font-size:.85rem">Wie „Halle leeren“ und zusätzlich: Ergebnisse, Tipps, Teams und Chat löschen, Phase zurück auf „Vorbereitung“.
          Personen, Namen, Bilder, Videos, Flaggen, Finale-Teams und QR-Codes bleiben.</span>
        </div>
        <div style="margin-top:10px">
          <span>💬 Chat: <span id="chatCount">…</span> Nachrichten</span>
          <button class="danger" id="clearChat">Chat leeren</button>
          <button class="danger" id="resetAll" style="margin-left:10px">Alles zurücksetzen</button>
        </div>
      </div>`;

      // ----- Nationalitäten (geheim) -----
      const counts = {};
      people.forEach(p => { counts[p.flag || ''] = (counts[p.flag || ''] || 0) + 1; });
      const flagSummary = Object.entries(counts).sort().map(([f, n]) => {
        const c = country(f);
        return `<span style="display:inline-block;margin:2px 8px 2px 0;${!f || n !== 2 ? 'color:#b91c1c;font-weight:600' : ''}">${c ? c.emoji + ' ' + c.name : '❓ ohne Flagge'}: ${n}</span>`;
      }).join('');
      html += `<div class="card"><h2>🏳️ Nationalitäten (geheim)</h2>
        <p style="font-size:.9rem;color:#555;margin:2px 0 6px">Jede Person sieht nur ihre eigene Flagge (auf Antippen). Personen mit gleicher Flagge werden bei der Auflösung ein Team.
        Rot = nicht genau 2 Personen.</p>
        <div style="margin-bottom:8px">${flagSummary || '–'}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px">
        ${people.slice().sort(byName).map(p => `<label style="display:flex;gap:6px;align-items:center">
          <span style="flex:1">${p.name}</span>
          <select class="flagSel" data-token="${p.token}"><option value="">– keine –</option>${COUNTRIES.map(([c, n, e]) => `<option value="${c}" ${p.flag === c ? 'selected' : ''}>${e} ${n}</option>`).join('')}</select>
        </label>`).join('')}</div>
        <button id="saveFlags" style="margin-top:8px">Flaggen speichern</button>
        <button class="secondary" id="randomFlags">Zufällig zuteilen (je 2)</button>
      </div>`;

      // ----- Tipps (nur für den Admin sichtbar, ob richtig) -----
      if (PI >= phaseIndex('guess')) {
        const guessed = people.filter(p => p.guess).length;
        html += `<div class="card"><h2>🤔 Tipps (${guessed} von ${people.length})</h2>
          ${people.slice().sort(byName).map(p => `<div>${p.name} → ${p.guess ? `${nameOf(p.guess)} ${guessedRight(p, people) ? '✅' : '❌'}` : '<span style="color:#888">noch kein Tipp</span>'}</div>`).join('')}</div>`;
      }

      // ----- Teams mit Biathlon-Zeit und Vorsprung -----
      const teamArr = Object.values(teams).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      if (teamArr.length) {
        const fmtS = ms => `${Math.floor(ms / 60000)}:${((ms % 60000) / 1000).toFixed(1).padStart(4, '0')}`;   // wie die Einzelzeiten, z. B. 1:29.9
        html += `<div class="card"><h2>Teams (${teamArr.length})</h2>${teamArr.map((t, i) => {
          const mem = people.filter(p => p.teamId === t.id);
          const b = teamBonus(t, people, state, true), r = teamBiathlon(t, people);
          return `<div style="margin:4px 0"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${teamColor(t.order ?? i)}"></span>
            <strong>${t.name}</strong>: ${mem.map(m => m.name).join(', ') || '–'}
            · Vorsprung <b>${b.total} s</b> (Raten ${b.guess}, Snake ${b.snake})${r.done ? ` · Biathlon ${fmtS(r.timeMs)}${r.complete ? '' : ' (unvollständig)'}` : ''}</div>`;
        }).join('')}</div>`;
      }

      html += `<div class="card">
        <h2>🎮 Minispiele testen</h2>
        <p style="font-size:0.9rem;color:#555">Zum Ausprobieren. Es wird nichts gespeichert und die Phase bleibt unverändert.</p>
        <button id="testSnake">Snake ausprobieren</button>
        <button id="testBiathlon">Biathlon-Sprint ausprobieren</button>
        <button class="secondary" id="testBiathlonReplay" ${lastBiathlon ? '' : 'disabled'}>Letzten Biathlon-Test als Wiedergabe</button>
        <a href="${baseUrl}?demo&v=${Date.now().toString(36)}" target="_blank"><button class="secondary" type="button">🏟️ Demo: einlaufen</button></a>
        <a href="${baseUrl}?demo=raten&v=${Date.now().toString(36)}" target="_blank"><button class="secondary" type="button">🏟️ Demo: Flagge raten</button></a>
        <a href="${baseUrl}?demo=finale&v=${Date.now().toString(36)}" target="_blank"><button class="secondary" type="button">🏆 Demo: Finale (Rätsel 1)</button></a>
        <button class="secondary" id="testReplay" ${lastTest ? '' : 'disabled'}>Letzten Test als Wiedergabe ansehen</button>
      </div>`;

      html += fileOptions();

      // zuletzt angelegte Person: QR-Code und Link gleich oben
      const fresh = lastAdded && participants.find(p => p.token === lastAdded);
      if (fresh) {
        const link = `${introUrl}?t=${fresh.token}`;
        html += `<div class="card" id="freshCard" style="border:3px solid #16a34a">
          <h2>✅ Angelegt: ${fresh.name}</h2>
          <p style="margin:4px 0">Bild: ${fresh.photoUrl || '–'} · Intro-Video: ${fresh.videoUrl || '– (geht direkt in die Halle)'}</p>
          ${qrImg(link, 220)}
          <a href="${link}" target="_blank">${link}</a><br>
          <button class="secondary" id="copyFresh">Link kopieren</button>
          <a href="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(link)}" target="_blank" download="qr-${fresh.name}.png"><button class="secondary" type="button">QR-Code groß öffnen</button></a>
        </div>`;
      }

      html += `<div class="card">
        <h2>Person hinzufügen</h2>
        <input id="playerName" placeholder="Name">
        <div>${mediaInputs('newPl-')}</div>
        <p class="filesHint" style="font-size:.85rem;color:#666;margin:4px 0">${filesHint()}</p>
        <button id="addPlayer">Hinzufügen</button>
      </div>`;

      html += `<div class="card">
        <h2>Weiteren Admin mit Video-Intro hinzufügen</h2>
        <p style="font-size:0.9rem;color:#555">
          Video-Datei vorher in den Ordner <code>videos/</code> im Repo hochladen, dann hier
          nur den relativen Pfad eintragen, z. B. <code>videos/admin2-intro.mp4</code>.
        </p>
        <input id="adminName" placeholder="Name">
        <input id="adminVideo" placeholder="videos/admin2-intro.mp4" style="width:260px">
        <button id="addAdmin">Hinzufügen</button>
      </div>`;

      html += `<h2>Admins mit Video-Intro (${admins.length})</h2>`;
      admins.forEach(a => {
        const introLink = `${introUrl}?t=${a.token}`;
        html += `<div class="card token-list">
          <strong>${a.name}</strong> (Admin)
          <br>Video: ${a.videoUrl}
          <br>QR-Link (spielt Video, dann Admin-Seite): <a href="${introLink}" target="_blank">${introLink}</a>
          ${qrImg(introLink)}
          <button class="danger remove" data-token="${a.token}">Entfernen</button>
        </div>`;
      });

      // ----- Finale -----
      html += `<div class="card"><h2>🏆 Finale</h2>
        <p style="font-size:.9rem;color:#555;margin:2px 0 6px">Viererteams A–D und je ein Kapitän (★). Nach „Finale freigeben“ kann jedes Team zu seinem
        eigenen Termin spielen: Der Kapitän tippt in der Halle die Tür links neben dem Pokal an, dann läuft die Uhr des Teams und alle gehen hinein.
        Mehrere Teams können gleichzeitig spielen.</p>
        <label>Richtige Waffe in Rätsel 1: <select id="riddle1Answer"><option value="">– bitte wählen –</option>
          ${WEAPONS.map(w => `<option value="${w.id}" ${state.riddle1Answer === w.id ? 'selected' : ''}>${w.name}</option>`).join('')}</select></label>
        <button class="secondary" id="saveAnswer">Speichern</button>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px;margin-top:10px">
        ${people.slice().sort(byName).map(p => `<label style="display:flex;gap:6px;align-items:center">
          <span style="flex:1">${p.name}</span>
          <select class="finSel" data-token="${p.token}"><option value="">–</option>${FINAL_TEAMS.map(L => `<option ${p.finalTeam === L ? 'selected' : ''}>${L}</option>`).join('')}</select>
          <span title="Kapitän"><input type="checkbox" class="capSel" data-token="${p.token}" ${p.finalCaptain ? 'checked' : ''}> ★</span></label>`).join('')}</div>
        <button id="saveFinal" style="margin-top:8px">Finale-Teams speichern</button>
        <div style="margin-top:10px">${FINAL_TEAMS.map(L => {
          const mem = finalMembers(L, people); if (!mem.length) return '';
          const fin = finals[L], bonus = finalBonus(L, people, state), sc = finalScoreMs(fin, bonus);
          const caps = mem.filter(m => m.finalCaptain);
          return `<div style="margin:6px 0"><strong>Team ${L}</strong>: ${mem.map(m => (m.finalCaptain ? '★ ' : '') + m.name).join(', ')}
            ${caps.length !== 1 ? '<span style="color:#b91c1c;font-weight:600"> ⚠️ genau einen Kapitän wählen</span>' : ''}
            <br><span style="font-size:.9rem">Vorsprung ${bonus} s · ${fin?.solved1At ? `✅ gelöst mit ${weaponName(fin.solvedWeapon)}, Wertung ${fmtClock(sc)}` : fin?.startedAt ? `⏳ läuft seit ${new Date(fin.startedAt).toLocaleTimeString('de-DE')}` : 'nicht gestartet'}
            ${fin?.penalty ? ` · Strafe +${fin.penalty} s (${(fin.wrong || []).map(weaponName).join(', ')})` : ''}</span>
            ${fin ? `<button class="secondary resetFinal" data-team="${L}" style="padding:4px 10px">Zurücksetzen</button>` : ''}</div>`;
        }).join('')}</div>
      </div>`;

      html += `<h2>Teilnehmer (${people.length})</h2>`;
      const snakeRank = snakeRanking(people);
      people.slice().sort(byName).forEach(p => {
        const link = `${introUrl}?t=${p.token}`;
        const t = teams[p.teamId];
        const c = country(p.flag);
        html += `<div class="card token-list">
          <strong>${p.name}</strong> ${c ? c.emoji : '❓'} ${t ? `— Team: ${t.name}` : '— noch ohne Team'}
          ${p.minigamePlayed ? `<br>Snake: bester ${p.minigameScore} 🎅 (Platz ${snakeRank.findIndex(x => x.token === p.token) + 1}, ${p.snakeTries || 1} Versuche) <button class="secondary resetTry" data-game="snake" data-token="${p.token}">Snake zurücksetzen</button>` : '<br>Snake: noch nicht gespielt'}
          ${p.biathlon?.played ? `<br>Biathlon: beste ${formatBiathlon(p.biathlon)} (${p.biathlonTries || 1}/${st.biathlonAttempts} Versuche) <button class="secondary resetTry" data-game="biathlon" data-token="${p.token}">Biathlon zurücksetzen</button>` : `<br>Biathlon: noch kein Lauf${p.biathlonTries ? ` (${p.biathlonTries} Versuche)` : ''}`}
          <br><a href="${link}" target="_blank">${link}</a>
          ${mediaFields(p)}
          ${qrImg(link)}
          <button class="danger remove" data-token="${p.token}">Entfernen</button>
        </div>`;
      });

      root.innerHTML = html;

      function newMedia(prefix) {
        const v = c => document.querySelector('.' + prefix + c)?.value.trim() || null;
        return { photoUrl: v('photo'), videoUrl: v('video'), hair: v('hair') || 'kurz' };
      }
      document.getElementById('copyFresh')?.addEventListener('click', e => {
        const link = `${introUrl}?t=${lastAdded}`;
        navigator.clipboard?.writeText(link).then(() => { e.target.textContent = 'Kopiert ✓'; }).catch(() => prompt('Link:', link));
      });
      if (repoFiles.loaded) refreshFileUi();
      document.getElementById('resetArrivals')?.addEventListener('click', async () => {
        if (!confirm('Alle Teilnehmer wieder auf "noch nicht da" setzen? Die Halle ist danach leer, jeder läuft beim nächsten Öffnen neu ein und sieht sein Intro-Video wieder wie beim ersten Mal (nicht überspringbar).')) return;
        for (const p of participants.filter(x => x.role !== 'admin')) await updateDoc(doc(db, 'participants', p.token), { arrivedAt: null, videoViews: 0 });
        loadAll();
      });
      document.getElementById('freshStart')?.addEventListener('click', async () => {
        if (!confirm('Alles für das Event frisch machen?\n\n• Halle leer, QR-Codes wie neu (Einlauf + Intro-Video)\n• Snake- und Biathlon-Ergebnisse, Tipps und Finale-Spielstände gelöscht\n• Teams gelöscht\n• Chat gelöscht\n• Phase zurück auf "setup"\n\nPersonen, Namen, Bilder, Videos und QR-Codes bleiben erhalten.')) return;
        for (const p of participants.filter(x => x.role !== 'admin')) {
          await updateDoc(doc(db, 'participants', p.token), {
            arrivedAt: null, videoViews: 0, teamId: null, pickedAt: null, agent: false, guess: null, guessAt: null,
            minigamePlayed: false, minigameScore: null, minigameAt: null, snakeReplay: null, snakeTries: 0, biathlon: null, biathlonTries: 0
          });
        }
        for (const t of Object.values(teams)) await deleteDoc(doc(db, 'teams', t.id));
        for (const L of Object.keys(finals)) await deleteDoc(doc(db, 'finals', L));
        for (const d of (await getDocs(collection(db, 'chat'))).docs) await deleteDoc(d.ref);
        await setDoc(doc(db, 'state', 'current'), { phase: 'setup', benchSeats: state.benchSeats ?? 20, guessBonus: st.guessBonus, snakeBonus: st.snakeBonus, biathlonAttempts: st.biathlonAttempts, riddle1Answer: state.riddle1Answer ?? null });
        alert('Fertig! Alles ist frisch für das Event.');
        loadAll();
      });

      document.querySelectorAll('.saveMedia').forEach(btn => {
        btn.addEventListener('click', async () => {
          const t = btn.dataset.token;
          const photoUrl = document.querySelector(`.photoIn[data-token="${t}"]`).value.trim() || null;
          const videoUrl = document.querySelector(`.videoIn[data-token="${t}"]`).value.trim() || null;
          const hair = document.querySelector(`.hairIn[data-token="${t}"]`).value;
          const agentUrl = document.querySelector(`.agentIn[data-token="${t}"]`).value.trim() || null;
          const name = document.querySelector(`.nameIn[data-token="${t}"]`).value.trim();
          if (!name) { alert('Der Name darf nicht leer sein.'); return; }
          await updateDoc(doc(db, 'participants', t), { name, photoUrl, videoUrl, hair, agentUrl });
          const teamIn = document.querySelector(`.teamIn[data-token="${t}"]`);
          if (teamIn && teamIn.value.trim()) await updateDoc(doc(db, 'teams', teamIn.dataset.team), { name: teamIn.value.trim() });
          loadAll();
        });
      });

      document.getElementById('testSnake').addEventListener('click', () => {
        playSnake({
          testMode: true, photoUrl: 'faces/face1.png', attempts: Infinity,
          onFinish: r => { lastTest = r; },
          onClose: () => render(state, teams, participants)
        });
      });
      document.getElementById('testReplay').addEventListener('click', () => {
        if (lastTest) playReplay({ name: 'Testversuch', score: lastTest.score, replay: lastTest.replay, photoUrl: 'faces/face1.png' });
      });

      document.getElementById('addPlayer').addEventListener('click', async () => {
        const name = document.getElementById('playerName').value.trim();
        if (!name) return;
        const token = genToken();
        await setDoc(doc(db, 'participants', token), { name, role: 'player', teamId: null, ...newMedia('newPl-') });
        lastAdded = token;
        await loadAll();
        document.getElementById('freshCard')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      document.getElementById('addAdmin').addEventListener('click', async () => {
        const name = document.getElementById('adminName').value.trim();
        const videoUrl = document.getElementById('adminVideo').value.trim();
        if (!name || !videoUrl) return;
        const token = genToken();
        await setDoc(doc(db, 'participants', token), {
          name, role: 'admin', videoUrl, redirectTo: 'admin.html'
        });
        loadAll();
      });

      document.querySelectorAll('.resetTry').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Alle Versuche dieser Person in diesem Spiel löschen? Sie fängt dann von vorne an.')) return;
          await updateDoc(doc(db, 'participants', btn.dataset.token), btn.dataset.game === 'biathlon'
            ? { biathlon: null, biathlonTries: 0 } : { minigamePlayed: false, minigameScore: null, minigameAt: null, snakeReplay: null, snakeTries: 0 });
          loadAll();
        });
      });

      document.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', async () => {
          await deleteDoc(doc(db, 'participants', btn.dataset.token));
          loadAll();
        });
      });

      document.getElementById('testBiathlon').addEventListener('click', () => {
        playBiathlon({ testMode: true, photoUrl: 'faces/face1.png', attempts: 3, onFinish: r => { lastBiathlon = r; },
          onClose: () => render(state, teams, participants) });
      });
      document.getElementById('testBiathlonReplay').addEventListener('click', () => {
        if (lastBiathlon) playBiathlonReplay({ name: 'Testlauf', result: lastBiathlon, photoUrl: 'faces/face1.png' });
      });

      // ----- Ablauf -----
      const setPhase = async (phase, extra = {}) => { await setDoc(doc(db, 'state', 'current'), { ...state, ...extra, phase }); loadAll(); };
      document.getElementById('toSnake').addEventListener('click', () => setPhase('snake'));
      document.getElementById('toGuess').addEventListener('click', () => {
        const n = people.filter(p => !p.minigamePlayed).length;
        if (!confirm(`Snake beenden und das Raten starten?${n ? `\n\n${n} Person(en) haben noch nicht gespielt.` : ''}\nDanach kann niemand mehr Snake spielen.`)) return;
        setPhase('guess');
      });
      document.getElementById('toReveal').addEventListener('click', async () => {
        const missing = people.filter(p => !p.guess).length, noFlag = people.filter(p => !p.flag).length;
        if (!confirm(`Jetzt auflösen? Personen mit gleicher Flagge werden ein Team.${missing ? `\n\n${missing} Person(en) haben noch nicht getippt.` : ''}${noFlag ? `\n⚠️ ${noFlag} Person(en) haben keine Flagge!` : ''}`)) return;
        await revealTeams(db, people, state);
        loadAll();
      });
      document.getElementById('toBiathlon').addEventListener('click', () => setPhase('biathlon'));
      document.getElementById('toDone').addEventListener('click', () => {
        if (!confirm('Biathlon beenden? Danach sind keine Läufe mehr möglich.')) return;
        setPhase('done');
      });
      document.getElementById('toFinal').addEventListener('click', () => {
        if (!state.riddle1Answer) { alert('Bitte zuerst unten bei „Finale“ die richtige Waffe für Rätsel 1 festlegen.'); return; }
        setPhase('final');
      });
      document.getElementById('saveAnswer').addEventListener('click', async () => {
        await setDoc(doc(db, 'state', 'current'), { ...state, riddle1Answer: document.getElementById('riddle1Answer').value || null });
        loadAll();
      });
      document.getElementById('saveFinal').addEventListener('click', async () => {
        for (const sel of document.querySelectorAll('.finSel')) {
          const t = sel.dataset.token, p = people.find(x => x.token === t);
          const cap = document.querySelector(`.capSel[data-token="${t}"]`).checked;
          if ((p.finalTeam || '') !== sel.value || !!p.finalCaptain !== cap)
            await updateDoc(doc(db, 'participants', t), { finalTeam: sel.value || null, finalCaptain: cap });
        }
        loadAll();
      });
      document.querySelectorAll('.resetFinal').forEach(btn => btn.addEventListener('click', async () => {
        if (!confirm(`Finale von Team ${btn.dataset.team} zurücksetzen? Uhr, Strafsekunden und Lösung werden gelöscht, das Team kann neu starten.`)) return;
        await deleteDoc(doc(db, 'finals', btn.dataset.team));
        loadAll();
      }));
      document.getElementById('setPhase').addEventListener('click', () => {
        const ph = document.getElementById('phaseSel').value;
        if (!confirm(`Phase direkt auf „${PHASE_NAMES[ph]}“ setzen? (Teams werden dabei nicht verändert.)`)) return;
        setPhase(ph);
      });
      document.getElementById('saveSettings').addEventListener('click', async () => {
        const guessBonus = Math.max(0, Number(document.getElementById('guessBonus').value) || 0);
        const snakeBonus = document.getElementById('snakeBonus').value.split(/[,;\s]+/).map(Number).filter(n => n >= 0 && !isNaN(n));
        const biathlonAttempts = Math.max(1, Math.min(10, Number(document.getElementById('biathlonAttempts').value) || DEFAULTS.biathlonAttempts));
        await setDoc(doc(db, 'state', 'current'), { ...state, guessBonus, snakeBonus, biathlonAttempts });
        loadAll();
      });
      // ----- Flaggen -----
      document.getElementById('saveFlags').addEventListener('click', async () => {
        for (const sel of document.querySelectorAll('.flagSel')) {
          const p = people.find(x => x.token === sel.dataset.token);
          if ((p.flag || '') !== sel.value) await updateDoc(doc(db, 'participants', p.token), { flag: sel.value || null });
        }
        loadAll();
      });
      document.getElementById('randomFlags').addEventListener('click', () => {
        if (!confirm('Flaggen zufällig neu verteilen (je 2 Personen pro Flagge)? Danach noch „Flaggen speichern“ drücken.')) return;
        const sels = [...document.querySelectorAll('.flagSel')].sort(() => Math.random() - 0.5);
        const pool = COUNTRIES.map(c => c[0]).sort(() => Math.random() - 0.5);
        sels.forEach((sel, i) => { sel.value = pool[Math.floor(i / 2) % pool.length]; });
      });

      document.getElementById('saveSeats').addEventListener('click', async () => {
        const n = Math.max(7, Math.min(40, Number(document.getElementById('benchSeats').value) || 20));
        await setDoc(doc(db, 'state', 'current'), { ...state, benchSeats: n });
        loadAll();
      });
      getDocs(collection(db, 'chat')).then(snap => {
        const el = document.getElementById('chatCount'); if (el) el.textContent = snap.size;
      }).catch(() => {});
      document.getElementById('clearChat').addEventListener('click', async () => {
        if (!confirm('Alle Chat-Nachrichten löschen?')) return;
        const snap = await getDocs(collection(db, 'chat'));
        for (const d of snap.docs) await deleteDoc(d.ref);
        loadAll();
      });

      document.getElementById('resetAll').addEventListener('click', async () => {
        if (!confirm('Wirklich ALLE Teilnehmer, Teams und den Status löschen?')) return;
        for (const p of participants) await deleteDoc(doc(db, 'participants', p.token));
        for (const t of Object.values(teams)) await deleteDoc(doc(db, 'teams', t.id));
        await setDoc(doc(db, 'state', 'current'), { phase: 'setup', benchSeats: state.benchSeats ?? 20, guessBonus: st.guessBonus, snakeBonus: st.snakeBonus, biathlonAttempts: st.biathlonAttempts, riddle1Answer: state.riddle1Answer ?? null });
        for (const d of (await getDocs(collection(db, 'chat'))).docs) await deleteDoc(d.ref);
        loadAll();
      });
    }

    // ===== Zugangsschutz =====
    // Prüfsumme von "haeckelsche:" + Passwort (klein geschrieben). Das Passwort selbst steht nirgends im Code.
    const PW_HASH = 'da5ec80671995a0d15f75891fcef4c8c90c3665d0c48269a108659917660d18d';
    const OK_KEY = 'haeckelsche-admin-ok';

    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function remember() { try { localStorage.setItem(OK_KEY, PW_HASH); } catch (e) {} }
    function remembered() { try { return localStorage.getItem(OK_KEY) === PW_HASH; } catch (e) { return false; } }

    async function gate() {
      if (remembered()) return loadAll();

      // Über den QR-Code eines Admins (intro.html → admin.html?t=…): kein Passwort nötig
      const t = new URLSearchParams(location.search).get('t');
      if (t) {
        const snap = await getDoc(doc(db, 'participants', t));
        if (snap.exists() && snap.data().role === 'admin') {
          remember();
          history.replaceState(null, '', location.pathname); // Token aus der Adresszeile entfernen
          return loadAll();
        }
      }

      root.innerHTML = `<div class="card" style="max-width:360px">
        <h2>🔒 Admin-Bereich</h2>
        <p>Bitte Passwort eingeben.</p>
        <form id="pwForm">
          <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" style="width:100%">
          <button type="submit" style="margin-top:8px">Öffnen</button>
          <p id="pwErr" style="color:#b91c1c;display:none">Falsches Passwort.</p>
        </form></div>`;
      document.getElementById('pw').focus();
      document.getElementById('pwForm').addEventListener('submit', async e => {
        e.preventDefault();
        const val = document.getElementById('pw').value.trim().toLowerCase();
        if (await sha256('haeckelsche:' + val) === PW_HASH) { remember(); loadAll(); }
        else document.getElementById('pwErr').style.display = 'block';
      });
    }

    gate();
  </script>
</body>
</html>
